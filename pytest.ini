# pytest.ini - Configuração do Pytest

[pytest]
# Diretórios de teste
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de execução
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --asyncio-mode=auto

# Markers personalizados
markers =
    unit: Testes unitários (funções isoladas)
    integration: Testes de integração (múltiplos componentes)
    e2e: Testes end-to-end (fluxo completo)
    slow: Testes lentos (> 1s)
    auth: Testes de autenticação
    database: Testes que usam banco de dados
    api: Testes de API

# Configuração de asyncio
asyncio_mode = auto

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
