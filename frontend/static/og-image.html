<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FraLib OS - Open Graph Image</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #0a0714 0%, #1a0a30 50%, #0a0714 100%);
  font-family: 'DM Sans', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.container {
  width: 1100px;
  height: 530px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  padding: 40px;
}
.logo {
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 32px;
  box-shadow: 0 0 60px rgba(147, 51, 234, 0.5);
}
.logo svg { width: 70px; height: 70px; }
.title {
  font-family: 'Press Start 2P', monospace;
  font-size: 36px;
  background: linear-gradient(135deg, #a855f7, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 24px;
  text-align: center;
  line-height: 1.4;
}
.subtitle {
  font-size: 24px;
  color: #f0f0f5;
  text-align: center;
  margin-bottom: 32px;
  max-width: 800px;
}
.highlight {
  color: #f59e0b;
  font-weight: 700;
}
.features {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-top: 16px;
}
.feature {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #b0b0c8;
  font-size: 16px;
}
.feature-icon {
  width: 24px;
  height: 24px;
  background: rgba(6, 182, 212, 0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.feature-icon svg { width: 14px; height: 14px; stroke: #06b6d4; }
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.orb-purple {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(147, 51, 234, 0.4), transparent 70%);
  top: -100px;
  right: -100px;
}
.orb-cyan {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(0, 255, 179, 0.2), transparent 70%);
  bottom: -50px;
  left: -50px;
}
.price-badge {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 24px;
}
.brand {
  position: absolute;
  bottom: 20px;
  right: 40px;
  color: #44445a;
  font-size: 14px;
  font-weight: 500;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="orb orb-purple"></div>
<div class="orb orb-cyan"></div>

<div class="container">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </div>

  <h1 class="title">FraLib OS</h1>

  <p class="subtitle">
    Crie e Venda Sites <span class="highlight">Automaticamente</span><br>
    Ganhe <span class="highlight">R$ 3.000 a R$ 10.000/mês</span>
  </p>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        </svg>
      </div>
      <span>Sites com IA</span>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <span>Prospecção Automática</span>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
        </svg>
      </div>
      <span>WhatsApp Automático</span>
    </div>
  </div>

  <div class="price-badge">Teste Grátis por 7 Dias</div>
</div>

<span class="brand">seunegociofralib.site</span>
</body>
</html>
