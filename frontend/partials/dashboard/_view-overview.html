  <!-- ========== VIEW: VISÃO GERAL ========== -->
  <section class="view-section" id="view-overview">

    <h2 class="section-title">&#9632; ANALYTICS &amp; VISÃO GERAL</h2>

    <!-- Filtros de período -->
    <div class="period-filters">
      <span class="period-label">PERÍODO:</span>
      <button class="btn-period" data-periodo="hoje" onclick="trocarPeriodo('hoje',this)">HOJE</button>
      <button class="btn-period" data-periodo="semana" onclick="trocarPeriodo('semana',this)">7 DIAS</button>
      <button class="btn-period active" data-periodo="mes" onclick="trocarPeriodo('mes',this)">MÊS</button>

    <!-- Gráficos -->

      <div class="chart-card full-width">

      </div>
      <div class="chart-card">
        <div class="chart-title">&#9632; PERFORMANCE POR CIDADE (TOP 8)</div>
        <div class="chart-container"><canvas id="chartCidade"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">&#9679; DISTRIBUIÇÃO POR NICHO</div>
        <div class="chart-container"><canvas id="chartNicho"></canvas></div>
      </div>
    </div>

    <!-- Funil de conversão -->
    <h2 class="section-title">&#9660; FUNIL DE CONVERSÃO</h2>
    <div class="funnel-wrap" id="funnelWrap">
      <div style="font-size:12px;color:var(--fl-text-dim);padding:16px">Carregando funil...</div>
    </div>

  </section>
