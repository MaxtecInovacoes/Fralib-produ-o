/* ══ ESTADO GLOBAL ════════════════════════════════════════════════ */
var periodoAtual = 'mes';

/* ══ AUTH GUARD ═══════════════════════════════════════════════════ */
(function(){
  var token = localStorage.getItem('fralib_token');
  if (!token) { window.location.href = '/login.html'; return; }
  
  // Usar URL absoluta para garantir HTTPS via proxy
  var apiUrl = window.location.protocol + '//' + window.location.host + '/api/auth/me';
  
  fetch(apiUrl, { 
    headers: { 'Authorization': 'Bearer ' + token },
    credentials: 'same-origin'
  })
    .then(function(r){
      if (!r.ok) {
        console.error('[Auth] Status:', r.status, r.statusText);
      }
      if (r.status === 401) { 
        console.warn('[Auth] Token inválido, redirecionando para login');
        localStorage.removeItem('fralib_token'); 
        window.location.href = '/login.html'; 
      }
      if (r.status === 403) { 
        alert('Seu plano venceu. Renove para continuar.'); 
        window.location.href = '/planos.html'; 
      }
      return r.json();
    })
    .then(function(data){
      if (data && data.email) {
        console.log('[Auth] Usuário autenticado:', data.email);
      }
    })
    .catch(function(err){
      console.error('[Auth] Erro ao validar token:', err);
      // Não deslogar em caso de erro de rede temporário
      // Apenas logar o erro para debug
    });
})();

/* ══ HELPER FETCH AUTENTICADO ═════════════════════════════════════ */
function authFetch(url, opts) {
  var options = opts || {};
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + localStorage.getItem('fralib_token');
  options.credentials = 'same-origin';
  
  // Garantir URL absoluta
  var fullUrl = url;
  if (url.startsWith('/')) {
    fullUrl = window.location.protocol + '//' + window.location.host + url;
  }
  
  return fetch(fullUrl, options).then(function(r) {
    if (r.status === 401) {
      window.__fralibAuthExpired = true;
      localStorage.removeItem('fralib_token');
      window.location.href = '/login.html';
      throw new Error('Unauthorized');
    }
    return r;
  }).catch(function(err){
    console.error('[authFetch] Erro na requisição:', url, err);
    throw err;
  });
}


/* ══ SANITIZAÇÃO XSS ═══════════════════════════════════════════════ */
function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function sanitizeUrl(url) {
  if (!url) return '';
  var trimmed = (url || '').trim();
  if (trimmed.toLowerCase().startsWith('javascript:') ||
      trimmed.toLowerCase().startsWith('data:') ||
      trimmed.toLowerCase().startsWith('vbscript:')) {
    return '#';
  }
  return trimmed;
}

/* ══ KPIs — 6 cards ═══════════════════════════════════════════════ */
async function carregarKPIs() {
  try {
    var resStatus = authFetch('/api/pipeline/status').then(function(r){ return r.json(); });
    var resAnalytics = authFetch('/api/pipeline/analytics/overview?periodo=mes').then(function(r){ return r.json(); });
    var status = await resStatus;
    var analytics = await resAnalytics;
    lastStatus = status;

    var set = function(id, val){ var el = document.getElementById(id); if(el) el.textContent = val; };

    // KPI 1 — Total de Leads
    set('kpi-leads', (analytics.total_leads != null ? analytics.total_leads : (status.totalLeads || 0)).toLocaleString('pt-BR'));
    set('kpi-leads-sub', status.rodando ? '🟢 pipeline ativo' : '⚪ pipeline ocioso');

    // KPI 2 — Sites Gerados
    set('kpi-sites', (status.totalSites || 0).toLocaleString('pt-BR'));
    set('kpi-sites-sub', 'deployados na Vercel');

    // KPI 3 — Receita
    set('kpi-receita', 'R$ ' + (analytics.receita || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0 }));
    set('kpi-receita-sub', (analytics.conversao || 0) + '% de conversão');

    // KPI 4 — Contatos Enviados
    set('kpi-contatos', (status.totalEnviados || 0).toLocaleString('pt-BR'));
    set('kpi-contatos-sub', 'mensagens disparadas');

    // KPI 5 — Ciclo Atual
    set('kpi-ciclo', '#' + (status.cicloAtual || 0));
    set('kpi-ciclo-sub', status.rodando ? 'em execução agora' : (status.cicloAtual > 0 ? 'último ciclo' : 'nenhum ciclo ainda'));

    // KPI 6 — Taxa de Conversão
    set('kpi-conversao', (analytics.conversao || 0) + '%');
    set('kpi-conversao-sub', 'leads com site gerado');

    // Atualizar status do pipeline nos botões
    atualizarStatusPipeline(status.rodando, status.pausado);

    // Atualizar badge UTI
    atualizarUtiBadge();

  } catch(e){ console.warn('KPIs:', e.message); }
}

/* ══ STATUS DO PIPELINE (botões header) ════════════════════════════ */
function atualizarStatusPipeline(rodando, pausado) {
  var statusEl = document.getElementById('pipelineStatus');
  var btnIniciar = document.getElementById('btnIniciar');
  var btnPausar = document.getElementById('btnPausar');
  var btnRetomar = document.getElementById('btnRetomar');

  if (rodando && !pausado) {
    if (statusEl) { statusEl.textContent = '⬤ RODANDO'; statusEl.className = 'pipeline-status running'; }
    if (btnIniciar) btnIniciar.style.display = 'none';
    if (btnPausar) btnPausar.style.display = '';
    if (btnRetomar) btnRetomar.style.display = 'none';
  } else if (pausado) {
    if (statusEl) { statusEl.textContent = '⏸ PAUSADO'; statusEl.className = 'pipeline-status paused'; }
    if (btnIniciar) btnIniciar.style.display = 'none';
    if (btnPausar) btnPausar.style.display = 'none';
    if (btnRetomar) btnRetomar.style.display = '';
  } else {
    if (statusEl) { statusEl.textContent = '○ IDLE'; statusEl.className = 'pipeline-status idle'; }
    if (btnIniciar) btnIniciar.style.display = '';
    if (btnPausar) btnPausar.style.display = 'none';
    if (btnRetomar) btnRetomar.style.display = 'none';
  }
}

/* ══ TOAST NOTIFICATIONS ════════════════════════════════════════ */

}

  if (btn) btn.classList.add('active');

/* ══ CHARTS — Chart.js ═════════════════════════════════════════════ */
async function carregarCharts(periodo) {
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js não carregado');
    return;
  }
  try {
    var data = await authFetch('/api/pipeline/analytics/overview?periodo=' + (periodo || 'mes')).then(function(r){ return r.json(); });
    renderLinhaChart(data.por_dia || []);
    renderCidadeChart(data.por_cidade || []);
    renderNichoChart(data.por_nicho || []);
    renderFunil(data);
  } catch(e) { console.warn('Charts:', e.message); }
}

function destroyChart(id) {
  if (chartsInstances[id]) {
    chartsInstances[id].destroy();
    delete chartsInstances[id];
  }
}

var CHART_COLORS = [
  'rgba(147,51,234,0.85)',
  'rgba(0,255,179,0.85)',
  'rgba(255,184,0,0.85)',
  'rgba(56,189,248,0.85)',
  'rgba(239,68,68,0.85)',
  'rgba(34,197,94,0.85)',
  'rgba(245,158,11,0.85)',
  'rgba(192,132,252,0.85)'
];

var CHART_SCALES = {
  x: {
    grid: { color: 'rgba(255,255,255,0.05)' },
    ticks: { color: '#8888a0', font: { family: "'JetBrains Mono', monospace", size: 10 } }
  },
  y: {
    grid: { color: 'rgba(255,255,255,0.05)' },
    ticks: { color: '#8888a0', font: { family: "'JetBrains Mono', monospace", size: 10 } },
    beginAtZero: true
  }
};

function renderLinhaChart(porDia) {
  destroyChart('linha');
  var canvas = document.getElementById('chartLinha');
  if (!canvas) return;
  chartsInstances['linha'] = new Chart(canvas, {
    type: 'line',
    data: {
      labels: porDia.map(function(x){ return x.dia ? x.dia.slice(5) : ''; }),
      datasets: [{
        label: 'Leads',
        data: porDia.map(function(x){ return x.total; }),
        borderColor: 'rgba(147,51,234,0.9)',
        backgroundColor: 'rgba(147,51,234,0.08)',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: '#c084fc',
        pointRadius: 4,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: CHART_SCALES
    }
  });
}

function renderCidadeChart(porCidade) {
  destroyChart('cidade');
  var canvas = document.getElementById('chartCidade');
  if (!canvas) return;
  chartsInstances['cidade'] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: porCidade.map(function(x){ return x.nome || '—'; }),
      datasets: [{
        label: 'Leads',
        data: porCidade.map(function(x){ return x.total; }),
        backgroundColor: porCidade.map(function(_, i){ return CHART_COLORS[i % CHART_COLORS.length]; }),
        borderWidth: 0,
        borderRadius: 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: CHART_SCALES
    }
  });
}

function renderNichoChart(porNicho) {
  destroyChart('nicho');
  var canvas = document.getElementById('chartNicho');
  if (!canvas) return;
  chartsInstances['nicho'] = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: porNicho.map(function(x){ return x.nome || '—'; }),
      datasets: [{
        data: porNicho.map(function(x){ return x.total; }),
        backgroundColor: CHART_COLORS.slice(0, porNicho.length),
        borderColor: '#0a0714',
        borderWidth: 3
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: '#8888a0',
            font: { size: 10, family: "'JetBrains Mono', monospace" },
            padding: 12,
            boxWidth: 12
          }
        }
      },
      cutout: '60%'
    }
  });
}

function renderFunil(analytics) {
  var wrap = document.getElementById('funnelWrap');
  if (!wrap) return;

  var totalLeads = analytics.total_leads || 0;
  var totalSites = lastStatus.totalSites || Math.round(totalLeads * (analytics.conversao || 0) / 100);
  var totalEnviados = lastStatus.totalEnviados || 0;

  var steps = [
    { label: 'LEADS PROSPECTADOS', count: totalLeads, color: 'var(--fl-purple)' },
    { label: 'SITES GERADOS', count: totalSites, color: 'var(--cyan)' },
    { label: 'WHATSAPP ENVIADOS', count: totalEnviados, color: 'var(--info)' }
  ];

  var maxCount = steps[0].count || 1;

  wrap.innerHTML = steps.map(function(s) {
    var pct = maxCount > 0 ? Math.min(100, Math.round((s.count / maxCount) * 100)) : 0;
    return '<div class="funnel-step">' +
      '<span class="funnel-label">' + s.label + '</span>' +
      '<div class="funnel-bar-wrap">' +
        '<div class="funnel-bar" style="width:' + pct + '%;background:' + s.color + '"></div>' +
      '</div>' +
      '<span class="funnel-count" style="color:' + s.color + '">' + s.count.toLocaleString('pt-BR') + '</span>' +
    '</div>';
  }).join('');
}

/* ══ KANBAN COM LEADS REAIS ════════════════════════════════════════ */
function getColuna(lead) {
  var s = (lead.status || '').toLowerCase();
  var stage = (lead.sdr_stage || '').toLowerCase();
  if (s === 'won' || s === 'convertido') return 'ganhos';
  if (s === 'descartado' || s === 'rejeitado' || s === 'erro') return 'perdidos';
  if (s === 'negociando' || stage === 'negotiation') return 'negociacao';
  if ((lead.score || 0) >= 80 && (s === 'contatado' || s === 'enviado')) return 'qualificados';
  if (stage === 'rapport' || stage === 'education') return 'followup2';
  return 'followup1';
}

function criarCard(lead) {
  if (!lead || !lead.id) return null;
  var d = document.createElement('div');
  d.className = 'lead-card';
  d.draggable = true;
  d.dataset.lead = lead.id;
  d.setAttribute('role', 'button');
  d.setAttribute('tabindex', '0');
  d.setAttribute('aria-label', 'Lead: ' + (lead.nome || 'Sem nome'));
  d.onclick = function(){ if (!draggedCard) openModalReal(lead); };
  d.onkeydown = function(e){ if (e.key === 'Enter' && !draggedCard) openModalReal(lead); };

  var safeUrl = sanitizeUrl(lead.url_site);
  d.innerHTML =
    '<div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--fl-text)">' + escapeHtml(lead.nome || 'Lead') + '</div>' +
    '<div style="font-size:11px;color:var(--fl-text-dim)">' + escapeHtml(lead.segmento || '') + (lead.cidade ? ' · ' + escapeHtml(lead.cidade) : '') + '</div>' +
    (lead.score ? '<div style="font-size:11px;margin-top:6px;color:var(--gold)">⭐ ' + escapeHtml(String(lead.score)) + ' pts</div>' : '') +
    (safeUrl && safeUrl !== '#'
      ? '<div style="font-size:11px;margin-top:6px"><a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--fl-purple-300)" onclick="event.stopPropagation()">🌐 Ver site</a></div>'
      : '<div style="font-size:10px;margin-top:6px;color:var(--fl-text-dim)">sem site</div>'
    ) +
    ((lead.sdr_stage || '').toLowerCase() === 'pendente_wpp'
      ? '<div style="margin-top:8px"><button onclick="event.stopPropagation();enviarMensagemLead('' + lead.id + '',this)" style="background:#22c55e;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;width:100%">📱 Enviar Mensagem</button></div>'
      : ''
    );
  initDrag(d);
  return d;
}

async function enviarMensagemLead(leadId, btn) {
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    var r = await authFetch('/api/leads/' + leadId + '/enviar-mensagem', {method:'POST'});
    var data = await r.json();
    if (r.ok && data.ok) {
      btn.textContent = '✅ Enviado!';
      btn.style.background = '#6b7280';
      setTimeout(function(){ carregarKanban(); }, 2000);
    } else {
      btn.textContent = '❌ ' + (data.detail || 'Erro');
      btn.style.background = '#ef4444';
      setTimeout(function(){ btn.textContent = '📱 Enviar Mensagem'; btn.style.background = '#22c55e'; btn.disabled = false; }, 3000);
    }
  } catch(e) {
    btn.textContent = '❌ Erro';
    btn.style.background = '#ef4444';
    setTimeout(function(){ btn.textContent = '📱 Enviar Mensagem'; btn.style.background = '#22c55e'; btn.disabled = false; }, 3000);
  }
}

async function carregarKanban() {
  try {
    var data = await authFetch('/api/dashboard/crm').then(function(r){ return r.json(); });
    var emptyEl = document.getElementById('emptyState');

    // data = { fila:[], intro:[], f1:[], f2:[], negotiation:[], qualificado:[], lost:[], won:[] }
    var mapeamento = {
      fila:        data.fila        || [],
      intro:       data.intro       || [],
      followup1:   data.f1          || [],
      followup2:   data.f2          || [],
      negociacao:  data.negotiation || [],
      qualificados:data.qualificado || [],
      perdidos:    data.lost        || [],
      ganhos:      data.won         || []
    };

    var totalLeads = Object.values(mapeamento).reduce(function(acc, arr){ return acc + arr.length; }, 0);
    if (totalLeads === 0) {
      if (emptyEl) emptyEl.classList.add('show');
      return;
    }
    if (emptyEl) emptyEl.classList.remove('show');

    var cols = {};
    document.querySelectorAll('.kanban-col-body').forEach(function(c){ cols[c.dataset.col] = c; });
    Object.values(cols).forEach(function(c){ c.innerHTML = ''; });

    Object.keys(mapeamento).forEach(function(colKey){
      var col = cols[colKey];
      if (!col) return;
      mapeamento[colKey].forEach(function(lead){
        // normaliza campo nicho→segmento para criarCard funcionar
        if (!lead.segmento && lead.nicho) lead.segmento = lead.nicho;
        col.appendChild(criarCard(lead));
      });
    });

    updateCounts();
  } catch(e){ console.warn('Kanban:', e.message); }
}

/* ══ MODAL COM DADOS REAIS ═════════════════════════════════════════ */
function openModalReal(lead) {

  set('modalLeadName', escapeHtml(lead.nome || 'Lead'));
  set('modalNicho', escapeHtml(lead.segmento || '—'));
  set('modalCidade', escapeHtml(lead.cidade || '—'));
  set('modalTelefone', escapeHtml(lead.telefone_whatsapp || lead.telefoneWhatsapp || lead.telefone || '—'));
  set('modalScore', lead.score ? escapeHtml(String(lead.score)) + ' pts' : '—');

  var urlEl = document.getElementById('modalUrl');
  if (urlEl) {
    var safeUrl = sanitizeUrl(lead.url_site);
    if (safeUrl && safeUrl !== '#') {
      urlEl.innerHTML = '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--cyan)">' + escapeHtml(safeUrl) + '</a>';
    } else {
      urlEl.textContent = 'Site ainda não gerado';
    }
  }

  // Reset chat
  var chatArea = document.getElementById('chatArea');
  if (chatArea) {
    chatArea.innerHTML = '<div class="chat-msg sent">Olá! Sou o Bryan, assistente digital da FraLib. Vi que você tem um negócio na região. Posso criar um site profissional grátis para você avaliar?<div class="time">--:--</div></div>';
  }

  document.getElementById('modalOverlay').classList.add('open');
  switchTab('chat');
}

function abrirSiteModal() {
  if (leadAtualModal && leadAtualModal.url_site) {
    var safeUrl = sanitizeUrl(leadAtualModal.url_site);
    if (safeUrl && safeUrl !== '#') {
      window.open(safeUrl, '_blank', 'noopener,noreferrer');
    } else {
      alert('URL do site inválida.');
    }
  } else {
    alert('Este lead ainda não tem um site gerado.');
  }
}

function abrirWhatsApp() {
  if (!leadAtualModal) return;
  var tel = (leadAtualModal.telefone_whatsapp || leadAtualModal.telefoneWhatsapp || leadAtualModal.telefone || '').replace(/\D/g, '');
  if (tel) {
    window.open('https://wa.me/' + tel, '_blank');
  } else {
    alert('Telefone não disponível para este lead.');
  }
}

var STATUS_LABEL = {

  revisao_manual:   '📉 Score insuficiente',
  processando:      '🔄 Travado',
  pendente_manual:  '✋ Qualificação manual',

function trocarAbaUTI(aba) {
  document.getElementById('uti-painel-falhas').style.display      = aba === 'falhas'      ? '' : 'none';
  document.getElementById('uti-painel-descartados').style.display = aba === 'descartados' ? '' : 'none';

    var descartados = res.descartados || [];
    var total = falhas.length + descartados.length;

    if (countEl) countEl.textContent = total + ' leads';
    var bF = document.getElementById('badge-falhas');
    var bD = document.getElementById('badge-descartados');

          '<td style="font-size:11px">' + escapeHtml(l.nicho || '—') + '</td>' +

      tbodyDesc.innerHTML = descartados.map(function(l){

          '<td style="font-weight:600;color:var(--fl-text);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (safeNome || '—') + '</td>' +
          '<td style="font-size:11px">' + (safeNicho || '—') + '</td>' +

async function requalificarLead(id, btn) {
  if (!id) return;
  var row = document.getElementById('uti-row-' + id);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ NA FILA...'; btn.style.opacity = '0.6'; }

  try {
    var res = await authFetch('/api/pipeline/reprocessar/' + id, { method: 'POST' }).then(function(r){ return r.json(); });
    if (res.ok) {
      if (btn) { btn.textContent = '🔄 PROCESSANDO...'; btn.style.color = 'var(--cyan)'; }
      if (row) row.style.opacity = '0.5';
      // Verifica status a cada 10s por até 10min
      var tentativas = 0;
      var check = setInterval(async function(){
        tentativas++;
        if (tentativas > 60) { clearInterval(check); return; }
        try {
          var fila = await authFetch('/api/pipeline/fila-reprocessamento').then(function(r){ return r.json(); });
          var aindaNaFila = (fila.fila || []).some(function(i){ return String(i.id) === String(id); });
          if (!aindaNaFila && !fila.rodando) {
            clearInterval(check);
            if (btn) { btn.textContent = '✓ CONCLUÍDO'; btn.style.color = 'var(--success)'; }
            setTimeout(carregarUTI, 2000);
            setTimeout(carregarKanban, 3000);
          }
        } catch(_) {}
      }, 10000);
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '▶ REPROCESSAR'; btn.style.opacity = '1'; }
      alert(res.erro || 'Erro ao adicionar à fila.');
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '▶ REPROCESSAR'; btn.style.opacity = '1'; }
    alert('Erro: ' + e.message);
  }
}

/* ══ FILA DE LEADS CAPTURADOS — modal ao iniciar ═══════════════════ */
async function _verificarFilaEIniciar(nicho, cidade, qtd, scoreMin, btn) {
  // Buscar leads capturados para este segmento+cidade
  var leads = [];
  try {
    var res = await authFetch('/api/pipeline/fila-reprocessamento').then(function(r){ return r.json(); });
    leads = (res.leads || []).filter(function(l){
      return l.segmento && l.cidade &&
        l.segmento.toLowerCase().trim() === nicho.toLowerCase().trim() &&
        l.cidade.toLowerCase().trim() === cidade.toLowerCase().trim();
    });
  } catch(_) {}

  if (leads.length === 0) {
    // Sem fila — iniciar direto
    _executarIniciarPipeline(nicho, cidade, qtd, scoreMin, btn);
    return;
  }

  // Mostrar modal com os leads na fila
  var existing = document.getElementById('modal-fila-capturados');
  if (existing) existing.remove();

  var tierColor = { PREMIUM: '#10b981', STANDARD: '#3b82f6', LOW: '#f59e0b', REJEITAR: '#ef4444', DADOS_INSUFICIENTES: '#6b7280' };

  var listaHtml = leads.map(function(l) {
    var cor = tierColor[l.tier] || '#6b7280';
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--fl-bg);border:1px solid var(--fl-border);border-radius:8px;gap:10px">' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-weight:600;font-size:13px;color:var(--fl-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(l.nome || '—') + '</div>' +
        '<div style="font-size:11px;color:var(--fl-text-muted)">' + escapeHtml(l.cidade || '') + (l.segmento ? ' · ' + escapeHtml(l.segmento) : '') + '</div>' +
      '</div>' +
      '<span style="font-size:11px;font-weight:700;color:' + cor + ';border:1px solid ' + cor + ';padding:2px 8px;border-radius:12px;flex-shrink:0">' + escapeHtml(l.tier || '') + '</span>' +
    '</div>';
  }).join('');

  var modal = document.createElement('div');
  modal.id = 'modal-fila-capturados';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;box-sizing:border-box';
  modal.innerHTML =
    '<div style="background:var(--fl-bg-card);border:1px solid var(--fl-border-md);border-radius:16px;padding:28px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5)">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
        '<span style="font-size:22px">📋</span>' +
        '<h3 style="margin:0;font-size:16px;font-weight:700;color:var(--fl-text)">Leads na fila para ' + escapeHtml(nicho) + ' em ' + escapeHtml(cidade) + '</h3>' +
      '</div>' +
      '<p style="color:var(--fl-text-muted);font-size:13px;margin:0 0 16px">O Hunter já coletou <strong style="color:var(--fl-text)">' + leads.length + ' lead(s)</strong> neste segmento. O que deseja fazer?</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">' + listaHtml + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
        '<button id="btn-fila-continuar" style="background:var(--fl-purple);color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;width:100%">▶ PROCESSAR ESTES LEADS</button>' +
        '<button id="btn-fila-excluir" style="background:transparent;color:#ef4444;border:1px solid #ef4444;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;width:100%">🗑 DESCARTAR E INICIAR NOVO CICLO</button>' +
        '<button id="btn-fila-cancelar" style="background:transparent;color:var(--fl-text-muted);border:none;padding:8px;font-size:12px;cursor:pointer;width:100%">Cancelar</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(modal);

  // Botão: processar leads existentes
  document.getElementById('btn-fila-continuar').onclick = async function() {
    modal.remove();
    if (btn) { btn.textContent = '⏳ PROCESSANDO FILA...'; btn.disabled = true; }
    for (var i = 0; i < leads.length; i++) {
      try {
        await authFetch('/api/pipeline/reprocessar/' + leads[i].id, { method: 'POST' });
      } catch(_) {}
    }
    if (btn) { btn.textContent = '✓ FILA INICIADA!'; }
    setTimeout(function(){
      if (btn) { btn.textContent = '▶ INICIAR PIPELINE'; btn.disabled = false; }
      mostrarView('crm');
      document.querySelectorAll('.sidebar-link').forEach(function(l){ l.classList.remove('active'); });
      var crmLink = document.querySelector('[data-view="crm"]');
      if (crmLink) crmLink.classList.add('active');
      setTimeout(carregarKanban, 1000);
    }, 2000);
  };

  // Botão: descartar fila e iniciar novo ciclo
  document.getElementById('btn-fila-excluir').onclick = async function() {
    this.textContent = '⏳ Descartando...';
    this.disabled = true;
    try {
      for (var i = 0; i < leads.length; i++) {
        await authFetch('/api/leads/' + leads[i].id, { method: 'DELETE' });
      }
    } catch(_) {}
    modal.remove();
    _executarIniciarPipeline(nicho, cidade, qtd, scoreMin, btn);
  };

  // Botão: cancelar
  document.getElementById('btn-fila-cancelar').onclick = function() {
    modal.remove();
    if (btn) { btn.textContent = '▶ INICIAR PIPELINE'; btn.disabled = false; }
  };

  // Fechar clicando fora
  modal.addEventListener('click', function(e) {
    if (e.target === modal) {
      modal.remove();
      if (btn) { btn.textContent = '▶ INICIAR PIPELINE'; btn.disabled = false; }
    }
  });
}

/* ── Drag & Drop Kanban (Mouse + Touch) ── */
var draggedCard = null;
var touchStartX = 0;
var touchStartY = 0;
var touchCurrentX = 0;
var touchCurrentY = 0;
var isDragging = false;
var ghostCard = null;

function initDrag(card) {
  // Mouse events (desktop)
  card.addEventListener('dragstart', function(e){
    draggedCard = card;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
  });

  card.addEventListener('dragend', function(){
    card.classList.remove('dragging');
    draggedCard = null;
    document.querySelectorAll('.kanban-col-body').forEach(function(col){ col.classList.remove('drag-over'); });
    updateCounts();
  });

  // Touch events (mobile)
  card.addEventListener('touchstart', function(e){
    if (e.target.closest('.lead-card-actions')) return; // Não arrastar se clicar em botões

    isDragging = true;
    draggedCard = card;

    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    // Criar ghost card (clone visual)
    ghostCard = card.cloneNode(true);
    ghostCard.style.position = 'fixed';
    ghostCard.style.zIndex = '10000';
    ghostCard.style.opacity = '0.8';
    ghostCard.style.pointerEvents = 'none';
    ghostCard.style.width = card.offsetWidth + 'px';
    ghostCard.style.transform = 'rotate(3deg) scale(1.05)';
    ghostCard.style.transition = 'none';
    document.body.appendChild(ghostCard);

    // Ocultar card original
    card.style.opacity = '0.3';

    updateGhostPosition(touch.clientX, touch.clientY);

    e.preventDefault();
  }, { passive: false });

  card.addEventListener('touchmove', function(e){
    if (!isDragging) return;

    const touch = e.touches[0];
    touchCurrentX = touch.clientX;
    touchCurrentY = touch.clientY;

    updateGhostPosition(touchCurrentX, touchCurrentY);

    // Detectar coluna sob o dedo
    const elementBelow = document.elementFromPoint(touchCurrentX, touchCurrentY);
    const colBelow = elementBelow?.closest('.kanban-col-body');

    // Remover highlight de todas as colunas
    document.querySelectorAll('.kanban-col-body').forEach(function(col){
      col.classList.remove('drag-over');
    });

    // Adicionar highlight na coluna atual
    if (colBelow) {
      colBelow.classList.add('drag-over');
    }

    e.preventDefault();
  }, { passive: false });

  card.addEventListener('touchend', function(e){
    if (!isDragging) return;

    isDragging = false;

    // Remover ghost card
    if (ghostCard) {
      ghostCard.remove();
      ghostCard = null;
    }

    // Restaurar opacidade do card original
    card.style.opacity = '1';

    // Detectar coluna de destino
    const elementBelow = document.elementFromPoint(touchCurrentX, touchCurrentY);
    const colBelow = elementBelow?.closest('.kanban-col-body');

    if (colBelow && draggedCard) {
      // Mover card para nova coluna
      colBelow.appendChild(draggedCard);

      // Animação suave
      draggedCard.style.animation = 'cardDrop 0.3s ease-out';
      setTimeout(() => {
        draggedCard.style.animation = '';
      }, 300);
    }

    // Limpar estado
    document.querySelectorAll('.kanban-col-body').forEach(function(col){
      col.classList.remove('drag-over');
    });
    draggedCard = null;
    updateCounts();

    e.preventDefault();
  }, { passive: false });
}

function updateGhostPosition(x, y) {
  if (ghostCard) {
    ghostCard.style.left = (x - ghostCard.offsetWidth / 2) + 'px';
    ghostCard.style.top = (y - 60) + 'px';
  }
}

// Adicionar CSS para animação de drop
if (!document.getElementById('kanban-touch-styles')) {
  const style = document.createElement('style');
  style.id = 'kanban-touch-styles';
  style.textContent = `
    @keyframes cardDrop {
      from {
        transform: scale(1.1);
        opacity: 0.8;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .kanban-col-body.drag-over {
      background: rgba(147,51,234,0.1);
      border-color: rgba(147,51,234,0.5);
    }

    .lead-card.dragging {
      opacity: 0.3;
    }
  `;
  document.head.appendChild(style);
}

document.querySelectorAll('.kanban-col-body').forEach(function(col){
  col.addEventListener('dragover', function(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drag-over');
  });
  col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
  col.addEventListener('drop', function(e){
    e.preventDefault();
    col.classList.remove('drag-over');
    if (draggedCard) { col.appendChild(draggedCard); updateCounts(); }
  });
});

function updateCounts() {
  document.querySelectorAll('.kanban-col-body').forEach(function(col){

async function verificarOnboarding() {
  try {
    var r = await AuthHelper.authFetch('/api/users/onboarding-status');
    if (!r.ok) return;
    var status = await r.json();

    // --- BLOCO 1: Perfil incompleto (nome + nicho obrigatórios) ---
    if (!status.perfil_ok) {
      var sidebar = document.getElementById('sidebar');
      if (sidebar) sidebar.style.display = 'none';
      mostrarView('perfil');
      window.mostrarViewOriginal = window.mostrarView;
      window.mostrarView = function(view) {
        if (view !== 'perfil') return;
        window.mostrarViewOriginal(view);
      };
      var aviso = document.getElementById('onboarding-aviso-perfil');
      if (!aviso) {
        aviso = document.createElement('div');
        aviso.id = 'onboarding-aviso-perfil';
        aviso.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;text-align:center;padding:12px 16px;font-size:14px;font-weight:600;z-index:9999;';
        aviso.innerHTML = '⚠️ Complete seu perfil (nome e segmento) para acessar o sistema';
        document.body.prepend(aviso);
      }
      return;
    }

    // Perfil ok — liberar navegação
    var sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.style.display = '';
    var aviso = document.getElementById('onboarding-aviso-perfil');
    if (aviso) aviso.remove();
    if (window.mostrarViewOriginal) {
      window.mostrarView = window.mostrarViewOriginal;
      delete window.mostrarViewOriginal;
    }

    // Preencher campos do perfil
    var rp = await AuthHelper.authFetch('/api/users/profile');
    if (rp.ok) {
      var perfil = await rp.json();
      if (document.getElementById('perfilNome')) document.getElementById('perfilNome').value = perfil.nome || '';
      if (document.getElementById('perfilTelefone')) document.getElementById('perfilTelefone').value = perfil.telefone || '';
      if (document.getElementById('perfilNicho')) document.getElementById('perfilNicho').value = perfil.nicho || '';
      if (document.getElementById('perfilOrigem')) document.getElementById('perfilOrigem').value = perfil.origem || '';
      if (perfil.plano === 'PRO' || perfil.plano === 'pro' || perfil.role === 'superadmin') {
        var btnUpgrade = document.getElementById('btn-upgrade-pro');
        if (btnUpgrade) btnUpgrade.style.display = 'none';
      }
    }

    // --- BLOCO 2: WhatsApp não conectado (aviso, não bloqueia) ---
    var avisoWpp = document.getElementById('onboarding-aviso-wpp');
    if (!status.wpp_ok) {
      if (!avisoWpp) {
        avisoWpp = document.createElement('div');
        avisoWpp.id = 'onboarding-aviso-wpp';
        avisoWpp.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1c1c2e;border:1px solid #f59e0b;color:#f59e0b;padding:14px 18px;border-radius:12px;font-size:13px;z-index:9998;max-width:340px;box-shadow:0 4px 20px rgba(0,0,0,.4);';
        avisoWpp.innerHTML = '<strong>📱 WhatsApp não conectado</strong><br><span style="color:#ccc;font-size:12px">Conecte seu WhatsApp para ativar o SDR automático.</span><br><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button onclick="mostrarView(&quot;perfil&quot;);document.getElementById(&quot;onboarding-aviso-wpp&quot;).remove();_wppAvisoStopPoll()" style="background:#f59e0b;color:#000;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">Conectar agora →</button><button id="aviso-wpp-recheck" onclick="_wppAvisoRecheck(this)" style="background:transparent;color:#f59e0b;border:1px solid #f59e0b;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px">Já conectei</button><button onclick="this.closest(&quot;#onboarding-aviso-wpp&quot;).remove();_wppAvisoStopPoll()" style="background:transparent;color:#888;border:none;cursor:pointer;font-size:12px">Depois</button></div><div id="aviso-wpp-feedback" style="margin-top:6px;font-size:11px;color:#94a3b8;min-height:14px"></div>';
        document.body.appendChild(avisoWpp);
        _wppAvisoStartPoll();
      }
    } else {
      if (avisoWpp) avisoWpp.remove();
      _wppAvisoStopPoll();
    }
  } catch (e) {
    console.error('[Onboarding] Erro:', e);
  }
}

// ── Polling do aviso de WhatsApp: refaz onboarding-status enquanto popup
//    estiver visível. Some sozinho quando o backend confirmar conectado.
var _wppAvisoTimer = null;
function _wppAvisoStopPoll() {
  if (_wppAvisoTimer) { clearInterval(_wppAvisoTimer); _wppAvisoTimer = null; }
}
function _wppAvisoStartPoll() {
  _wppAvisoStopPoll();
  _wppAvisoTimer = setInterval(async function() {
    var aviso = document.getElementById('onboarding-aviso-wpp');
    if (!aviso) { _wppAvisoStopPoll(); return; }
    try {
      var r = await AuthHelper.authFetch('/api/users/onboarding-status?_=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      var s = await r.json();
      if (s.wpp_ok) {
        aviso.remove();
        _wppAvisoStopPoll();
        if (typeof mostrarToast === 'function') mostrarToast('✅ WhatsApp conectado — SDR ativo');
      }
    } catch (e) { /* silencioso, tenta de novo no proximo tick */ }
  }, 10000);
}
async function _wppAvisoRecheck(btn) {
  var fb = document.getElementById('aviso-wpp-feedback');
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }
  if (fb) fb.textContent = '';
  try {
    var r = await AuthHelper.authFetch('/api/users/onboarding-status?_=' + Date.now(), { cache: 'no-store' });
    var s = r.ok ? await r.json() : { wpp_ok: false };
    if (s.wpp_ok) {
      var aviso = document.getElementById('onboarding-aviso-wpp');
      if (aviso) aviso.remove();
      _wppAvisoStopPoll();
      if (typeof mostrarToast === 'function') mostrarToast('✅ WhatsApp conectado — SDR ativo');
    } else {
      if (fb) fb.textContent = 'Ainda desconectado. Verifique se o QR foi escaneado.';
      if (btn) { btn.disabled = false; btn.textContent = 'Já conectei'; }
    }
  } catch (e) {
    if (fb) fb.textContent = 'Erro ao verificar. Tente novamente.';
    if (btn) { btn.disabled = false; btn.textContent = 'Já conectei'; }
  }
}

// LOGS EM TEMPO REAL VIA SSE (Server-Sent Events)
// ═══════════════════════════════════════════════════════════════════
(function() {
  const logsContainer = document.getElementById('magic-logs-content');
  if (!logsContainer) return;

  let eventSource = null;
  const maxLogs = 100;

  function conectarSSE() {
    if (eventSource) eventSource.close();

    var _sseToken = localStorage.getItem('fralib_token') || '';
    if (!_sseToken || window.__fralibAuthExpired) return;
    eventSource = new EventSource('/api/logs/stream?token=' + encodeURIComponent(_sseToken));

    eventSource.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data);
        adicionarLog(data);
      } catch (e) {
        console.error('[SSE] Erro ao parsear log:', e);
      }
    };

    eventSource.onerror = function(err) {
      console.error('[SSE] Erro na conexão:', err);
      eventSource.close();
      if (window.__fralibAuthExpired || !localStorage.getItem('fralib_token')) return;
      setTimeout(conectarSSE, 5000);
    };
  }

  function adicionarLog(data) {
    // Rate limit — mostrar modal proeminente
    if (data.evento === 'RATE_LIMIT' || data.tipo === 'rate_limit') {
      _mostrarModalRateLimit(data.mensagem);
      return;
    }

    const logDiv = document.createElement('div');
    logDiv.style.cssText = 'padding:8px 12px;border-radius:6px;font-size:13px;font-family:monospace;line-height:1.4;';

    const cores = {
      'ERROR': 'background:#fee;border-left:3px solid #f44',
      'SUCCESS': 'background:#efe;border-left:3px solid #4f4',
      'WARNING': 'background:#ffe;border-left:3px solid #fa4',
      'INFO': 'background:#eef;border-left:3px solid #44f',
      'LEADS': 'background:#f0f8ff;border-left:3px solid #4a9eff',
      'CAIO': 'background:#fff0f5;border-left:3px solid #ff69b4',
      'PIPELINE_STATUS': 'background:#f5f5f5;border-left:3px solid #888'
    };

    logDiv.style.cssText += cores[data.evento] || 'background:#f9f9f9;border-left:3px solid #ccc';

    const ts = data.ts || new Date().toLocaleTimeString('pt-BR');

    const icones = {
      'ERROR': '❌',
      'SUCCESS': '✅',
      'WARNING': '⚠️',
      'INFO': 'ℹ️',
      'LEADS': '🔍',
      'CAIO': '🤖',
      'PIPELINE_STATUS': '⚙️'
    };

    const icone = icones[data.evento] || '📝';

    logDiv.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:start;gap:12px;"><div style="flex:1;"><strong style="color:#333;">' + icone + ' ' + escapeHtml(data.evento) + '</strong><div style="color:#666;margin-top:4px;">' + escapeHtml(data.mensagem) + '</div></div><small style="color:#999;white-space:nowrap;">' + ts + '</small></div>';

    logsContainer.insertBefore(logDiv, logsContainer.firstChild);

    while (logsContainer.children.length > maxLogs) {
      logsContainer.removeChild(logsContainer.lastChild);
    }

    if (logsContainer.scrollTop < 100) {
      logsContainer.scrollTop = 0;
    }
  }

  conectarSSE();

  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && (!eventSource || eventSource.readyState === 2)) {
      conectarSSE();
    }
  });
})();
