<!-- ============================================================
     MODAL EDITOR WYSIWYG (PR13) — edicao sem LLM
     ============================================================ -->
<style>
  #editorSiteModal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:none}
  #editorSiteModal.open{display:flex;flex-direction:column}
  #editorSiteHeader{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0f0f12;color:#fff;border-bottom:1px solid #222}
  #editorSiteHeader .title{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #editorSiteHeader button{padding:8px 14px;border:0;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
  .btn-editor-save{background:#10b981;color:#fff}
  .btn-editor-cancel{background:#374151;color:#fff}
  .btn-editor-sync{background:#0ea5e9;color:#fff}
  #editorSiteBody{flex:1;display:flex;overflow:hidden}
  #editorSidePanel{width:300px;background:#111;color:#e5e7eb;padding:16px;overflow-y:auto;border-right:1px solid #222;font-size:13px}
  #editorSidePanel h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af}
  #editorSidePanel label{display:block;margin:10px 0 4px;font-weight:600}
  #editorSidePanel input,#editorSidePanel textarea{width:100%;background:#0a0a0c;border:1px solid #2a2a30;color:#fff;padding:8px;border-radius:4px;font-size:13px;font-family:inherit}
  #editorSidePanel input:focus,#editorSidePanel textarea:focus{outline:none;border-color:#0ea5e9}
  #editorIframeWrap{flex:1;background:#fff;position:relative}
  #editorIframe{width:100%;height:100%;border:0;display:block}
  #editorStatus{position:absolute;bottom:12px;right:12px;background:#10b981;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
  #editorStatus.show{opacity:1}
  #editorStatus.err{background:#dc2626}
  .editor-hint{font-size:11px;color:#6b7280;margin-top:4px;line-height:1.3}
</style>

<div id="editorSiteModal" role="dialog" aria-label="Editor de Site">
  <div id="editorSiteHeader">
    <div class="title" id="editorSiteTitle">Editor de Site</div>
    <button class="btn-editor-sync" onclick="editorSincronizarCampos()" title="Aplica os campos do painel no site">&#128260; APLICAR CAMPOS</button>
    <button class="btn-editor-save" onclick="editorSalvarSite()">&#128190; SALVAR</button>
    <button class="btn-editor-cancel" onclick="editorFechar()">&#10006; FECHAR</button>
  </div>
  <div id="editorSiteBody">
    <aside id="editorSidePanel">
      <h4>Dados de Contato</h4>
      <label>Telefone / WhatsApp</label>
      <input type="text" id="edTelefone" placeholder="(11) 99999-9999" />
      <div class="editor-hint">Atualiza links wa.me e tel:.</div>

      <label>Nome do Negocio</label>
      <input type="text" id="edNome" placeholder="Padaria do Joao" />

      <label>Headline (H1)</label>
      <textarea id="edHeadline" rows="2" placeholder="Texto principal do hero"></textarea>

      <h4 style="margin-top:18px">Endereco</h4>
      <label>Endereco completo</label>
      <textarea id="edEndereco" rows="2" placeholder="Rua X, 123 - Bairro - Cidade/UF"></textarea>

      <h4 style="margin-top:18px">Horarios</h4>
      <label>Seg-Sex</label>
      <input type="text" id="edHorSeg" placeholder="08:00 - 18:00" />
      <label>Sabado</label>
      <input type="text" id="edHorSab" placeholder="08:00 - 13:00" />

      <div class="editor-hint" style="margin-top:18px;border-top:1px solid #222;padding-top:12px">
        <strong>Dica:</strong> clique em qualquer texto do site (no centro) para editar diretamente. Use os campos acima para aplicar de uma vez.
      </div>
    </aside>
    <div id="editorIframeWrap">
      <iframe id="editorIframe" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
      <div id="editorStatus"></div>
    </div>
  </div>
</div>
