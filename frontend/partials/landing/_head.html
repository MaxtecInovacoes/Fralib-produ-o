/* ============================================================
   FRALIB LANDING — DESIGN TOKENS (from official design system)
   ============================================================ */
:root {
  --fl-bg:         #0a0714;
  --fl-bg-surface: #0e0a1a;
  --fl-bg-card:    #12121a;
  --fl-bg-card-2:  #18182280;
  --fl-bg-hover:   #1c1c28;
  --fl-bg-overlay: rgba(6,6,8,0.92);

  --fl-purple-950: #0e0718;
  --fl-purple-900: #1a0a30;
  --fl-purple-800: #2d1060;
  --fl-purple-700: #4c1d9e;
  --fl-purple-600: #7c3aed;
  --fl-purple:     #9333ea;
  --fl-purple-400: #a855f7;
  --fl-purple-300: #c084fc;
  --fl-purple-200: #d8b4fe;

  --fl-glow-xs:  0 0 8px  rgba(147,51,234,0.20);
  --fl-glow-sm:  0 0 16px rgba(147,51,234,0.28);
  --fl-glow-md:  0 0 32px rgba(147,51,234,0.35);
  --fl-glow-lg:  0 0 60px rgba(147,51,234,0.45);

  --fl-border:      rgba(147,51,234,0.12);
  --fl-border-md:   rgba(147,51,234,0.25);
  --fl-border-hi:   rgba(147,51,234,0.50);

  --fl-text:       #f0f0f5;
  --fl-text-muted: #b0b0c8;
  --fl-text-dim:   #44445a;
  --fl-text-brand: #c084fc;

  --fl-success:  #22c55e;
  --fl-warning:  #f59e0b;
  --fl-danger:   #ef4444;
  --fl-info:     #06b6d4;

  --fl-font-brand: 'Press Start 2P', monospace;
  --fl-font-ui:    'DM Sans', system-ui, sans-serif;
  --fl-font-mono:  'JetBrains Mono', monospace;

  --fl-r-sm: 6px;
  --fl-r-md: 10px;
  --fl-r-lg: 14px;
  --fl-r-xl: 20px;
  --fl-r-full: 9999px;

  --fl-ease: cubic-bezier(0.22,1,0.36,1);
  --fl-t-fast: 120ms cubic-bezier(0.22,1,0.36,1);
  --fl-t-med:  220ms cubic-bezier(0.22,1,0.36,1);

  --cyan:      #00FFB3;
  --cyan-dim:  rgba(0,255,179,0.12);
  --cyan-glow: rgba(0,255,179,0.4);
  --gold:      #FFB800;
  --gold-dim:  rgba(255,184,0,0.15);
  --gold-glow: rgba(255,184,0,0.35);
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html, body {
  overflow-x: hidden;
  width: 100%;
  max-width: 100vw;
  margin: 0;
  padding: 0;
}
html { scroll-behavior: smooth; }
body{
  font-family:var(--fl-font-ui);
  background:var(--fl-bg);
  color:var(--fl-text);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   GLOBAL
   ============================================================ */
.container{max-width:1140px;margin:0 auto;padding:0 24px;position:relative;z-index:2;width:100%;}
section{padding:100px 0;position:relative}
.section-title{
  font-family:var(--fl-font-brand);
  font-size:clamp(11px,2vw,18px);
  text-align:center;line-height:2;
  margin-bottom:56px;
  background:linear-gradient(135deg,var(--fl-purple-300),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

33%{transform:translate(30px,-25px) scale(1.1)}
  66%{transform:translate(-20px,15px) scale(0.95)}
}

/* ============================================================
   NAV
   ============================================================ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:24px;
  padding:14px 32px;
  background:rgba(6,6,8,0.95);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--fl-border);
  transition:all .3s var(--fl-ease);
  min-height:68px;
  overflow:hidden;
}
@supports not (backdrop-filter:blur(1px)) {
  nav{background:rgba(6,6,8,0.98)}
}
@supports not (-webkit-backdrop-filter:blur(1px)) {
  nav{background:rgba(6,6,8,0.98)}
}
nav.scrolled{padding:10px 32px;background:rgba(6,6,8,0.95)}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.nav-brand img{height:36px;width:auto;filter:drop-shadow(0 0 8px rgba(147,51,234,0.4))}
.nav-brand-wrapper{display:flex;align-items:center}
.nav-links{display:flex;gap:18px;align-items:center;justify-content:center;flex:1;min-width:0;flex-wrap:nowrap;list-style:none;margin:0;padding:0}
.nav-links a{color:var(--fl-text-muted);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s;white-space:nowrap}
.nav-links a:hover{color:var(--fl-text)}
.nav-actions{display:flex;align-items:center;gap:12px;justify-content:flex-end;justify-self:end;flex-wrap:nowrap;flex-shrink:0}
.nav-cta{padding:11px 20px}
.nav-cta{
  padding:12px 24px;border-radius:0;
  font-family:var(--fl-font-brand);font-size:9px;
  background:#FACC15;
  color:#000;text-decoration:none;cursor:pointer;
  transition:transform 60ms,box-shadow 60ms;border:none;
  box-shadow:
    inset -3px -3px 0 #A16207,
    inset 3px 3px 0 #FDE68A,
    0 4px 0 #713F12;
  image-rendering:pixelated;
  letter-spacing:1px;
}
.nav-entrar{color:var(--fl-text-muted);text-decoration:none;font-size:13px;font-weight:600;transition:color .2s}
.nav-entrar:hover{color:var(--fl-text)}
.nav-cta:hover{
  background:#FDE047;
  box-shadow:
    inset -3px -3px 0 #A16207,
    inset 3px 3px 0 #FEF9C3,
    0 4px 0 #713F12,
    0 0 20px rgba(250,204,21,0.4);
}
.nav-cta:active{
  transform:translateY(4px);
  box-shadow:inset -3px -3px 0 #A16207,inset 3px 3px 0 #FDE68A,0 0 0 #713F12;
}
.mobile-toggle{display:none;background:none;border:none;color:var(--fl-text);font-size:24px;cursor:pointer}

/* ============================================================
   HERO (clean, low friction — tipografia obrigatória)
   ============================================================ */
.hero{
  min-height:auto;
  padding:80px 24px 64px;
  position:relative;
  background:#0a0714;
  text-align:left;
}
.hero-grid{display:none}
.hero-split{
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:60px;
  max-width:1200px;
  margin:0 auto;
  align-items:center;
}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;max-width:640px}
.hero-right{display:flex;align-items:center;justify-content:center}

/* Headline — Inter / DM Sans / Manrope / Sora */
.hero-headline{
  font-family:'Inter','DM Sans',system-ui,sans-serif;
  font-size:56px;
  font-weight:800;
  line-height:1.05;
  letter-spacing:-0.02em;
  color:#FFFFFF;
  margin:0 0 20px;
}
.hero-subheadline{
  font-family:'Inter','DM Sans',system-ui,sans-serif;
  font-size:20px;
  line-height:1.5;
  color:#B8B4C8;
  margin:0 0 28px;
  max-width:580px;
}
.hero-bullets{
  list-style:none;padding:0;margin:0 0 32px;
  display:flex;flex-direction:column;gap:10px;
}
.hero-bullets li{
  font-size:16px;line-height:1.5;color:#FFFFFF;
  padding-left:30px;position:relative;font-weight:500;
}
.hero-bullets li::before{
  content:'';position:absolute;left:0;top:8px;
  width:18px;height:18px;border-radius:50%;
  background:rgba(0,255,179,0.12);
  border:1px solid rgba(0,255,179,0.4);
}
.hero-bullets li::after{
  content:'';position:absolute;left:5px;top:13px;
  width:8px;height:5px;
  border-left:2px solid #00FFB3;
  border-bottom:2px solid #00FFB3;
  transform:rotate(-45deg);
}
.hero-buttons{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  margin-bottom:18px;
}
.btn-hero-primary{
  display:inline-flex;align-items:center;justify-content:center;
  padding:16px 32px;
  font-family:'Inter','DM Sans',system-ui,sans-serif;
  font-size:16px;font-weight:700;letter-spacing:0.5px;
  background:#FFB800;color:#000;
  border:none;cursor:pointer;text-decoration:none;
  border-radius:8px;
  transition:transform .15s,box-shadow .15s;
  min-height:52px;
  box-shadow:0 4px 14px rgba(255,184,0,0.25);
}
.btn-hero-primary:hover{
  background:#FFC833;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(255,184,0,0.4);
}
.btn-hero-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  padding:16px 28px;
  font-family:'Inter','DM Sans',system-ui,sans-serif;
  font-size:16px;font-weight:600;
  color:#FFFFFF;background:transparent;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;text-decoration:none;
  transition:border-color .2s,background .2s;
  min-height:52px;
}
.btn-hero-secondary:hover{
  border-color:#00FFB3;color:#00FFB3;
  background:rgba(0,255,179,0.04);
}
.hero-microcopy{
  font-size:13px;color:#7D7890;line-height:1.5;
  margin:0;max-width:560px;
}

/* HERO MOCKUP — sistema funcionando, sem lucro */
.hero-mockup{
  width:100%;max-width:520px;
  background:#151026;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 24px 48px rgba(0,0,0,0.4);
}
.mock-topbar{
  display:flex;align-items:center;gap:6px;
  padding:12px 16px;
  background:#11101f;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.mock-topbar .mock-dot{
  width:10px;height:10px;border-radius:50%;
  background:#2a2a3a;
}
.mock-topbar .mock-dot:nth-child(1){background:#ef4444}
.mock-topbar .mock-dot:nth-child(2){background:#f59e0b}
.mock-topbar .mock-dot:nth-child(3){background:#22c55e}
.mock-url{
  margin-left:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:#7D7890;
  background:rgba(0,0,0,0.3);
  padding:4px 10px;border-radius:4px;
  flex:1;
}
.mock-params{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:16px 16px 0;
}
.mock-param{
  background:rgba(0,0,0,0.2);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:8px;
  padding:10px 12px;
}
.mock-param-label{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:#7D7890;
  text-transform:uppercase;letter-spacing:0.5px;
}
.mock-param-value{
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;color:#FFFFFF;
  margin-top:2px;
}
.mock-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:12px 16px;
}
.mock-stat{
  background:rgba(124,58,237,0.06);
  border:1px solid rgba(124,58,237,0.18);
  border-radius:8px;
  padding:12px;text-align:center;
}
.mock-stat-num{
  font-family:'Inter',sans-serif;
  font-size:28px;font-weight:800;color:#FFFFFF;
  line-height:1;
}
.mock-stat-label{
  font-size:10px;color:#B8B4C8;
  text-transform:uppercase;letter-spacing:0.3px;
  margin-top:4px;line-height:1.2;
}
.mock-lead{
  margin:0 16px 16px;
  background:rgba(0,255,179,0.05);
  border:1px solid rgba(0,255,179,0.18);
  border-radius:8px;
  padding:12px 14px;
}
.mock-lead-tag{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:#00FFB3;
  text-transform:uppercase;letter-spacing:0.5px;
  font-weight:600;
  margin-bottom:4px;
}
.mock-lead-name{
  font-family:'Inter',sans-serif;
  font-size:15px;font-weight:700;color:#FFFFFF;
  margin-bottom:2px;
}
.mock-lead-status{
  font-size:12px;color:#B8B4C8;
}

/* RESPONSIVE */
@media(max-width:1024px){
  .hero-headline{font-size:42px}
  .hero-subheadline{font-size:18px}
}
@media(max-width:1100px){
  .nav-links{display:none}
  .mobile-toggle{display:block}
  nav{padding:12px 20px;gap:16px}
}
@media(max-width:768px){
  .hero{padding:64px 20px 48px}
  .hero-split{grid-template-columns:1fr;gap:32px}
  .hero-right{order:-1}
  .hero-headline{font-size:36px;line-height:1.1}
  .hero-subheadline{font-size:17px;line-height:1.55}
  .hero-bullets li{font-size:15px}
  .btn-hero-primary,.btn-hero-secondary{width:100%;justify-content:center}
  .hero-buttons{flex-direction:column;align-items:stretch;width:100%}
  .hero-mockup{max-width:100%}
}
@media(max-width:480px){
  .hero-headline{font-size:30px}
}

/* PIPELINE - container das 5 etapas (motion design v2) */
.pipeline{
  display:flex;flex-direction:column;gap:8px;
  position:relative;
  opacity:0;
  animation:pipeline-fade-in .4s var(--fl-ease) .2s forwards;
}
@keyframes pipeline-fade-in{to{opacity:1}}
.pipeline::before{
  content:'';position:absolute;left:18px;top:24px;bottom:24px;
  width:2px;background:linear-gradient(180deg,var(--cyan) 0%,var(--fl-purple-300) 50%,var(--gold) 100%);
  opacity:.3;
  animation:line-pulse 4s ease-in-out infinite;
}
@keyframes line-pulse{
  0%,100%{opacity:.3}50%{opacity:.55}
}

/* STEP base - com transição de status */
.pipeline-step{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  background:rgba(0,0,0,.4);
  border:1px solid var(--fl-border);
  border-radius:8px;
  position:relative;
  opacity:0;
  transform:translateX(-12px);
  animation:step-in .5s var(--fl-ease) forwards;
  transition:border-color .3s, background .3s;
}
.pipeline-step.step-done{
  border-color:rgba(0,255,179,.3);
  background:rgba(0,255,179,.04);
}
.pipeline-step.step-done .step-icon{
  background:rgba(0,255,179,.15)!important;
}
@keyframes step-in{to{opacity:1;transform:translateX(0)}}

/* Timing ajustado pelo motion designer */
.pipeline-step.step-1{animation-delay:0.3s}
.pipeline-step.step-2{animation-delay:2.3s}
.pipeline-step.step-3{animation-delay:5s}
.pipeline-step.step-4{animation-delay:8s}
.pipeline-step.step-5{
  animation:step-in .5s var(--fl-ease) 11.5s forwards,
             screen-shake .4s ease-out 12s,
             gradient-shift 2s ease-in-out 12.5s infinite;
  background:linear-gradient(90deg,rgba(147,51,234,.12),rgba(255,184,0,.15));
  border-color:rgba(255,184,0,.5);
}
@keyframes gradient-shift{
  0%,100%{
    box-shadow:0 0 15px rgba(147,51,234,.4),
               0 0 30px rgba(255,184,0,.2),
               inset 0 0 20px rgba(255,184,0,.05);
    border-color:rgba(255,184,0,.5);
  }
  50%{
    box-shadow:0 0 25px rgba(255,184,0,.7),
               0 0 50px rgba(255,184,0,.4),
               inset 0 0 30px rgba(255,184,0,.1);
    border-color:rgba(255,184,0,.9);
  }
}
@keyframes screen-shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-2px)}
  40%,80%{transform:translateX(2px)}
}

/* ÍCONES - cores diferenciadas por etapa */
.step-icon{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  border:1px solid currentColor;
  position:relative;z-index:1;
  transition:all .3s var(--fl-ease);
}
.step-icon.icon-search{
  color:var(--cyan);
  background:rgba(0,255,179,.08);
  box-shadow:0 0 12px rgba(0,255,179,.2);
}
.step-icon.icon-analyze{
  color:var(--fl-purple-300);
  background:rgba(147,51,234,.12);
  box-shadow:0 0 12px rgba(147,51,234,.25);
}
.step-icon.icon-code{
  color:#a78bfa;
  background:rgba(147,51,234,.1);
  box-shadow:0 0 12px rgba(147,51,234,.2);
}
.step-icon.icon-whatsapp{
  color:#6ee7c0;
  background:rgba(0,255,179,.1);
  box-shadow:0 0 12px rgba(0,255,179,.2);
}
.step-icon.icon-celebration{
  color:var(--gold);
  background:rgba(255,184,0,.12);
  box-shadow:0 0 16px rgba(255,184,0,.5);
}

.step-content{flex:1;min-width:0;position:relative;z-index:1}
.step-label{
  font-family:var(--fl-font-mono);font-size:10px;font-weight:600;
  color:var(--fl-text);letter-spacing:0.5px;
}
.step-label.gold{
  color:var(--gold);
  text-shadow:0 0 8px rgba(255,184,0,.6);
}
.step-desc{
  font-size:10px;color:var(--fl-text-muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.step-desc.gold{color:var(--gold);font-weight:600}

/* SPINNER SVG - cubic-bezier com overshoot */
.step-spinner{
  width:18px;height:18px;color:var(--cyan);flex-shrink:0;
  animation:spin .9s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes spin{
  0%{transform:rotate(-45deg)}
  100%{transform:rotate(315deg)}
}

/* BARRA de progresso animada com glow */
.step-bar{
  width:60px;height:4px;background:rgba(255,255,255,.08);
  border-radius:2px;overflow:hidden;flex-shrink:0;
}
.step-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--fl-purple-600),var(--cyan));
  width:0;
  box-shadow:0 0 8px var(--cyan-glow);
  animation:bar-fill 2.3s var(--fl-ease) 2.8s forwards;
}
@keyframes bar-fill{to{width:100%}}

/* PERCENTUAL animado com contador */
.step-percent{
  font-family:var(--fl-font-mono);font-size:11px;
  color:var(--cyan);font-weight:700;flex-shrink:0;
  text-shadow:0 0 8px var(--cyan-glow);
}

/* TYPING DOTS - pixel art (quadrados) com glow */
.step-typing{
  display:flex;gap:4px;align-items:center;flex-shrink:0;
  padding:2px 0;
}
.dot-typing{
  width:5px;height:5px;border-radius:0;
  background:var(--cyan);
  box-shadow:0 0 4px var(--cyan-glow);
  animation:pixel-typing 1.4s steps(1) infinite;
}
.dot-typing:nth-child(2){animation-delay:.2s}
.dot-typing:nth-child(3){animation-delay:.4s}
@keyframes pixel-typing{
  0%,50%{transform:translateY(0);opacity:.3;box-shadow:none}
  25%,75%{transform:translateY(-3px);opacity:1;box-shadow:0 0 6px var(--cyan-glow)}
  100%{transform:translateY(0);opacity:.3;box-shadow:none}
}

/* VALOR da venda - reveal com overshoot spring */
.step-amount{
  font-family:var(--fl-font-brand);font-size:12px;
  color:var(--gold);font-weight:700;letter-spacing:.5px;
  flex-shrink:0;
  text-shadow:0 0 6px rgba(255,184,0,.5);
  opacity:0;
  transform:scale(.5);
  animation:amount-reveal .8s cubic-bezier(.34,1.56,.64,1) 12s forwards;
}
@keyframes amount-reveal{
  0%{opacity:0;transform:scale(.3) translateY(8px)}
  60%{transform:scale(1.25) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* BURST - partículas SVG em ondas radiais */
.step-burst{
  position:absolute;top:50%;left:50%;
  width:200px;height:200px;transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  animation:burst-flash 1.2s ease-out 12s;
}
.step-burst::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle,rgba(255,184,0,.4) 0%,transparent 60%);
  border-radius:50%;
  animation:burst-expand 1.2s ease-out 12s;
}
.step-burst::after{
  content:'';position:absolute;top:50%;left:50%;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:
    0 -60px 0 var(--gold),
    0 60px 0 var(--gold),
    -60px 0 0 var(--gold),
    60px 0 0 var(--gold),
    -42px -42px 0 var(--gold),
    42px -42px 0 var(--gold),
    -42px 42px 0 var(--gold),
    42px 42px 0 var(--gold);
  transform:translate(-50%,-50%);
  animation:burst-stars 1.2s ease-out 12s;
}
@keyframes burst-flash{
  0%{opacity:0}10%,40%{opacity:1}100%{opacity:0}
}
@keyframes burst-expand{
  0%{transform:scale(.3);opacity:0}
  20%{opacity:1}
  100%{transform:scale(2.5);opacity:0}
}
@keyframes burst-stars{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.5);opacity:1}
  100%{transform:translate(-50%,-50%) scale(3);opacity:0}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============================================================
   PIXEL ART BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 32px;
  font-family:var(--fl-font-brand);font-size:11px;
  text-decoration:none;cursor:pointer;
  border:none;position:relative;
  color:#fff;letter-spacing:1px;
  image-rendering:pixelated;
  transition:transform 60ms, box-shadow 60ms;
  /* Pixel art 3D button shape */
  border-radius:0;
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,0.35),
    inset 4px 4px 0 rgba(255,255,255,0.15),
    0 4px 0 rgba(0,0,0,0.5);
}
.btn:active{
  transform:translateY(4px);
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,0.35),
    inset 4px 4px 0 rgba(255,255,255,0.15),
    0 0 0 rgba(0,0,0,0.5);
}

/* Gold / Orange START button */
.btn-gold{
  background:#FF8C00;
  color:#000;font-weight:700;
  box-shadow:
    inset -4px -4px 0 #CC6600,
    inset 4px 4px 0 #FFB84D,
    0 6px 0 #8B4500;
}
.btn-gold:hover{
  background:#FFA033;
  box-shadow:
    inset -4px -4px 0 #CC6600,
    inset 4px 4px 0 #FFD080,
    0 6px 0 #8B4500,
    0 0 24px var(--gold-glow);
}
.btn-gold:active{
  transform:translateY(6px);
  box-shadow:
    inset -4px -4px 0 #CC6600,
    inset 4px 4px 0 #FFB84D,
    0 0 0 #8B4500;
}

/* Green PLAY button */
.btn-green{
  background:#22C55E;
  color:#000;font-weight:700;
  box-shadow:
    inset -4px -4px 0 #16803C,
    inset 4px 4px 0 #4ADE80,
    0 6px 0 #0D5A28;
}
.btn-green:hover{
  background:#34D369;
  box-shadow:
    inset -4px -4px 0 #16803C,
    inset 4px 4px 0 #86EFAC,
    0 6px 0 #0D5A28,
    0 0 24px rgba(34,197,94,0.4);
}
.btn-green:active{
  transform:translateY(6px);
  box-shadow:inset -4px -4px 0 #16803C,inset 4px 4px 0 #4ADE80,0 0 0 #0D5A28;
}

/* Outline pixel button */
.btn-outline{
  background:transparent;
  color:var(--fl-text-muted);
  box-shadow:
    inset 0 0 0 3px var(--fl-border-md),
    0 4px 0 rgba(0,0,0,0.3);
}
.btn-outline:hover{
  color:var(--fl-purple-300);
  box-shadow:
    inset 0 0 0 3px var(--fl-purple),
    0 4px 0 rgba(0,0,0,0.3),
    0 0 20px var(--fl-glow-xs);
}
.btn-outline:active{
  transform:translateY(4px);
  box-shadow:inset 0 0 0 3px var(--fl-purple),0 0 0 rgba(0,0,0,0.3);
}

/* Purple pixel button */
.btn-purple{
  background:var(--fl-purple);
  box-shadow:
    inset -4px -4px 0 var(--fl-purple-800),
    inset 4px 4px 0 var(--fl-purple-300),
    0 6px 0 var(--fl-purple-950);
}
.btn-purple:hover{
  background:var(--fl-purple-400);
  box-shadow:
    inset -4px -4px 0 var(--fl-purple-800),
    inset 4px 4px 0 var(--fl-purple-200),
    0 6px 0 var(--fl-purple-950),
    0 0 24px rgba(147,51,234,0.4);
}
.btn-purple:active{
  transform:translateY(6px);
  box-shadow:inset -4px -4px 0 var(--fl-purple-800),inset 4px 4px 0 var(--fl-purple-300),0 0 0 var(--fl-purple-950);
}

/* Red STOP button (for nav CTA) */
.btn-red{
  background:#EF4444;
  color:#fff;font-weight:700;
  box-shadow:
    inset -4px -4px 0 #B91C1C,
    inset 4px 4px 0 #FCA5A5,
    0 6px 0 #7F1D1D;
}

/* Yellow / DESTAQUE button */
.btn-yellow{
  background:#FACC15;
  color:#000;font-weight:700;
  box-shadow:
    inset -4px -4px 0 #A16207,
    inset 4px 4px 0 #FDE68A,
    0 6px 0 #713F12;
}
.btn-yellow:hover{
  background:#FDE047;
  box-shadow:
    inset -4px -4px 0 #A16207,
    inset 4px 4px 0 #FEF9C3,
    0 6px 0 #713F12,
    0 0 30px rgba(250,204,21,0.5);
}
.btn-yellow:active{
  transform:translateY(6px);
  box-shadow:inset -4px -4px 0 #A16207,inset 4px 4px 0 #FDE68A,0 0 0 #713F12;
}
.btn-hero{
  padding:20px 40px;
  font-size:12px;
  letter-spacing:1.5px;
  animation:pulseGlow 2s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{box-shadow:inset -4px -4px 0 #A16207,inset 4px 4px 0 #FDE68A,0 6px 0 #713F12,0 0 20px rgba(250,204,21,0.2)}
  50%{box-shadow:inset -4px -4px 0 #A16207,inset 4px 4px 0 #FDE68A,0 6px 0 #713F12,0 0 40px rgba(250,204,21,0.5)}
}

@keyframes shimmer{
  0%{transform:translateX(-100%) skewX(-15deg)}
  100%{transform:translateX(200%) skewX(-15deg)}
}

/* ============================================================
   SNAKE BORDER CARD (animated border like reference)
   ============================================================ */
.snake-card{
  position:relative;border-radius:var(--fl-r-lg);
  background:var(--fl-bg-card);
  overflow:hidden;
  transition:transform .3s var(--fl-ease),box-shadow .3s;
}
.snake-card::before,.snake-card::after,
.snake-card .snake-top,.snake-card .snake-bottom{
  content:'';position:absolute;
  background:linear-gradient(90deg,transparent,var(--fl-purple-400),var(--cyan),transparent);
}
.snake-card::before{top:0;left:0;right:0;height:1px;animation:snakeTop 4s linear infinite}
.snake-card::after{right:0;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--fl-purple-400),var(--cyan),transparent);
  animation:snakeRight 4s linear infinite}
.snake-card .snake-top{bottom:0;left:0;right:0;height:1px;animation:snakeBottom 4s linear infinite}
.snake-card .snake-bottom{left:0;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--cyan),var(--fl-purple-400),transparent);
  animation:snakeLeft 4s linear infinite}
.snake-card:hover{transform:translateY(-4px);box-shadow:var(--fl-glow-md)}

@keyframes snakeTop{0%{transform:translateX(-100%)}25%{transform:translateX(100%)}100%{transform:translateX(100%)}}
@keyframes snakeRight{0%,25%{transform:translateY(-100%)}50%{transform:translateY(100%)}100%{transform:translateY(100%)}}
@keyframes snakeBottom{0%,50%{transform:translateX(100%)}75%{transform:translateX(-100%)}100%{transform:translateX(-100%)}}
@keyframes snakeLeft{0%,75%{transform:translateY(100%)}100%{transform:translateY(-100%)}}

.snake-card-inner{
  position:relative;z-index:1;
  background:var(--fl-bg-card);
  border-radius:var(--fl-r-lg);
  padding:32px 24px;
  margin:1px;
}

/* ============================================================
   SECTION 2 — SOCIAL PROOF
   ============================================================ */
.social-proof{
  padding:32px 0;
  border-top:1px solid var(--fl-border);
  border-bottom:1px solid var(--fl-border);
  background:transparent;
  overflow:hidden;
}
.proof-track{
  display:flex;gap:0;width:max-content;
  animation:marquee 20s linear infinite;
}
.proof-track:hover{animation-play-state:paused}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.proof-item{
  display:flex;align-items:center;gap:12px;
  padding:16px 48px;white-space:nowrap;
  border-right:1px solid var(--fl-border);
}
.proof-number{
  font-family:var(--fl-font-brand);font-size:clamp(12px,2vw,18px);
  color:var(--cyan);text-shadow:0 0 16px var(--cyan-glow);
}
.proof-label{font-size:12px;color:var(--fl-text-dim);text-transform:uppercase;letter-spacing:1px}

/* ============================================================
   SECTION 3 — PROBLEMA
   ============================================================ */
.problema-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:16px;max-width:800px;margin:0 auto;
}
.problema-item{
  display:flex;align-items:flex-start;gap:16px;
  padding:20px 24px;
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border);
  border-radius:var(--fl-r-lg);
  transition:all .3s var(--fl-ease);cursor:default;
}
.problema-item:hover{border-color:rgba(239,68,68,0.3);background:var(--fl-bg-hover);transform:translateY(-2px)}
.problema-icon{
  flex-shrink:0;width:40px;height:40px;
  background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);
  border-radius:var(--fl-r-md);
  display:flex;align-items:center;justify-content:center;
}
.problema-icon svg{width:18px;height:18px;stroke:var(--fl-danger)}
.problema-text{font-size:14px;color:var(--fl-text-muted);line-height:1.6}

/* ============================================================
   SECTION 4 — COMO FUNCIONA
   ============================================================ */
.steps-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:24px;position:relative;
}
.steps-line{
  position:absolute;top:56px;left:16.66%;right:16.66%;
  height:2px;
  background:linear-gradient(90deg,var(--fl-purple),var(--cyan),var(--gold));
  opacity:.25;
}
.step-card .snake-card-inner{text-align:center;padding:36px 20px}
.step-number{
  width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fl-font-brand);font-size:13px;
  line-height:1.2;text-align:center;
  position:relative;
  word-break:break-word;
  padding:4px;
}
.step-card:nth-child(1) .step-number{background:linear-gradient(135deg,var(--fl-purple),var(--fl-purple-700));color:#fff;box-shadow:0 0 30px rgba(147,51,234,0.4)}
.step-card:nth-child(2) .step-number{background:linear-gradient(135deg,var(--cyan),#00CC8E);color:#000;box-shadow:0 0 30px var(--cyan-glow)}
.step-card:nth-child(3) .step-number{background:linear-gradient(135deg,var(--gold),#FF9500);color:#000;box-shadow:0 0 30px var(--gold-glow)}
.step-card:nth-child(4) .step-number{background:linear-gradient(135deg,var(--fl-success),#16803C);color:#fff;box-shadow:0 0 30px rgba(34,197,94,0.4)}
.step-label{
  font-family:var(--fl-font-brand);font-size:9px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;
}
.step-card:nth-child(1) .step-label{color:var(--fl-purple-300)}
.step-card:nth-child(2) .step-label{color:var(--cyan)}
.step-card:nth-child(3) .step-label{color:var(--gold)}
.step-card:nth-child(4) .step-label{color:var(--fl-success)}
.step-title{font-size:17px;font-weight:700;margin-bottom:10px}
.step-desc{font-size:13px;color:var(--fl-text-muted);line-height:1.7}

/* Timeline 4-col grid (para secao timeline) */
.timeline-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative;
}
@media(max-width:1024px){.timeline-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.timeline-grid{grid-template-columns:1fr}}
.timeline-step{
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border);
  padding:32px 24px;
  text-align:center;
  position:relative;
}
.timeline-step::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--fl-purple),var(--cyan),var(--gold),var(--fl-success));
}
.timeline-step .day-icon{
  width:80px;height:80px;
  margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  background:var(--fl-bg-surface);
  border:2px solid var(--fl-border);
  transition:all .3s var(--fl-ease);
}
.timeline-step:nth-child(1) .day-icon{color:var(--fl-purple-light)}
.timeline-step:nth-child(2) .day-icon{color:var(--cyan)}
.timeline-step:nth-child(3) .day-icon{color:var(--gold)}
.timeline-step:nth-child(4) .day-icon{color:var(--fl-success)}
.timeline-step .day-icon svg{width:44px;height:44px}
.timeline-step:hover .day-icon{transform:scale(1.08)}
.timeline-step:nth-child(1):hover .day-icon{border-color:var(--fl-purple);background:rgba(147,51,234,0.1);box-shadow:0 0 30px rgba(147,51,234,0.3)}
.timeline-step:nth-child(2):hover .day-icon{border-color:var(--cyan);background:rgba(0,255,179,0.1);box-shadow:0 0 30px rgba(0,255,179,0.3)}
.timeline-step:nth-child(3):hover .day-icon{border-color:var(--gold);background:rgba(255,184,0,0.1);box-shadow:0 0 30px rgba(255,184,0,0.3)}
.timeline-step:nth-child(4):hover .day-icon{border-color:var(--fl-success);background:rgba(34,197,94,0.1);box-shadow:0 0 30px rgba(34,197,94,0.3)}
.timeline-step .label{
  font-family:var(--font-brand);
  font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;
}
.timeline-step:nth-child(1) .label{color:var(--fl-purple-light)}
.timeline-step:nth-child(2) .label{color:var(--cyan)}
.timeline-step:nth-child(3) .label{color:var(--gold)}
.timeline-step:nth-child(4) .label{color:var(--fl-success)}
.timeline-step h4{font-size:17px;font-weight:700;margin-bottom:10px}
.timeline-step p{font-size:13px;color:var(--fl-text-muted);line-height:1.7}

/* Mascot in steps section */
.steps-mascot{
  position:absolute;left:-80px;bottom:-20px;z-index:3;
  animation:mago-breath 5s ease-in-out infinite;
  pointer-events:none;
}
.steps-mascot img{height:140px;width:auto;opacity:.7;
  filter:drop-shadow(0 0 20px rgba(147,51,234,0.3))}

/* ============================================================
   SECTION 5 — PRODUTO EM ACAO
   ============================================================ */
.produto-mockup{
  max-width:960px;margin:0 auto;
  border-radius:var(--fl-r-xl);
  border:1px solid var(--fl-border-md);
  background:var(--fl-bg-card);
  overflow:hidden;
  box-shadow:var(--fl-glow-lg),0 40px 80px rgba(0,0,0,.5);
  position:relative;
}
/* Subtle purple glow around mockup */
.produto-mockup::before{
  content:'';position:absolute;inset:-1px;border-radius:var(--fl-r-xl);
  background:linear-gradient(135deg,var(--fl-purple-800),var(--fl-purple-950),var(--fl-purple-800));
  z-index:-1;opacity:.6;
}

.mockup-topbar{
  display:flex;align-items:center;gap:8px;
  padding:12px 18px;background:transparent;
  border-bottom:1px solid var(--fl-border);
}
.dot{width:12px;height:12px;border-radius:50%}
.dot-r{background:#FF5F57}.dot-y{background:#FFBD2E}.dot-g{background:#28C840}
.mockup-url{
  margin-left:12px;padding:5px 14px;background:var(--fl-bg);
  border-radius:6px;font-family:var(--fl-font-mono);font-size:11px;color:var(--fl-text-dim);
  flex:1;max-width:280px;
}
.mockup-body{display:grid;grid-template-columns:1fr 320px;min-height:380px}
.mockup-kanban{padding:16px;border-right:1px solid var(--fl-border)}
.kanban-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.kanban-title{font-size:13px;font-weight:700}
.kanban-badge{
  padding:3px 10px;border-radius:var(--fl-r-full);
  font-family:var(--fl-font-mono);font-size:10px;font-weight:500;
  background:var(--cyan-dim);color:var(--cyan);
}
.kanban-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col-title{
  font-family:var(--fl-font-mono);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:8px;padding:5px 8px;border-radius:6px;
}
.col-novo .col-title{background:rgba(147,51,234,0.12);color:var(--fl-purple-300)}
.col-criado .col-title{background:var(--cyan-dim);color:var(--cyan)}
.col-enviado .col-title{background:var(--gold-dim);color:var(--gold)}
.k-card{
  padding:8px 10px;margin-bottom:6px;
  background:transparent;border:1px solid var(--fl-border);
  border-radius:8px;font-size:11px;
  transition:border-color .2s;
}
.k-card:hover{border-color:var(--fl-border-md)}
.k-card .name{font-weight:600;margin-bottom:2px}
.k-card .cat{font-size:9px;color:var(--fl-text-dim)}

.mockup-wa{background:#0B141A;display:flex;flex-direction:column}
.wa-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:#1F2C33;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.wa-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--fl-purple),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fl-font-brand);font-size:10px;color:#fff;
}
.wa-name{font-size:13px;font-weight:600}
.wa-status{font-size:10px;color:#8696A0}
.wa-msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.wa-msg{
  max-width:82%;padding:8px 10px;border-radius:8px;
  font-size:12px;line-height:1.5;
}
.wa-msg.s{background:#005C4B;align-self:flex-end;border-bottom-right-radius:2px}
.wa-msg.r{background:#1F2C33;align-self:flex-start;border-bottom-left-radius:2px}
.wa-time{font-size:9px;color:rgba(255,255,255,.35);text-align:right;margin-top:3px}
.wa-link{color:var(--cyan);text-decoration:underline}
/* typing indicator */
.wa-typing{display:flex;gap:4px;align-self:flex-start;padding:10px 14px;background:#1F2C33;border-radius:8px}
.wa-typing span{width:6px;height:6px;border-radius:50%;background:#8696A0;animation:dot-pulse 1.4s infinite}
.wa-typing span:nth-child(2){animation-delay:.2s}
.wa-typing span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}

/* ============================================================
   SECTION 6 — FUNCIONALIDADES
   ============================================================ */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat-card .snake-card-inner{padding:28px 22px}
.feat-icon{
  width:44px;height:44px;border-radius:var(--fl-r-md);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.feat-icon svg{width:22px;height:22px}
.feat-card:nth-child(1) .feat-icon{background:var(--gold-dim)}.feat-card:nth-child(1) .feat-icon svg{stroke:var(--gold)}
.feat-card:nth-child(2) .feat-icon{background:var(--cyan-dim)}.feat-card:nth-child(2) .feat-icon svg{stroke:var(--cyan)}
.feat-card:nth-child(3) .feat-icon{background:rgba(147,51,234,0.12)}.feat-card:nth-child(3) .feat-icon svg{stroke:var(--fl-purple-300)}
.feat-card:nth-child(4) .feat-icon{background:rgba(239,68,68,0.08)}.feat-card:nth-child(4) .feat-icon svg{stroke:var(--fl-danger)}
.feat-card:nth-child(5) .feat-icon{background:var(--cyan-dim)}.feat-card:nth-child(5) .feat-icon svg{stroke:var(--cyan)}
.feat-card:nth-child(6) .feat-icon{background:var(--gold-dim)}.feat-card:nth-child(6) .feat-icon svg{stroke:var(--gold)}
.feat-title{font-size:15px;font-weight:700;margin-bottom:6px}
.feat-desc{font-size:13px;color:var(--fl-text-muted);line-height:1.6}

/* ============================================================
   SECTION 7 — PARA QUEM
   ============================================================ */
.quem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.quem-card .snake-card-inner{padding:32px 24px}
.quem-check{
  width:36px;height:36px;border-radius:var(--fl-r-md);
  background:var(--cyan-dim);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.quem-check svg{width:18px;height:18px;stroke:var(--cyan);fill:none}
.quem-title{font-size:16px;font-weight:700;margin-bottom:6px}
.quem-desc{font-size:13px;color:var(--fl-text-muted);line-height:1.6}

/* ============================================================
   SECTION 8 — PLANOS
   ============================================================ */
.planos-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:36px}
.plano-card{
  background:var(--fl-bg-card);border:1px solid var(--fl-border);
  border-radius:var(--fl-r-lg);text-align:center;
  padding:28px 20px;transition:all .3s var(--fl-ease);
  position:relative;
}
.plano-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.plano-card.destaque{
  border-color:var(--gold);
  box-shadow:0 0 40px var(--gold-dim),0 20px 60px rgba(0,0,0,.3);
}
.plano-card.destaque::before{
  content:'MAIS POPULAR';
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  padding:4px 16px;border-radius:var(--fl-r-full);
  background:linear-gradient(135deg,var(--gold),#FF9500);
  color:#000;font-family:var(--fl-font-brand);font-size:7px;letter-spacing:1px;
}
.plano-name{
  font-family:var(--fl-font-brand);font-size:10px;letter-spacing:2px;margin-bottom:16px;
}
.plano-card:nth-child(1) .plano-name{color:var(--fl-purple-300)}
.plano-card:nth-child(2) .plano-name{color:var(--fl-success)}
.plano-card:nth-child(3) .plano-name{color:var(--gold)}
.plano-card:nth-child(4) .plano-name{color:var(--cyan)}
.plano-price{font-size:clamp(24px,2.5vw,34px);font-weight:800;margin-bottom:2px}
.plano-price span{font-size:14px;font-weight:400;color:var(--fl-text-muted)}
.plano-period{font-size:12px;color:var(--fl-text-dim);margin-bottom:20px}
.plano-features{list-style:none;text-align:left;margin-bottom:24px}
.plano-features li{
  padding:7px 0;font-size:13px;color:var(--fl-text-muted);
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--fl-border);
}
.plano-features li:last-child{border:none}
.plano-features li::before{
  content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0;
}
.plano-card:nth-child(1) .plano-features li::before{background:var(--fl-purple-400)}
.plano-card:nth-child(2) .plano-features li::before{background:var(--fl-success)}
.plano-card:nth-child(3) .plano-features li::before{background:var(--gold)}
.plano-card:nth-child(4) .plano-features li::before{background:var(--cyan)}
.planos-cta{text-align:center}

/* BOTOES DOS PLANOS - padronizados na mesma linha */
.plano-card{
  display:flex;
  flex-direction:column;
}
.plano-cta-wrap{
  margin-top:auto;
  padding-top:20px;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:stretch;
  gap:6px;
}
.plano-cta{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:44px;
  font-family:var(--fl-font-brand);
  font-size:9px;
  letter-spacing:0.5px;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  transition:all .15s;
  border:2px solid;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 8px;
  border-radius:0;
}
.plano-cta.cta-outline{
  background:transparent;
  color:var(--fl-text);
  border-color:var(--fl-border-md);
}
.plano-cta.cta-outline:hover{
  border-color:var(--cyan);
  color:var(--cyan);
  box-shadow:0 0 20px var(--cyan-glow);
}
.plano-cta.cta-gold{
  background:var(--gold);
  color:#000;
  border-color:var(--gold);
  box-shadow:inset -3px -3px 0 #A16207,inset 3px 3px 0 #FDE68A,0 4px 0 #713F12;
  font-weight:700;
}
.plano-cta.cta-gold:hover{
  background:#FDE047;
  box-shadow:inset -3px -3px 0 #A16207,inset 3px 3px 0 #FEF9C3,0 4px 0 #713F12,0 0 20px var(--gold-glow);
}
.plano-garantia{
  font-size:9px;
  color:#A16207;
  text-align:center;
  margin:0;
  font-weight:600;
}

/* ============================================================
   SECTION 9 — FAQ
   ============================================================ */
.faq-list{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-item{
  background:var(--fl-bg-card);border:1px solid var(--fl-border);
  border-radius:var(--fl-r-lg);overflow:hidden;transition:border-color .3s;
}
.faq-item.active{border-color:var(--fl-purple)}
.faq-question{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;cursor:pointer;font-size:14px;font-weight:600;
  color:var(--fl-text);background:none;border:none;width:100%;
  text-align:left;font-family:var(--fl-font-ui);transition:color .2s;
}
.faq-question:hover{color:var(--fl-purple-300)}
.faq-chevron{
  width:18px;height:18px;flex-shrink:0;
  transition:transform .3s var(--fl-ease);color:var(--fl-text-dim);
}
.faq-item.active .faq-chevron{transform:rotate(180deg);color:var(--fl-purple-300)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height .4s var(--fl-ease)}
.faq-item.active .faq-answer{max-height:200px}
.faq-answer-inner{padding:0 22px 18px;font-size:13px;color:var(--fl-text-muted);line-height:1.7}

/* ============================================================
   SECTION 10 — CTA FINAL
   ============================================================ */
.cta-final{
  text-align:center;padding:120px 24px;position:relative;overflow:hidden;
}
.cta-final .cta-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(147,51,234,0.2),transparent 70%);
  animation:glow-pulse 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glow-pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}
  50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
}
.cta-final h2{
  font-family:var(--fl-font-brand);
  font-size:clamp(12px,2.2vw,20px);
  line-height:2;margin-bottom:36px;
  position:relative;z-index:1;
}
.cta-mascot{
  margin-top:40px;
  animation:mago-breath 4s ease-in-out infinite;
}
.cta-mascot img{
  height:120px;width:auto;
  filter:drop-shadow(0 0 30px rgba(147,51,234,0.5));
}

/* ============================================================
   BETA FORM
   ============================================================ */
.beta-section{
  background:transparent;
  padding:100px 0;
  position:relative;overflow:hidden;
}
.beta-section::before{
  content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(250,204,21,0.08),transparent 70%);
  pointer-events:none;
}
.beta-wrapper{
  max-width:520px;margin:0 auto;
  background:var(--fl-bg-card);
  border:1px solid rgba(250,204,21,0.25);
  border-radius:var(--fl-r-xl);
  padding:40px 36px;
  position:relative;z-index:1;
  box-shadow:0 0 40px rgba(250,204,21,0.08),0 20px 60px rgba(0,0,0,0.4);
}
.beta-wrapper h2{
  font-family:var(--fl-font-brand);
  font-size:clamp(10px,1.8vw,14px);
  text-align:center;line-height:2;
  margin-bottom:8px;
  color:#FACC15;
}
.beta-subtitle{
  text-align:center;font-size:14px;color:var(--fl-text-muted);
  margin-bottom:32px;line-height:1.6;
}
.beta-field{
  display:flex;flex-direction:column;gap:6px;
  margin-bottom:16px;
}
.beta-field label{
  font-family:var(--fl-font-mono);
  font-size:10px;color:var(--fl-text-muted);
  text-transform:uppercase;letter-spacing:0.08em;
}
.beta-field input{
  width:100%;
  background:transparent;
  border:2px solid var(--fl-border-md);
  border-radius:0;
  color:var(--fl-text);
  font-family:var(--fl-font-ui);
  font-size:15px;
  padding:14px 16px;
  outline:none;
  transition:border-color 120ms,box-shadow 120ms;
  image-rendering:pixelated;
}
.beta-field input::placeholder{color:var(--fl-text-dim)}
.beta-field input:focus{
  border-color:#FACC15;
  box-shadow:0 0 12px rgba(250,204,21,0.2);
}
.beta-submit{
  width:100%;margin-top:8px;
  padding:18px 24px;
  font-family:var(--fl-font-brand);font-size:11px;
  background:#FACC15;color:#000;
  border:none;cursor:pointer;
  letter-spacing:1.5px;
  box-shadow:
    inset -4px -4px 0 #A16207,
    inset 4px 4px 0 #FDE68A,
    0 6px 0 #713F12;
  transition:transform 60ms,box-shadow 60ms;
  border-radius:0;
  image-rendering:pixelated;
}
.beta-submit:hover{
  background:#FDE047;
  box-shadow:
    inset -4px -4px 0 #A16207,
    inset 4px 4px 0 #FEF9C3,
    0 6px 0 #713F12,
    0 0 30px rgba(250,204,21,0.4);
}
.beta-submit:active{
  transform:translateY(6px);
  box-shadow:inset -4px -4px 0 #A16207,inset 4px 4px 0 #FDE68A,0 0 0 #713F12;
}
.beta-note{
  text-align:center;margin-top:16px;
  font-size:11px;color:var(--fl-text-dim);
}
.beta-spots{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:var(--fl-r-full);
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.25);
  font-family:var(--fl-font-mono);font-size:10px;
  color:var(--fl-danger);
  margin-bottom:20px;
}
.beta-spots .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--fl-danger);
  animation:pulse 1.5s infinite;
}

/* FOOTER */
.footer{
  background:linear-gradient(180deg,var(--fl-bg) 0%,#060410 100%);
  border-top:1px solid var(--fl-border);
  padding:64px 24px 0;
  position:relative;
}

/* TRUST SEALS SECTION - secao propria ACIMA do footer */
.trust-seals-section{
  background:linear-gradient(180deg,var(--fl-bg) 0%,#08051a 100%);
  padding:80px 24px;
  position:relative;
  overflow:hidden;
}
.trust-seals-section::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 50%,rgba(124,58,237,0.1) 0%,transparent 50%),
    radial-gradient(circle at 80% 50%,rgba(0,255,179,0.06) 0%,transparent 50%);
  pointer-events:none;
}
.trust-seals-header{
  text-align:center;margin-bottom:48px;
  position:relative;z-index:1;
}
.trust-seals-title{
  font-family:var(--fl-font-brand);
  font-size:clamp(10px,1.6vw,14px);
  letter-spacing:3px;line-height:1.5;
  color:var(--fl-text);
  margin-bottom:12px;
}
.trust-seals-subtitle{
  font-size:14px;color:var(--fl-text-muted);
  max-width:520px;margin:0 auto;line-height:1.6;
}
.trust-seals-grid{
  max-width:1200px;margin:0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  position:relative;z-index:1;
}
.trust-seal{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:28px 20px;
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border);
  border-radius:var(--fl-r-lg);
  transition:all .3s var(--fl-ease);
  gap:16px;
}
.trust-seal:hover{
  border-color:var(--cyan);
  background:linear-gradient(180deg,var(--fl-bg-card) 0%,rgba(0,255,179,0.04) 100%);
  box-shadow:0 0 30px var(--cyan-glow),0 20px 40px rgba(0,0,0,0.3);
  transform:translateY(-4px);
}
.trust-seal-icon{
  width:56px;height:56px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  border:2px solid;
}
.trust-seal-icon.pagamento{
  background:rgba(0,204,142,0.1);color:var(--cyan);border-color:rgba(0,255,179,0.3);
}
.trust-seal-icon.garantia{
  background:rgba(255,184,0,0.1);color:var(--gold);border-color:rgba(255,184,0,0.3);
}
.trust-seal-icon.lgpd{
  background:rgba(124,58,237,0.1);color:var(--fl-purple-300);border-color:rgba(124,58,237,0.3);
}
.trust-seal-icon.suporte{
  background:rgba(0,255,179,0.08);color:var(--cyan);border-color:rgba(0,255,179,0.3);
}
.trust-seal-text{display:flex;flex-direction:column;gap:6px}
.trust-seal-title{
  font-family:var(--fl-font-brand);font-size:9px;letter-spacing:2px;
  color:var(--fl-text);
}
.trust-seal-desc{
  font-size:11px;color:var(--fl-text-muted);line-height:1.4;
}
.footer-grid{
  max-width:1200px;margin:0 auto;
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr 1.2fr;
  gap:48px;
  padding-bottom:48px;
}
.footer-col h4{
  font-family:var(--fl-font-brand);font-size:9px;letter-spacing:2px;
  color:var(--fl-purple-300);margin-bottom:18px;
}
.footer-brand-logo{
  height:42px;width:auto;
  filter:drop-shadow(0 0 16px rgba(147,51,234,0.4));
  margin-bottom:16px;
}
.footer-brand-desc{
  font-size:13px;color:var(--fl-text-muted);
  line-height:1.7;margin-bottom:20px;max-width:280px;
}
.footer-social{
  display:flex;gap:10px;
}
.footer-social a{
  width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border-md);
  color:var(--fl-text-muted);
  transition:all .2s;
  text-decoration:none;
}
.footer-social a:hover{
  border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 12px var(--cyan-glow);
}
.footer-links{list-style:none;display:flex;flex-direction:column;gap:10px}
.footer-links a{
  font-size:13px;color:var(--fl-text-muted);
  text-decoration:none;transition:color .2s;
}
.footer-links a:hover{color:var(--cyan)}
.footer-contact-item{
  display:flex;align-items:flex-start;gap:10px;
  font-size:13px;color:var(--fl-text-muted);
  margin-bottom:12px;line-height:1.5;
}
.footer-contact-item svg{flex-shrink:0;margin-top:2px;color:var(--fl-purple-300)}

/* SEALS — selos de seguranca */
.footer-seals{
  background:rgba(0,0,0,0.3);
  border-top:1px solid var(--fl-border);
  border-bottom:1px solid var(--fl-border);
  padding:32px 24px;
}
.footer-seals-grid{
  max-width:1200px;margin:0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;align-items:center;
}
.footer-seal{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:16px 12px;
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border);
  transition:all .3s;
}
.footer-seal:hover{
  border-color:var(--cyan);
  box-shadow:0 0 20px var(--cyan-glow);
  transform:translateY(-2px);
}
.footer-seal-icon{
  width:40px;height:40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.footer-seal-icon.pagamento{background:rgba(0,204,142,0.12);color:var(--cyan)}
.footer-seal-icon.garantia{background:rgba(255,184,0,0.12);color:var(--gold)}
.footer-seal-icon.lgpd{background:rgba(124,58,237,0.12);color:var(--fl-purple-300)}
.footer-seal-icon.suporte{background:rgba(0,255,179,0.08);color:var(--cyan)}
.footer-seal-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.footer-seal-title{
  font-family:var(--fl-font-brand);font-size:8px;letter-spacing:1.5px;
  color:var(--fl-text);
}
.footer-seal-desc{font-size:10px;color:var(--fl-text-muted);line-height:1.3}

/* BOTTOM BAR */
.footer-bottom{
  max-width:1200px;margin:0 auto;
  padding:24px 0;
  border-top:1px solid var(--fl-border);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;
}
.footer-copy{
  font-size:11px;color:var(--fl-text-dim);font-family:var(--fl-font-mono);
}
.footer-copy strong{color:var(--fl-text-muted);font-weight:600}
.footer-bottom-links{
  display:flex;gap:18px;flex-wrap:wrap;
}
.footer-bottom-links a{
  font-size:11px;color:var(--fl-text-dim);
  text-decoration:none;font-family:var(--fl-font-mono);
  transition:color .2s;
}
.footer-bottom-links a:hover{color:var(--cyan)}

/* LGPD COOKIE BANNER */
.lgpd-banner{
  position:fixed;bottom:20px;left:20px;right:20px;
  max-width:680px;margin:0 auto;
  background:var(--fl-bg-card);
  border:1px solid var(--fl-purple);
  box-shadow:0 10px 40px rgba(0,0,0,0.5),0 0 30px rgba(147,51,234,0.3);
  padding:20px 24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  z-index:9999;
  transform:translateY(150%);
  transition:transform .5s var(--fl-ease);
}
.lgpd-banner.show{transform:translateY(0)}
.lgpd-icon{
  width:36px;height:36px;flex-shrink:0;
  background:rgba(124,58,237,0.15);
  border:1px solid var(--fl-purple);
  display:flex;align-items:center;justify-content:center;
  color:var(--fl-purple-300);
}
.lgpd-content{flex:1;min-width:200px}
.lgpd-title{
  font-family:var(--fl-font-brand);font-size:8px;letter-spacing:1.5px;
  color:var(--fl-purple-300);margin-bottom:4px;
}
.lgpd-text{font-size:12px;color:var(--fl-text-muted);line-height:1.5;margin:0}
.lgpd-text a{color:var(--cyan);text-decoration:underline}
.lgpd-actions{display:flex;gap:8px;flex-shrink:0}
.lgpd-btn{
  padding:10px 18px;
  font-family:var(--fl-font-brand);font-size:8px;letter-spacing:1px;
  border:none;cursor:pointer;
  transition:all .2s;
}
.lgpd-btn-accept{
  background:var(--cyan);color:#000;
  box-shadow:inset -2px -2px 0 #059669,inset 2px 2px 0 #6EE7B7;
}
.lgpd-btn-accept:hover{background:#6EE7B7}
.lgpd-btn-reject{
  background:transparent;color:var(--fl-text-muted);
  border:1px solid var(--fl-border-md);
}
.lgpd-btn-reject:hover{border-color:var(--fl-text-muted);color:var(--fl-text)}

/* ============================================================
   SCROLL REVEAL
   ============================================================ */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s var(--fl-ease),transform .6s var(--fl-ease)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-iteration-count:1!important}
  #particles-canvas{display:none}
}
/* Mobile + Instagram in-app: desativar animacoes pesadas para performance */
@media(max-width:768px){
  *,*::before,*::after{animation-duration:0.3s!important}
  .orb,.btn-pulse,.glow-pulse,.dot-pulse,.mago-breath,.pixelWalk,
  .float-orb,.pulseGlow,.gradient-shift,.line-pulse{animation:none!important}
  .filter\:drop-shadow{filter:none!important}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

/* ============================================================
   SIMULADOR DE OPORTUNIDADES
   ============================================================ */
.sim-section{
  background:linear-gradient(180deg,rgba(147,51,234,0.04),transparent);
  position:relative;
  overflow:hidden;
}
.sim-wrapper{
  max-width:780px;margin:0 auto;
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border-md);
  border-radius:var(--fl-r-xl);
  padding:36px;
  position:relative;
  z-index:1;
  box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 40px rgba(147,51,234,0.08);
}
.sim-form{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  margin-bottom:18px;
}
.sim-form-full{grid-column:1 / -1}
.sim-field{display:flex;flex-direction:column;gap:6px}
.sim-field label{
  font-family:var(--fl-font-mono);font-size:10px;
  color:var(--fl-text-muted);text-transform:uppercase;letter-spacing:0.08em;
}
.sim-field select,.sim-field input{
  background:var(--fl-bg);
  border:1px solid var(--fl-border-md);
  border-radius:var(--fl-r-md);
  color:var(--fl-text);
  font-family:var(--fl-font-ui);
  font-size:14px;padding:12px 14px;
  outline:none;transition:border-color 120ms;
}
.sim-field select:focus,.sim-field input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,255,179,0.1);
}
.sim-ticket-group{display:flex;gap:6px;flex-wrap:wrap}
.sim-ticket-btn{
  flex:1;min-width:80px;padding:10px 8px;
  background:transparent;border:1px solid var(--fl-border-md);
  color:var(--fl-text-muted);
  font-family:var(--fl-font-mono);font-size:11px;
  cursor:pointer;border-radius:var(--fl-r-sm);
  transition:all 120ms;
}
.sim-ticket-btn:hover{border-color:var(--cyan);color:var(--fl-text)}
.sim-ticket-btn.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}
.sim-submit{
  width:100%;margin-top:8px;
  padding:16px 24px;
  font-family:var(--fl-font-brand);font-size:11px;letter-spacing:1.2px;
  background:var(--gold);color:#000;
  border:none;cursor:pointer;
  box-shadow:
    inset -3px -3px 0 #A16207,
    inset 3px 3px 0 #FDE68A,
    0 4px 0 #713F12;
  transition:transform 80ms,box-shadow 80ms;
  border-radius:0;
}
.sim-submit:hover{background:#FDE047;transform:translateY(-2px);box-shadow:inset -3px -3px 0 #A16207,inset 3px 3px 0 #FEF9C3,0 6px 0 #713F12,0 0 30px rgba(255,184,0,0.5)}
.sim-submit:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 #A16207,inset 3px 3px 0 #FDE68A,0 2px 0 #713F12}

/* Loading do simulador */
.sim-loading{display:none;padding:30px 0;text-align:center}
.sim-loading.active{display:block}
.sim-loading-step{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;margin:6px auto;
  max-width:380px;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--fl-border);
  border-radius:var(--fl-r-md);
  font-family:var(--fl-font-mono);font-size:12px;
  color:var(--fl-text-muted);
  opacity:0;transform:translateX(-8px);
  animation:step-in 0.4s var(--fl-ease) forwards;
}
.sim-loading-step.active{color:var(--cyan);border-color:rgba(0,255,179,0.3);background:rgba(0,255,179,0.04)}
.sim-loading-step .step-bullet{
  width:8px;height:8px;border-radius:50%;
  background:var(--fl-text-dim);
  flex-shrink:0;
}
.sim-loading-step.active .step-bullet{
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan-glow);
  animation:dot-pulse 1s ease-in-out infinite;
}
@keyframes step-in{to{opacity:1;transform:translateX(0)}}

/* Resultado do simulador */
.sim-result{display:none;padding:20px 0}
.sim-result.active{display:block;animation:fadeUp 0.5s var(--fl-ease)}
.sim-metric-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  margin:20px 0;
}
.sim-metric{
  background:var(--fl-bg-surface);
  border:1px solid var(--fl-border);
  border-radius:var(--fl-r-md);
  padding:14px 10px;text-align:center;
}
.sim-metric-num{
  font-family:var(--fl-font-mono);font-size:22px;font-weight:700;
  color:var(--cyan);
  line-height:1;
}
.sim-metric:nth-child(2) .sim-metric-num{color:var(--fl-purple-300)}
.sim-metric:nth-child(3) .sim-metric-num{color:var(--gold)}
.sim-metric:nth-child(4) .sim-metric-num{color:var(--fl-success)}
.sim-metric:nth-child(5) .sim-metric-num{color:var(--fl-text)}
.sim-metric-label{
  font-family:var(--fl-font-mono);font-size:9px;
  color:var(--fl-text-muted);text-transform:uppercase;
  letter-spacing:0.3px;margin-top:6px;line-height:1.2;
}
.sim-potential{
  background:linear-gradient(135deg,rgba(255,184,0,0.06),rgba(147,51,234,0.04));
  border:1px solid rgba(255,184,0,0.2);
  border-radius:var(--fl-r-md);
  padding:18px 20px;margin:18px 0;
}
.sim-potential h4{
  font-family:var(--fl-font-brand);font-size:9px;
  color:var(--gold);letter-spacing:1.5px;margin-bottom:12px;
}
.sim-potential-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);
  font-family:var(--fl-font-mono);font-size:13px;
}
.sim-potential-row:last-child{border:none}
.sim-potential-row strong{color:var(--gold);font-weight:700}
.sim-disclaimer{
  font-size:11px;color:var(--fl-text-dim);
  font-style:italic;line-height:1.5;
  margin-top:14px;padding-top:14px;
  border-top:1px solid var(--fl-border);
}

@media(max-width:640px){
  .sim-form{grid-template-columns:1fr}
  .sim-metric-grid{grid-template-columns:repeat(2,1fr)}
  .sim-ticket-group{flex-wrap:wrap}
  .sim-ticket-btn{min-width:60px}
}
