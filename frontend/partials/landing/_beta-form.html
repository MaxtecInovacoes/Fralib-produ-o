<!-- ===== FORMULÁRIO BETA ===== -->
<section class="beta-section" id="beta-form">
  <div class="container">
    <div class="beta-wrapper reveal">
      <div style="text-align:center">
        <span class="beta-spots"><span class="dot"></span> VAGAS LIMITADAS</span>
      </div>
      <h2>GARANTA SUA VAGA NA VERSÃO BETA</h2>
      <p class="beta-subtitle">Preencha seus dados e entre no grupo exclusivo de early adopters do FraLib OS.</p>
      <form id="betaForm">
        <div class="beta-field">
          <label for="beta-name">Seu nome</label>
          <input type="text" id="beta-name" name="name" placeholder="Ex: João Silva" required>
        </div>
        <div class="beta-field">
          <label for="beta-email">E-mail</label>
          <input type="email" id="beta-email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="beta-field">
          <label for="beta-phone">WhatsApp</label>
          <input type="tel" id="beta-phone" name="phone" placeholder="(11) 99999-9999" required>
        </div>
        <button type="submit" class="beta-submit">QUERO PARTICIPAR DA BETA</button>
      </form>
      <p class="beta-note">Ao enviar, você será redirecionado para o grupo do WhatsApp.</p>
    </div>
  </div>
</section>
