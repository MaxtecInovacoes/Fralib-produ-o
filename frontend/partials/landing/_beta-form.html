<!-- ===== SEÇÃO 15 — CTA FINAL / FORMULÁRIO ===== -->
<section class="beta-section" id="cta-final">
  <div class="container">
    <div class="beta-wrapper reveal">
      <div style="text-align:center">
        <span class="beta-spots"><span class="dot"></span> VAGAS DO BETA ABERTAS</span>
      </div>
      <h2 style="background:linear-gradient(135deg,var(--cyan),var(--fl-purple-300));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">PARE DE PROCURAR CLIENTE NO ESCURO</h2>
      <p class="beta-subtitle">Simule sua região, encontre oportunidades locais e use a FraLib para gerar lead, prévia de site e abordagem pronta.</p>
      <form id="ctaForm">
        <div class="beta-field">
          <label for="cta-name">Seu nome</label>
          <input type="text" id="cta-name" name="name" placeholder="Ex: João Silva" required>
        </div>
        <div class="beta-field">
          <label for="cta-email">E-mail</label>
          <input type="email" id="cta-email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="beta-field">
          <label for="cta-phone">WhatsApp</label>
          <input type="tel" id="cta-phone" name="phone" placeholder="(11) 99999-9999" required>
        </div>
        <div class="beta-field">
          <label for="cta-cidade">Cidade</label>
          <input type="text" id="cta-cidade" name="cidade" placeholder="Ex: São Paulo" required>
        </div>
        <div class="beta-field">
          <label for="cta-nicho">Nicho que quer atacar</label>
          <input type="text" id="cta-nicho" name="nicho" placeholder="Ex: Pizzarias, Clínicas..." required>
        </div>
        <button type="submit" class="beta-submit">QUERO SIMULAR MINHA REGIÃO</button>
      </form>
      <p class="beta-note">Você recebe acesso ao beta, grupo WhatsApp e instruções para começar.</p>
    </div>
  </div>
</section>
