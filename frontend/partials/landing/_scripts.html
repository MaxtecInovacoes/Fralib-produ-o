<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
// === NAV SCROLL ===
const header = document.getElementById('siteHeader');
window.addEventListener('scroll', () => {
  header.classList.toggle('scrolled', window.scrollY > 50);
}, { passive: true });

// === MOBILE MENU ===
const burger = document.getElementById('headerBurger');
const headerNav = document.getElementById('headerNav');
burger?.addEventListener('click', () => {
  const open = headerNav.classList.toggle('open');
  burger.setAttribute('aria-expanded', open ? 'true' : 'false');
});
headerNav?.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  headerNav.classList.remove('open');
  burger.setAttribute('aria-expanded', 'false');
}));

// === SCROLL REVEAL ===
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if(entry.isIntersecting){
      setTimeout(() => entry.target.classList.add('visible'), i * 60);
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

// === FAQ ACCORDION ===
document.querySelectorAll('.faq-question').forEach(btn => {
  btn.addEventListener('click', () => {
    const item = btn.parentElement;
    const isActive = item.classList.contains('active');
    document.querySelectorAll('.faq-item.active').forEach(i => i.classList.remove('active'));
    if(!isActive) item.classList.add('active');
    btn.setAttribute('aria-expanded', !isActive);
  });
});

// === SMOOTH SCROLL ===
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const t = document.querySelector(a.getAttribute('href'));
    if(t){
      t.scrollIntoView({ behavior:'smooth', block:'start' });
      document.getElementById('navLinks').classList.remove('open');
    }
  });
});

// === BETA FORM ===
document.getElementById('betaForm')?.addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('beta-name').value.trim();
  const email = document.getElementById('beta-email').value.trim();
  const phone = document.getElementById('beta-phone').value.trim();
  if(name && email && phone){
    try {
      const leads = JSON.parse(localStorage.getItem('fralib_beta') || '[]');
      leads.push({ name, email, phone, date: new Date().toISOString() });
      localStorage.setItem('fralib_beta', JSON.stringify(leads));
    } catch(err){}
    if(typeof fbq !== 'undefined') fbq('track', 'Lead');
    window.open(WHATSAPP_URL, '_blank');
  }
});

// === CTA FINAL FORM ===
document.getElementById('ctaForm')?.addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('cta-name').value.trim();
  const email = document.getElementById('cta-email').value.trim();
  const phone = document.getElementById('cta-phone').value.trim();
  const cidade = document.getElementById('cta-cidade').value.trim();
  const nicho = document.getElementById('cta-nicho').value.trim();
  if(name && email && phone && cidade && nicho){
    try {
      const leads = JSON.parse(localStorage.getItem('fralib_leads') || '[]');
      leads.push({ name, email, phone, cidade, nicho, date: new Date().toISOString() });
      localStorage.setItem('fralib_leads', JSON.stringify(leads));
    } catch(err){}
    if(typeof fbq !== 'undefined') fbq('track', 'Lead', { cidade, nicho });
    setTimeout(() => { window.location = CHECKOUT_URL; }, 300);
  }
});

// === SIMULADOR DE OPORTUNIDADES ===
(function(){
  const simForm = document.getElementById('simForm');
  if(!simForm) return;

  const ticketGroup = document.getElementById('sim-ticket-group');
  const ticketInput = document.getElementById('sim-ticket');
  const ticketLabel = document.getElementById('simTicketLabel');

  ticketGroup?.addEventListener('click', function(e){
    const btn = e.target.closest('.sim-ticket-btn');
    if(!btn) return;
    ticketGroup.querySelectorAll('.sim-ticket-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const val = btn.dataset.ticket;
    if(val === 'custom'){
      const custom = prompt('Digite o ticket em R$ (apenas números):');
      if(custom && /^\d+$/.test(custom) && parseInt(custom) > 0){
        ticketInput.value = custom;
        ticketLabel.textContent = 'R$ ' + parseInt(custom).toLocaleString('pt-BR');
        btn.textContent = 'R$ ' + parseInt(custom).toLocaleString('pt-BR');
      } else {
        ticketInput.value = 1000;
        ticketLabel.textContent = 'R$ 1.000';
        ticketGroup.querySelector('[data-ticket="1000"]').classList.add('active');
      }
    } else {
      ticketInput.value = val;
      ticketLabel.textContent = 'R$ ' + parseInt(val).toLocaleString('pt-BR');
    }
  });

  simForm.addEventListener('submit', function(e){
    e.preventDefault();
    const cidade = document.getElementById('sim-cidade').value;
    const nicho = document.getElementById('sim-nicho').value;
    if(!cidade || !nicho) return;

    if(typeof fbq !== 'undefined') fbq('track', 'Lead', { cidade, nicho });

    simForm.style.display = 'none';
    const loading = document.getElementById('simLoading');
    const result = document.getElementById('simResult');
    loading.classList.add('active');
    result.classList.remove('active');

    const steps = loading.querySelectorAll('.sim-loading-step');
    steps.forEach((s, i) => {
      setTimeout(() => {
        s.style.opacity = '1';
        s.style.transform = 'translateX(0)';
        s.classList.add('active');
      }, (i + 1) * 500);
    });

    setTimeout(() => {
      loading.classList.remove('active');
      result.classList.add('active');
      result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 3200);
  });
})();

// === CHECKOUT MERCADO PAGO ===
// Intercepta cliques em botoes de pagamento e chama /api/credits/criar-checkout
// Usa cookie de sessao (mais seguro que Bearer token em localStorage).
// Se 401: redireciona para cadastro. Se 200: redireciona para init_point MP.
(function(){
  const isCheckoutBtn = (el) => {
    if(!el) return false;
    const href = el.getAttribute('href') || '';
    const onclick = el.getAttribute('onclick') || '';
    const text = (el.textContent || '').toLowerCase();
    if (onclick.includes('CHECKOUT_URL') || href.includes('checkout')) return true;
    if (text.includes('assinar') || text.includes('ativar') || text.includes('contratar') || text.includes('testar gratis') || text.includes('entrar no beta')) return true;
    return false;
  };
  const extractPlan = (el, fallback) => {
    const onclick = el.getAttribute('onclick') || '';
    const href = el.getAttribute('href') || '';
    const m1 = onclick.match(/plan=([a-z\\-]+)/i);
    if (m1) return m1[1];
    const m2 = href.match(/plan=([a-z\\-]+)/i);
    if (m2) return m2[1];
    const section = el.closest('section, header, footer, div');
    if (section) {
      const idMatch = section.id && section.id.match(/(starter|pro|agency|trial|upgrade)/i);
      if (idMatch) return idMatch[1].toLowerCase();
    }
    const text = (el.textContent || '').toLowerCase();
    if (text.includes('agency')) return 'agency';
    if (text.includes('pro')) return 'pro';
    if (text.includes('starter')) return 'starter';
    if (text.includes('trial') || text.includes('testar')) return 'trial';
    return fallback;
  };
  document.addEventListener('click', async function(e){
    const btn = e.target.closest('a, button');
    if(!isCheckoutBtn(btn)) return;
    e.preventDefault();
    if(typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout');

    const plan = extractPlan(btn, 'starter');

    btn.style.opacity = '0.6';
    btn.style.pointerEvents = 'none';
    try {
      const resp = await fetch('/api/credits/criar-checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ plano: plan })
      });
      if (resp.status === 401 || resp.status === 403) {
        // Nao autenticado: vai para cadastro com plano selecionado
        window.location = SIGNUP_URL + '&plan=' + plan;
        return;
      }
      const data = await resp.json();
      if (data.checkout_url) {
        window.location = data.checkout_url;
        return;
      }
      throw new Error(data.detail || 'Checkout indisponivel');
    } catch (err) {
      // Fallback: vai para /planos para ver opcoes
      window.location = '/planos?plan=' + plan;
    } finally {
      btn.style.opacity = '';
      btn.style.pointerEvents = '';
    }
  }, true);
})();

// === META PIXEL EVENTS ===
(function(){
  if(typeof fbq !== 'undefined'){
    fbq('track', 'ViewContent', { content_name: 'landing-page' });
  }

  document.addEventListener('click', function(e){
    const target = e.target.closest('a[onclick*="CHECKOUT_URL"], a[href*="checkout"]');
    if(target && typeof fbq !== 'undefined'){
      fbq('track', 'InitiateCheckout', { content_name: 'beta-pro' });
    }
    const wa = e.target.closest('a[onclick*="WHATSAPP_URL"], a[href*="wa.me"], a[href*="whatsapp"], .wa-float');
    if(wa && typeof fbq !== 'undefined'){
      fbq('track', 'Contact', { method: 'whatsapp' });
    }
    const trial = e.target.closest('a[onclick*="TRIAL_URL"], a[href*="trial"]');
    if(trial && typeof fbq !== 'undefined'){
      fbq('track', 'CompleteRegistration', { content_name: 'trial' });
    }
  });
})();

</script>

<script src="/js/fralib-tracker.js" defer></script>
</body>
</html>
