<script>
// === NAV SCROLL ===
const nav = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 50);
}, { passive: true });

// === MOBILE MENU ===
document.getElementById('mobileToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

// === SCROLL REVEAL ===
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if(entry.isIntersecting){
      setTimeout(() => entry.target.classList.add('visible'), i * 60);
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

// === FAQ ACCORDION ===
document.querySelectorAll('.faq-question').forEach(btn => {
  btn.addEventListener('click', () => {
    const item = btn.parentElement;
    const isActive = item.classList.contains('active');
    document.querySelectorAll('.faq-item.active').forEach(i => i.classList.remove('active'));
    if(!isActive) item.classList.add('active');
    btn.setAttribute('aria-expanded', !isActive);
  });
});

// === SMOOTH SCROLL ===
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const t = document.querySelector(a.getAttribute('href'));
    if(t){
      t.scrollIntoView({ behavior:'smooth', block:'start' });
      document.getElementById('navLinks').classList.remove('open');
    }
  });
});

// === BETA FORM ===
document.getElementById('betaForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('beta-name').value.trim();
  const email = document.getElementById('beta-email').value.trim();
  const phone = document.getElementById('beta-phone').value.trim();
  if(name && email && phone){
    // Store locally for reference
    try {
      const leads = JSON.parse(localStorage.getItem('fralib_beta') || '[]');
      leads.push({ name, email, phone, date: new Date().toISOString() });
      localStorage.setItem('fralib_beta', JSON.stringify(leads));
    } catch(err){}
    // Redirect to WhatsApp group
    window.open('https://chat.whatsapp.com/FSrvUIVFvjBFQrkfDQgP0A', '_blank');
  }
});

// === PARALLAX ===
(function(){
  const parallaxEls = document.querySelectorAll('[data-parallax]');
  const orbs = document.querySelectorAll('.orb');
  const mascots = document.querySelectorAll('.hero-mascot, .steps-mascot, .cta-mascot');
  let ticking = false;

  function updateParallax(){
    const scrollY = window.scrollY;
    const vh = window.innerHeight;

    // Orbs parallax (slow drift)
    orbs.forEach((orb, i) => {
      const speed = 0.03 + i * 0.015;
      orb.style.transform = 'translateY(' + (scrollY * speed) + 'px)';
    });

    // Mascots parallax (medium)
    mascots.forEach(m => {
      const rect = m.getBoundingClientRect();
      const center = rect.top + rect.height / 2;
      const offset = (center - vh / 2) * 0.06;
      m.style.transform = 'translateY(' + (-offset) + 'px)';
    });

    // Grid parallax
    const heroGrid = document.querySelector('.hero-grid');
    if(heroGrid) heroGrid.style.transform = 'translateY(' + (scrollY * 0.15) + 'px)';

    // Section titles subtle parallax
    document.querySelectorAll('.section-title').forEach(title => {
      const rect = title.getBoundingClientRect();
      if(rect.top < vh && rect.bottom > 0){
        const progress = (vh - rect.top) / (vh + rect.height);
        title.style.transform = 'translateY(' + ((progress - 0.5) * -20) + 'px)';
      }
    });

    ticking = false;
  }

  window.addEventListener('scroll', function(){
    if(!ticking){
      requestAnimationFrame(updateParallax);
      ticking = true;
    }
  }, { passive: true });
})();
</script>


<script>
// --- Theme Toggle Logic ---
const tBtn = document.getElementById('themeToggle');
const root = document.body;
function toggleTheme() {
  root.classList.toggle('light-mode');
  const isLight = root.classList.contains('light-mode');
  localStorage.setItem('fralib_theme', isLight ? 'light' : 'dark');
  // Update particles color based on theme
  if(window.pJSDom && window.pJSDom[0]) {
    const lightColors = ["#4c1d9e", "#00cc8e", "#eab308"];
    const darkColors  = ["#9333ea", "#00ffb3", "#ffb800", "#a855f7"];
    window.pJSDom[0].pJS.particles.color.value = isLight ? lightColors : darkColors;
    window.pJSDom[0].pJS.particles.line_linked.color = isLight ? '#7c3aed' : '#c084fc';
    window.pJSDom[0].pJS.fn.particlesRefresh();
  }
}
if(localStorage.getItem('fralib_theme') === 'light') toggleTheme();
tBtn.addEventListener('click', toggleTheme);

// --- Particles JS Init ---
const initLightColors = ["#4c1d9e", "#00cc8e", "#eab308"];
const initDarkColors  = ["#ffffff", "#dcdcdc", "#a855f7"];
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 250, "density": { "enable": true, "value_area": 1000 } },
    "color": { "value": document.body.classList.contains('light-mode') ? initLightColors : initDarkColors },
    "shape": { "type": "circle" },
    "opacity": {
      "value": 0.4,
      "random": true,
      "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false }
    },
    "size": {
      "value": 2,
      "random": true,
       "anim": { "enable": true, "speed": 2, "size_min": 0.3, "sync": false }
    },
    "line_linked": {
      "enable": false
    },
    "move": {
      "enable": true,
      "speed": 0.3,
      "direction": "none",
      "random": true,
      "straight": false,
      "out_mode": "out",
      "bounce": false
    }
  },
  "interactivity": {
    "detect_on": "window",
    "events": {
      "onhover": { "enable": false },
      "onclick": { "enable": false }
    }
  },
  "retina_detect": true
});
  </script>
<script src="/js/fralib-tracker.js" defer></script>
</body>
</html>
