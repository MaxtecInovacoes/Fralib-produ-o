function _whatsappMarkQrConnected() {
  var modal = document.getElementById('qr-modal');
  if (modal && modal._pollInterval) {
    clearInterval(modal._pollInterval);
    modal._pollInterval = null;
  }
  var statusEl = document.getElementById('qr-modal-status');
  var imgEl = document.getElementById('qr-modal-img');
  if (statusEl) statusEl.innerHTML = '<span style="color:#10b981;font-weight:600">WhatsApp conectado.</span>';
  if (imgEl) imgEl.style.display = 'none';
  var avisoWpp = document.getElementById('onboarding-aviso-wpp');
  if (avisoWpp) avisoWpp.remove();
  var statusWhats = document.getElementById('statusWhatsApp');
  if (statusWhats) statusWhats.innerHTML = 'Status: <span style="color:#10b981">CONECTADO</span>';
  mostrarToast('WhatsApp conectado!');
  verificarStatusWhatsApp();
  verificarOnboarding();
  setTimeout(fecharQRModal, 1800);
}

function _whatsappStartQrPoll(modal) {
  if (!modal) return;
  if (modal._pollInterval) clearInterval(modal._pollInterval);
  var attempts = 0;
  modal._qrAutoRenewing = false;
  modal._pollInterval = setInterval(async function() {
    attempts++;
    try {
      var r = await authFetch('/api/whatsapp/status');
      if (!r.ok) return;
      var data = await r.json().catch(function(){ return {}; });
      var status = _whatsappPayloadStatus(data);
      var qr = _whatsappPayloadQr(data);
      if (_whatsappPayloadConnected(data)) {
        _whatsappMarkQrConnected();
        return;
      }
      if (qr) {
        _whatsappSetQrModalImage(_whatsappQrSrc(qr));
        var waiting = document.getElementById('qr-modal-status');
        if (waiting) waiting.textContent = 'Aguardando leitura do QR Code...';
      }
      if (status === 'timeout' || status === 'rejected' || status === 'logged_out' || status === 'error') {
        var err = document.getElementById('qr-modal-status');
        if (err) err.innerHTML = '<span style="color:#ef4444;font-weight:600">QR expirado ou rejeitado. Gere um novo QR.</span>';
      } else if (attempts >= 30 && !modal._qrAutoRenewing) {
        modal._qrAutoRenewing = true;
        var renewing = document.getElementById('qr-modal-status');
        if (renewing) renewing.textContent = 'QR expirando. Gerando novo QR automaticamente...';
        await renovarQRCodeWhatsApp();
      } else if (attempts >= 90) {
        var expired = document.getElementById('qr-modal-status');
        if (expired) expired.innerHTML = '<span style="color:#f59e0b;font-weight:600">QR antigo. Gere um novo QR se o celular nao conectar.</span>';
      }
    } catch(e) {}
  }, 2000);
}

async function renovarQRCodeWhatsApp() {
  var statusEl = document.getElementById('qr-modal-status');
  try {
    if (statusEl) statusEl.textContent = 'Gerando novo QR Code...';
    var modal = document.getElementById('qr-modal');
    if (modal && modal._pollInterval) {
      clearInterval(modal._pollInterval);
      modal._pollInterval = null;
    }
    await authFetch('/api/whatsapp/disconnect', { method: 'POST' });
    var response = await authFetch('/api/whatsapp/connect', { method: 'POST' });
    var data = await response.json().catch(function(){ return {}; });
    if (!response.ok) throw new Error(_whatsappErrorMessage(data, 'Falha ao gerar novo QR'));
    var qr = _whatsappPayloadQr(data);
    if (qr) {
      mostrarQRCodeModal(qr);
      return;
    }
    if (_whatsappPayloadConnected(data)) {
      _whatsappMarkQrConnected();
      return;
    }
    if (statusEl) statusEl.textContent = 'Aguardando o novo QR Code...';
  } catch(e) {
    if (statusEl) statusEl.innerHTML = '<span style="color:#ef4444;font-weight:600">Erro ao renovar QR: ' + e.message + '</span>';
  }
}

function mostrarQRCodeModal(qrCodeBase64) {
  var src = _whatsappQrSrc(qrCodeBase64);
  var existing = document.getElementById('qr-modal');
  if (existing) {
    var existingStatus = document.getElementById('qr-modal-status');
    _whatsappSetQrModalImage(src);
    if (existingStatus) existingStatus.textContent = 'Aguardando leitura do QR Code...';
    _whatsappStartQrPoll(existing);
    return;
  }
  var modal = document.createElement('div');
  modal.id = 'qr-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999';
  var content = document.createElement('div');
  content.style.cssText = 'background:var(--fl-bg-card);padding:28px;border-radius:16px;text-align:center;max-width:460px;width:min(94vw,460px)';
  content.innerHTML =
    '<h3 style="margin-bottom:8px;color:var(--fl-text)">Escaneie o QR Code</h3>' +
    '<p style="color:var(--fl-text-muted);margin-bottom:18px;font-size:13px">No WhatsApp normal ou Business: Dispositivos conectados > Conectar dispositivo.</p>' +
    '<div id="qr-image-shell" style="background:#fff;padding:14px;margin:0 auto 16px;width:fit-content;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.35)">' +
    '<img id="qr-modal-img" src="' + src + '" alt="QR Code do WhatsApp" style="width:340px;height:340px;max-width:calc(94vw - 84px);max-height:calc(94vw - 84px);margin:0 auto;display:block;border-radius:0;image-rendering:pixelated" />' +
    '</div>' +
    '<p id="qr-modal-status" style="font-size:12px;color:var(--fl-text-muted);margin-bottom:16px">Aguardando leitura do QR Code...</p>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
    '<button onclick="renovarQRCodeWhatsApp()" style="background:transparent;color:var(--fl-text);padding:10px 18px;border:1px solid var(--fl-border);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px">GERAR NOVO QR</button>' +
    '<button onclick="fecharQRModal()" style="background:var(--fl-purple);color:white;padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px">FECHAR</button>' +
    '</div>';
  modal.appendChild(content);
  document.body.appendChild(modal);
  modal.addEventListener('click', function(e) { if (e.target === modal) fecharQRModal(); });
  _whatsappStartQrPoll(modal);
}

function fecharQRModal() {
  var modal = document.getElementById('qr-modal');
  if (modal) {
    if (modal._pollInterval) clearInterval(modal._pollInterval);
    modal.remove();
  }
}

/* ══ CONFIGURACAO DO SDR POR TENANT ═════════════════════════════ */
function _sdrSetValue(id, value) {
  var el = document.getElementById(id);
  if (el) el.value = value == null ? '' : value;
}

function _sdrSetChecked(id, value) {
  var el = document.getElementById(id);
  if (el) el.checked = !!value;
}

function _sdrLines(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value.map(function(v){ return String(v || '').trim(); }).filter(Boolean);
  return String(value || '').split(/\n|,|;/).map(function(v){ return v.trim(); }).filter(Boolean);
}

function _sdrTextareaLines(id) {
  var el = document.getElementById(id);
  return _sdrLines(el ? el.value : '');
}

function _sdrSetLines(id, value) {
  _sdrSetValue(id, _sdrLines(value).join('\n'));
}

function _sdrNumber(id, fallback) {
  var el = document.getElementById(id);
  var n = parseInt(el && el.value, 10);
  return Number.isFinite(n) ? n : fallback;
}

function _sdrBlockedDays() {
  var days = [];
  document.querySelectorAll('.sdr-day').forEach(function(el) {
    if (el.checked) days.push(parseInt(el.value, 10));
  });
  return days;
}

function _sdrSetBlockedDays(days) {
  var blocked = {};
  (days || [6]).forEach(function(day){ blocked[parseInt(day, 10)] = true; });
  document.querySelectorAll('.sdr-day').forEach(function(el) {
    el.checked = !!blocked[parseInt(el.value, 10)];
  });
}

function _sdrUpdateScheduleState() {
  var modeEl = document.getElementById('sdrOutboundMode');
  var mode = modeEl ? modeEl.value : 'system';
  var disabled = mode === 'always';
  ['sdrHoraInicio','sdrHoraFim'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.disabled = disabled;
      el.style.opacity = disabled ? '.5' : '1';
    }
  });
  document.querySelectorAll('.sdr-day').forEach(function(el) {
    el.disabled = disabled;
    el.parentElement.style.opacity = disabled ? '.5' : '1';
  });
}

function _sdrPlanLabelFromStatus(status) {
  status = status || {};
  var plan = (status.plano || '').toLowerCase() || '-';
  if (!status.whatsapp_allowed) return 'SDR bloqueado no plano ' + plan;
  if (plan === 'trial') return 'Trial com SDR ativo';
  return 'SDR ativo no plano ' + plan;
}

async function carregarSdrConfig() {
  var statusEl = document.getElementById('sdrConfigStatus');
  try {
    if (statusEl) statusEl.textContent = 'Carregando configuracao...';
    var r = await authFetch('/api/users/sdr-config?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Falha ao carregar SDR');
    var cfg = await r.json();
    var schedule = cfg.outbound_schedule || {};
    var handoff = cfg.handoff || {};
    var limits = cfg.limits || {};

    _sdrSetValue('sdrAgentName', cfg.agent_name || 'Franz');
    _sdrSetValue('sdrBaseMode', cfg.base_mode || 'native');
    _sdrSetValue('sdrOutboundMode', schedule.mode || 'system');
    _sdrSetValue('sdrResponseMode', cfg.response_mode || 'always');
    _sdrSetValue('sdrHoraInicio', schedule.hora_inicio == null ? 8 : schedule.hora_inicio);
    _sdrSetValue('sdrHoraFim', schedule.hora_fim == null ? 21 : schedule.hora_fim);
    _sdrSetBlockedDays(schedule.dias_bloqueados || [6]);
    _sdrSetValue('sdrObjective', cfg.objective || 'sell_until_close');
    _sdrSetValue('sdrKnowledgeMode', cfg.knowledge_mode || 'native');
    _sdrSetValue('sdrPersonality', cfg.personality || '');
    _sdrSetLines('sdrAllowedActions', cfg.allowed_actions || []);
    _sdrSetLines('sdrBlockedActions', cfg.blocked_actions || []);
    _sdrSetLines('sdrHandoffTriggers', handoff.triggers || []);
    _sdrSetValue('sdrHandoffNote', handoff.note || '');
    _sdrSetValue('sdrCustomKnowledge', cfg.custom_knowledge || '');
    _sdrSetValue('sdrCooldownSeconds', limits.reply_cooldown_seconds || 30);
    _sdrSetValue('sdrDailyLimit', limits.daily_limit_per_lead || 50);
    _sdrSetValue('sdrHumanPauseSeconds', limits.human_pause_seconds || 300);
    _sdrSetChecked('sdrIgnoreSavedContacts', cfg.bot_ignore_saved_contacts);
    _sdrUpdateScheduleState();
    if (statusEl) statusEl.textContent = 'Configuracao carregada.';
  } catch(e) {
    console.warn('[SDR Config] erro:', e);
    if (statusEl) { statusEl.textContent = 'Nao foi possivel carregar.'; statusEl.style.color = '#f59e0b'; }
  }
}

async function salvarSdrConfig() {
  var statusEl = document.getElementById('sdrConfigStatus');
  var btn = document.getElementById('btn-sdr-save');
  var payload = {
    base_mode: (document.getElementById('sdrBaseMode') || {}).value || 'native',
    agent_name: (document.getElementById('sdrAgentName') || {}).value || 'Franz',
    response_mode: (document.getElementById('sdrResponseMode') || {}).value || 'always',
    objective: (document.getElementById('sdrObjective') || {}).value || 'sell_until_close',
    outbound_schedule: {
      mode: (document.getElementById('sdrOutboundMode') || {}).value || 'system',
      timezone: 'America/Sao_Paulo',
      hora_inicio: _sdrNumber('sdrHoraInicio', 8),
      hora_fim: _sdrNumber('sdrHoraFim', 21),
      dias_bloqueados: _sdrBlockedDays()
    },
    personality: (document.getElementById('sdrPersonality') || {}).value || '',
    allowed_actions: _sdrTextareaLines('sdrAllowedActions'),
    blocked_actions: _sdrTextareaLines('sdrBlockedActions'),
    handoff: {
      enabled: true,
      triggers: _sdrTextareaLines('sdrHandoffTriggers'),
      note: (document.getElementById('sdrHandoffNote') || {}).value || ''
    },
    knowledge_mode: (document.getElementById('sdrKnowledgeMode') || {}).value || 'native',
    custom_knowledge: (document.getElementById('sdrCustomKnowledge') || {}).value || '',
    limits: {
      reply_cooldown_seconds: _sdrNumber('sdrCooldownSeconds', 30),
      daily_limit_per_lead: _sdrNumber('sdrDailyLimit', 50),
      human_pause_seconds: _sdrNumber('sdrHumanPauseSeconds', 300)
    },
    bot_ignore_saved_contacts: !!((document.getElementById('sdrIgnoreSavedContacts') || {}).checked)
  };

  try {
    if (btn) { btn.disabled = true; btn.textContent = 'SALVANDO...'; }
    if (statusEl) { statusEl.textContent = 'Salvando...'; statusEl.style.color = 'var(--fl-text-muted)'; }
    var r = await authFetch('/api/users/sdr-config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var data = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(data.detail || 'Falha ao salvar SDR');
    if (statusEl) { statusEl.textContent = 'Controle do SDR salvo.'; statusEl.style.color = '#10b981'; }
    if (typeof Toast !== 'undefined') Toast.success('Controle do SDR salvo.');
    carregarSdrConfig();
  } catch(e) {
    if (statusEl) { statusEl.textContent = e.message; statusEl.style.color = '#ef4444'; }
    if (typeof Toast !== 'undefined') Toast.error(e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'SALVAR CONTROLE DO SDR'; }
  }
}

async function buscarCEP() {
  var cep = document.getElementById('perfilCEP').value.replace(/\D/g, '');

  if (cep.length !== 8) return;

  try {
    var response = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
    var data = await response.json();

    if (data.erro) {
      mostrarToast('❌ CEP não encontrado');
      return;
    }

    document.getElementById('perfilRua').value = data.logradouro || '';
    document.getElementById('perfilBairro').value = data.bairro || '';
    document.getElementById('perfilCidade').value = data.localidade || '';
    document.getElementById('perfilEstado').value = data.uf || '';

    mostrarToast('✅ Endereço preenchido automaticamente');
  } catch (e) {
    console.error('[ViaCEP] Erro:', e);
    mostrarToast('⚠️ Erro ao buscar CEP');
  }
}

function _preencherPerfilCampos(perfil) {
  perfil = perfil || {};

    'perfilEmail': perfil.email || '',
    'perfilNome': perfil.nome || '',
    'perfilTelefone': perfil.telefone || '',
    'perfilNicho': perfil.nicho || '',

    'perfilCEP': perfil.cep || '',
    'perfilRua': perfil.rua || '',
    'perfilBairro': perfil.bairro || '',
    'perfilCidade': perfil.cidade || '',
    'perfilEstado': perfil.estado || ''
  };
  Object.keys(campos).forEach(function(id) {

    if (el && !el.value) el.value = campos[id];
  });

function _lockOnboarding(message) {
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.style.display = 'none';
  if (!window._fralibMostrarViewOriginal) {
    window._fralibMostrarViewOriginal = window.mostrarView || mostrarView;
  }
  window._fralibMostrarViewOriginal('perfil');
  window.mostrarView = function(view) {
    if (view !== 'perfil') {
      _setOnboardingBanner(message);
      return;
    }
    window._fralibMostrarViewOriginal(view);
  };
  _setOnboardingBanner(message);
}

function _unlockOnboarding() {
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.style.display = '';
  if (window._fralibMostrarViewOriginal) {
    window.mostrarView = window._fralibMostrarViewOriginal;
    delete window._fralibMostrarViewOriginal;
  }
  _removeOnboardingBanner();
}

function _atualizarPainelWhatsApp(status) {
  status = status || {};
  var hint = document.getElementById('whats-plan-hint');
  var sdrPlanStatus = document.getElementById('sdrPlanStatus');
  var btnConnect = document.getElementById('btn-whats-connect');
  var btnDisconnect = document.getElementById('btn-whats-disconnect');
  var allowed = !!status.whatsapp_allowed;
  var required = !!status.whatsapp_required;
  var connected = !!(status.wpp_ok || status.whatsapp_ok);
  var plano = (status.plano || '').toLowerCase();

  if (sdrPlanStatus) {
    sdrPlanStatus.textContent = _sdrPlanLabelFromStatus(status);
    sdrPlanStatus.style.color = allowed ? '#10b981' : '#f59e0b';
    sdrPlanStatus.style.borderColor = allowed ? 'rgba(16,185,129,.45)' : 'rgba(245,158,11,.45)';
  }

  if (btnConnect) {
    btnConnect.disabled = !allowed;
    btnConnect.style.opacity = allowed ? '1' : '.45';
    btnConnect.style.cursor = allowed ? 'pointer' : 'not-allowed';
    btnConnect.title = allowed ? 'Conectar WhatsApp deste tenant' : 'WhatsApp/SDR nao esta incluso neste plano';
  }
  if (btnDisconnect) {
    btnDisconnect.disabled = false;
    btnDisconnect.style.opacity = '1';
  }
  if (!hint) return;
  if (!allowed) {
    hint.innerHTML = '<strong style="color:#f59e0b;">SDR bloqueado neste plano.</strong> Starter gera sites, mas nao envia WhatsApp automatico. Faca upgrade para Pro para ativar SDR.';
  } else if (connected) {
    hint.innerHTML = '<strong style="color:#10b981;">WhatsApp conectado.</strong> O SDR pode vender os sites gerados para os leads aprovados.';
  } else if (plano === 'trial') {
    hint.innerHTML = '<strong style="color:#f59e0b;">Trial com experiencia completa.</strong> Conecte o WhatsApp para gerar o site e enviar a oferta ao lead final.';
  } else if (required) {
    hint.innerHTML = '<strong style="color:#f59e0b;">WhatsApp obrigatorio.</strong> Conecte para liberar pipeline e SDR neste plano.';
  } else {
    hint.textContent = status.sdr_message || 'WhatsApp opcional neste plano.';
  }
}

async function verificarOnboarding() {
  try {
    var r = await AuthHelper.authFetch('/api/users/onboarding-status?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    var status = await r.json();
    await _carregarPerfilNoFormulario();
    _atualizarPainelWhatsApp(status);

    if (!status.perfil_ok) {
      _lockOnboarding('Complete seu perfil: nome, telefone e nicho sao obrigatorios para continuar.');
      return;
    }
    if (status.whatsapp_required && !status.wpp_ok) {
      _lockOnboarding('Conecte o WhatsApp para liberar a experiencia completa do SDR.');
      return;
    }
    _unlockOnboarding();
  } catch (e) {
    console.error('[Onboarding] Erro:', e);
  }
}

async function salvarPerfil() {
  var nome = (document.getElementById('perfilNome') || {}).value || '';
  var telefone = (document.getElementById('perfilTelefone') || {}).value || '';
  var rua = (document.getElementById('perfilRua') || {}).value || '';
  var bairro = (document.getElementById('perfilBairro') || {}).value || '';
  var cidade = (document.getElementById('perfilCidade') || {}).value || '';
  var estado = (document.getElementById('perfilEstado') || {}).value || '';
  var cep = (document.getElementById('perfilCEP') || {}).value || '';
  var nicho = (document.getElementById('perfilNicho') || {}).value || '';
  var origem = (document.getElementById('perfilOrigem') || {}).value || '';

  if (!nome || !telefone || !nicho) {
    mostrarToast('⚠️ Preencha Nome, Telefone e Nicho');
    return;
  }

  var endereco = [rua, bairro, cidade, estado, cep].filter(Boolean).join(', ');

  try {
    var response = await authFetch('/api/users/profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome: nome, telefone: telefone, endereco: endereco, nicho: nicho, origem: origem, cep: cep, rua: rua, bairro: bairro, cidade: cidade, estado: estado })
    });

      localStorage.setItem('perfil_nome', nome);
      Toast.success('Perfil salvo com sucesso!');
      try { verificarOnboarding(); } catch(_) {}
    } else {
      var err = await response.json().catch(function(){ return {}; });
      Toast.error(err.detail || 'Erro ao salvar perfil');
    }
  } catch (e) {
    console.error('[Perfil] Erro:', e);
    Toast.error('Erro ao salvar perfil: ' + e.message);
  }
}

async function alterarSenhaPerfil() {
  var atual = (document.getElementById('perfilSenhaAtual') || {}).value || '';
  var nova = (document.getElementById('perfilSenhaNova') || {}).value || '';
  var confirmar = (document.getElementById('perfilSenhaConfirmar') || {}).value || '';
  var statusEl = document.getElementById('perfilSenhaStatus');
  var btn = document.getElementById('btn-senha-save');

  if (statusEl) statusEl.textContent = '';
  if (!atual || !nova || !confirmar) {
    if (statusEl) { statusEl.textContent = 'Preencha os tres campos.'; statusEl.style.color = '#f59e0b'; }
    return;
  }
  if (nova !== confirmar) {
    if (statusEl) { statusEl.textContent = 'A confirmacao nao confere.'; statusEl.style.color = '#ef4444'; }
    return;
  }
  if (nova.length < 12 || !/[A-Za-z]/.test(nova) || !/\d/.test(nova)) {
    if (statusEl) { statusEl.textContent = 'Use 12 caracteres com letras e numeros.'; statusEl.style.color = '#f59e0b'; }
    return;
  }
  if (new TextEncoder().encode(nova).length > 72) {
    if (statusEl) { statusEl.textContent = 'Use uma senha com ate 72 bytes.'; statusEl.style.color = '#f59e0b'; }
    return;
  }

  try {
    if (btn) { btn.disabled = true; btn.textContent = 'SALVANDO...'; }
    var response = await authFetch('/api/users/password', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current_password: atual, new_password: nova })
    });
    var data = await response.json().catch(function(){ return {}; });
    if (!response.ok) {
      if (statusEl) { statusEl.textContent = data.detail || 'Nao foi possivel alterar.'; statusEl.style.color = '#ef4444'; }
      return;
    }
    ['perfilSenhaAtual','perfilSenhaNova','perfilSenhaConfirmar'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    if (statusEl) { statusEl.textContent = 'Senha alterada com sucesso.'; statusEl.style.color = '#10b981'; }
    Toast.success('Senha alterada com sucesso!');
  } catch(e) {
    if (statusEl) { statusEl.textContent = 'Erro ao alterar senha.'; statusEl.style.color = '#ef4444'; }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'ALTERAR SENHA'; }
  }
}

// LOGS EM TEMPO REAL VIA SSE (Server-Sent Events)
// ═══════════════════════════════════════════════════════════════════
(function() {
  let eventSource = null;
  const maxLogs = 40;

  function getContainer() {
    return document.getElementById('magic-logs-content');
  }

  async function conectarSSE() {
    if (eventSource) eventSource.close();

    if (window.__fralibAuthExpired) return;
    var ticketResponse = await authFetch('/api/logs/stream-token', { method: 'POST' });
    if (!ticketResponse.ok) throw new Error('Falha ao emitir ticket SSE');
    var ticketData = await ticketResponse.json();
    if (!ticketData.stream_token) throw new Error('Ticket SSE ausente');
    eventSource = new EventSource('/api/logs/stream?ticket=' + encodeURIComponent(ticketData.stream_token));

    eventSource.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data);
        // normalizar: suporta tanto 'tipo' quanto 'evento'
        if (!data.evento && data.tipo) data.evento = data.tipo.toUpperCase();
        if (!data.evento) data.evento = 'INFO';
        adicionarLog(data);
        if(window._pixelOfficeSSEHook) window._pixelOfficeSSEHook(data);
      } catch (e) {
        console.error('[SSE] Erro ao parsear log:', e);
      }
    };

    eventSource.onopen = function() {
      var dot = document.getElementById('sse-dot');
      if (dot) dot.style.background = '#10b981';
      adicionarLog({ evento: 'INFO', mensagem: 'Linha do tempo conectada. Aguardando pipeline...', ts: new Date().toLocaleTimeString('pt-BR') });
    };

    eventSource.onerror = function(err) {
      console.error('[SSE] Erro na conexão:', err);
      var dot = document.getElementById('sse-dot');
      if (dot) dot.style.background = '#ef4444';
      eventSource.close();
      if (window.__fralibAuthExpired) return;
      setTimeout(function(){ conectarSSE().catch(function(e){ console.error('[SSE] Reconexão falhou:', e); }); }, 5000);
    };
  }

  function _mostrarModalRateLimit(msg) {
  const old = document.getElementById('modal-rate-limit');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = 'modal-rate-limit';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:99999;';
  modal.innerHTML = `
    <div style="background:#1a1a2e;border:1px solid #333;border-radius:16px;padding:32px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
      <div style="font-size:48px;margin-bottom:16px;">⏳</div>
      <h2 style="margin:0 0 12px;font-size:20px;color:#f0f0f5;">Limite de Uso Atingido</h2>
      <p style="color:#9ca3af;font-size:15px;line-height:1.5;margin:0 0 20px;">${msg || 'O sistema esta temporariamente indisponivel. Seus leads estao salvos e serao processados automaticamente quando o limite resetar.'}</p>
      <button onclick="document.getElementById('modal-rate-limit').remove()" style="background:#6366f1;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Entendi</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function adicionarLog(data) {
    if (data && typeof data.mensagem === 'string' && data.mensagem.trim().charAt(0) === '{') {
      try {
        var payloadPipeline = JSON.parse(data.mensagem);
        if (payloadPipeline && payloadPipeline.type) {
          data = Object.assign({}, data, payloadPipeline);
          data.tipo = payloadPipeline.type;
          data.mensagem = payloadPipeline.message || payloadPipeline.title || data.mensagem;
        }
      } catch (e) {}
    }

    // Rate limit — mostrar modal proeminente
    if (data.evento === 'RATE_LIMIT' || data.tipo === 'rate_limit') {
      _mostrarModalRateLimit(data.mensagem);
    }

    if (data.tipo === 'pipeline_retry') {
      var retryMsg = data.mensagem || 'Uma nova tentativa foi agendada automaticamente.';
      if (typeof Toast !== 'undefined') Toast.warning(retryMsg);
      var banner = document.getElementById('pipeline-banner');
      var bannerFase = document.getElementById('pipeline-banner-fase');
      if (banner) banner.style.display = 'flex';
      if (bannerFase) bannerFase.textContent = retryMsg;
    }

    // Pipeline error — toast + fechar overlay
    if (data.tipo === 'pipeline_error' || data.evento === 'PIPELINE_ERROR') {
      var tituloErro = data.title || data.titulo || 'Pipeline interrompido';
      var msg = data.message || data.mensagem || 'Pipeline falhou';
      if (typeof Toast !== 'undefined') Toast.error(msg);
      pararCronometroPipelineAdmin();
      mostrarErrosPipelineAdmin(tituloErro, msg, 'Tente novamente, busque novos leads ou entre em contato com o suporte.');
      var overlay = document.getElementById('pipeline-overlay') || document.querySelector('.pipeline-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    const logsContainer = getContainer();
    if (!logsContainer) return;
    var placeholder = logsContainer.querySelector('[data-placeholder]');
    if (placeholder) placeholder.remove();

    const logDiv = document.createElement('div');
    const ts = data.ts || new Date().toLocaleTimeString('pt-BR');

    const cores = {
      'ERROR':           'border-left:3px solid #ef4444;background:rgba(239,68,68,0.08);',
      'SUCCESS':         'border-left:3px solid #10b981;background:rgba(16,185,129,0.08);',
      'WARNING':         'border-left:3px solid #f59e0b;background:rgba(245,158,11,0.08);',
      'INFO':            'border-left:3px solid #9333ea;background:rgba(147,51,234,0.08);',
      'LEADS':           'border-left:3px solid #06b6d4;background:rgba(6,182,212,0.08);',
      'CAIO':            'border-left:3px solid #a855f7;background:rgba(168,85,247,0.08);',
      'PIPELINE_STATUS': 'border-left:3px solid #374151;background:rgba(255,255,255,0.03);'
    };

    const icones = {
      'ERROR': '✗', 'SUCCESS': '✓', 'WARNING': '!',
      'INFO': '·', 'LEADS': '◎', 'CAIO': '◈', 'PIPELINE_STATUS': '⚙'
    };

    const coresIcone = {
      'ERROR': '#ef4444', 'SUCCESS': '#10b981', 'WARNING': '#f59e0b',
      'INFO': '#c084fc', 'LEADS': '#06b6d4', 'CAIO': '#a855f7', 'PIPELINE_STATUS': '#6b7280'
    };

    const cor = cores[data.evento] || 'border-left:3px solid #374151;background:rgba(255,255,255,0.02);';
    const icone = icones[data.evento] || '·';
    const corIcone = coresIcone[data.evento] || '#9ca3af';

    logDiv.style.cssText = 'padding:6px 10px;border-radius:4px;line-height:1.5;margin-bottom:2px;' + cor;
    logDiv.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">' +
        '<span style="color:' + corIcone + ';font-weight:700;flex-shrink:0;width:12px;">' + icone + '</span>' +
        '<span style="flex:1;color:#e5e7eb;word-break:break-word;">' + escapeHtml(data.mensagem) + '</span>' +
        '<span style="color:#6b7280;font-size:10px;white-space:nowrap;flex-shrink:0;">' + ts + '</span>' +
      '</div>';

    logsContainer.insertBefore(logDiv, logsContainer.firstChild);
    logsContainer.scrollTop = 0;

    while (logsContainer.children.length > maxLogs) {
      logsContainer.removeChild(logsContainer.lastChild);
    }
  }

  conectarSSE().catch(function(e){ console.error('[SSE] Conexão inicial falhou:', e); });

  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && (!eventSource || eventSource.readyState === 2)) {
      conectarSSE().catch(function(e){ console.error('[SSE] Reconexão por visibilidade falhou:', e); });
    }
  });
})();

async function sincronizarMercadoPago(params) {
  var body = {
    payment_id: params.get('payment_id') || params.get('collection_id') || '',
    collection_id: params.get('collection_id') || '',
    preapproval_id: params.get('preapproval_id') || params.get('preapproval') || '',
    preference_id: params.get('preference_id') || '',
    status: params.get('status') || params.get('collection_status') || ''
  };
  var response = await authFetch('/api/credits/sync-mercadopago', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  var data = await response.json().catch(function(){ return {}; });
  if (!response.ok) throw new Error(data.detail || 'Falha ao sincronizar pagamento');
  return data;
}

async function atualizarPagamentoMercadoPago() {
  var params = getMercadoPagoReturnParams();
  try {
    if (params) await sincronizarMercadoPago(params);
    var balance = await carregarCreditos();
    mostrarAvisoPagamento('success', 'Saldo atualizado', 'Pagamento consultado. Seu saldo/plano foi atualizado com os dados mais recentes.');
    if (balance && Number(balance.creditos_disponiveis || 0) > 0) limparCheckoutPendente();
  } catch(e) {
    mostrarAvisoPagamento('warning', 'Pagamento em confirmação', 'O Mercado Pago recebeu sua tentativa, mas ainda não enviou a confirmação para o FraLib. Aguarde alguns instantes e clique em Atualizar saldo.');
  }
}

async function verificarRetornoMercadoPago() {
  var params = getMercadoPagoReturnParams();
  var pending = null;
  try { pending = JSON.parse(localStorage.getItem('fralib_mp_pending') || 'null'); } catch(e) {}
  if (!params && !pending) return;
  if (!params && pending && Date.now() - Number(pending.started_at || 0) > 60 * 60 * 1000) {
    limparCheckoutPendente();
    return;
  }
  mostrarAvisoPagamento('warning', 'Pagamento em processamento', 'Se você já pagou no Mercado Pago, o FraLib vai conferir o status agora. PIX pode levar alguns instantes para voltar ao sistema.');
  if (params) {
    try {
      var sync = await sincronizarMercadoPago(params);
      await carregarCreditos();
      if (sync.status === 'ok') {
        limparCheckoutPendente();
        mostrarAvisoPagamento('success', 'Pagamento confirmado', 'Créditos ou plano aplicados. Você já pode continuar usando o FraLib.');
      } else {
        mostrarAvisoPagamento('warning', 'Pagamento pendente', 'O Mercado Pago ainda não marcou essa cobrança como aprovada. Clique em Atualizar saldo em alguns instantes.');
      }
    } catch(e) {
      mostrarAvisoPagamento('warning', 'Confirmação pendente', 'Não consegui confirmar automaticamente. Clique em Atualizar saldo ou confira se o webhook está salvo no painel do Mercado Pago.');
    }
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }
}

async function comprarRecarga(valor) {
  var amount = Number(valor || 0);
  if (!amount || amount < 5) {
    mostrarToast ? mostrarToast('Informe uma recarga mínima de R$ 5.') : alert('Informe uma recarga mínima de R$ 5.');
    return;
  }
  try {
    const response = await authFetch('/api/credits/criar-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ valor: amount })
    });
    const data = await response.json();
    if (!response.ok || !data.checkout_url) throw new Error(data.detail || 'Checkout indisponível');
    registrarCheckoutPendente({ tipo: 'recarga', valor: data.valor || amount, creditos: data.creditos || null });
    window.location.href = data.checkout_url;
  } catch (e) {
    console.error('Erro checkout recarga:', e);
    mostrarToast ? mostrarToast('Falha ao abrir Mercado Pago: ' + e.message) : alert('Falha ao abrir Mercado Pago: ' + e.message);
  }
}

async function confirmarVenda() {
  if (!leadAtualModal) return;
  var valor = parseFloat((document.getElementById('fv-valor') || {}).value) || 0;
  if (!valor || valor <= 0) { Toast.warning('Informe o valor da venda.'); return; }
  var pagamento = (document.getElementById('fv-pagamento') || {}).value || 'pix';
  var obs = (document.getElementById('fv-obs') || {}).value || '';
  try {
    await authFetch('/api/leads/' + leadAtualModal.id, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        valor_venda: valor,
        observacoes: obs + (obs ? ' | ' : '') + 'Pagamento: ' + pagamento,
        status: 'won'

/* ── PR4: Pipeline falhas (job_queue → pipeline_failures) ──────── */
function _formatarTempoRelativo(iso) {
  if (!iso) return '—';
  try {
    var d = new Date(iso);
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'agora';
    if (diff < 3600) return Math.floor(diff/60) + 'min atras';
    if (diff < 86400) return Math.floor(diff/3600) + 'h atras';
    return Math.floor(diff/86400) + 'd atras';
  } catch(e) { return '—'; }
}

async function carregarPipelineFalhas() {
  var tbody = document.getElementById('utiPipelineBody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="6"><div class="uti-empty">CARREGANDO...</div></td></tr>';
  try {
    var data = await authFetch('/api/falhas?apenas_pendentes=true&limit=100').then(function(r){ return r.json(); });
    var falhas = data.falhas || [];
    var badge = document.getElementById('badge-pipeline');
    if (badge) badge.textContent = falhas.length;
    if (!falhas.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="uti-empty">&#9989; Nenhum pipeline travado!</div></td></tr>';
      return;
    }
    tbody.innerHTML = falhas.map(function(f) {
      var nome = escapeHtml(f.lead_nome || '—');
      var fase = escapeHtml((f.fase || 'desconhecido').toUpperCase());
      var msg  = escapeHtml(f.mensagem || 'Erro desconhecido');
      var tent = parseInt(f.tentativas, 10) || 0;
      var quando = _formatarTempoRelativo(f.criado_em);

        '<td><button class="btn-requalificar" id="btn-retry-' + fid + '" onclick="retryPipelineFalha(' + fid + ', this)">&#8635; TENTAR DE NOVO</button></td>' +

async function retryPipelineFalha(falhaId, btn) {
  var fid = parseInt(falhaId, 10);
  if (!fid) return;
  if (btn) { btn.disabled = true; btn.textContent = 'ENFILEIRANDO...'; btn.style.opacity = '0.6'; }
  try {
    var res = await authFetch('/api/falhas/' + fid + '/retry', { method: 'POST' }).then(function(r){ return r.json(); });
    if (res && res.ok) {
      var row = document.getElementById('falha-row-' + fid);
      if (row) row.style.opacity = '0.4';
      if (btn) { btn.textContent = res.ja_enfileirado ? 'JA NA FILA' : '✓ NA FILA'; }
      setTimeout(carregarPipelineFalhas, 1500);
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '⟳ TENTAR DE NOVO'; btn.style.opacity = '1'; }
      alert('Erro: ' + (res && res.detail ? res.detail : 'tente novamente'));
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '⟳ TENTAR DE NOVO'; btn.style.opacity = '1'; }
    alert('Erro: ' + e.message);
  }
}

      card.style.right = '';
      card.style.bottom = '';
      spotlightEl.style.display = 'none';
      return;
    }

    var el = document.querySelector(alvo);
    if (!el) {
      card.style.top = '50%';
      card.style.left = '50%';
      card.style.transform = 'translate(-50%,-50%)';
      spotlightEl.style.display = 'none';
      return;
    }
    try { el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }); } catch(e) {}

    var rect = el.getBoundingClientRect();
    var pad = 8;

    // Spotlight
    spotlightEl.style.display = 'block';
    spotlightEl.style.top    = (rect.top - pad) + 'px';
    spotlightEl.style.left   = (rect.left - pad) + 'px';
    spotlightEl.style.width  = (rect.width + pad * 2) + 'px';
    spotlightEl.style.height = (rect.height + pad * 2) + 'px';

    // Posicionar card
    card.style.transform = '';
    var gap = 16;
    if (posicao === 'right') {
      card.style.top  = Math.max(16, rect.top) + 'px';
      card.style.left = (rect.right + gap) + 'px';
      card.style.right = '';
      card.style.bottom = '';
    } else if (posicao === 'bottom') {
      card.style.top  = (rect.bottom + gap) + 'px';
      card.style.left = Math.max(16, rect.left) + 'px';
      card.style.right = '';
      card.style.bottom = '';
    } else if (posicao === 'left') {
      card.style.top  = Math.max(16, rect.top) + 'px';
      card.style.right = (window.innerWidth - rect.left + gap) + 'px';
      card.style.left = '';
      card.style.bottom = '';
    }

    // Garantir que o card não saia da tela
    setTimeout(function() {
      var cr = card.getBoundingClientRect();
      if (cr.right > window.innerWidth - 16) {
        card.style.left = '';
        card.style.right = '16px';
      }
      if (cr.bottom > window.innerHeight - 16) {
        card.style.top = '';
        card.style.bottom = '16px';
      }
    }, 10);
  }

  function renderPasso(idx) {
    var passo = PASSOS[idx];
    var total = PASSOS.length;
    if (passo.view && typeof mostrarView === 'function') {
      mostrarView(passo.view);
    }

    // Dots de progresso
    var dots = '';
    for (var i = 0; i < total; i++) {
      dots += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;background:' +
        (i === idx ? '#9333ea' : 'rgba(147,51,234,0.25)') + ';transition:background 0.2s;"></span>';
    }

    card.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
        '<span style="font-family:&quot;Press Start 2P&quot;,monospace;font-size:7px;color:#c084fc;letter-spacing:1px;">TOUR ' + (idx+1) + '/' + total + '</span>' +
        '<button id="fl-tour-skip" style="background:none;border:none;color:#5a5a70;font-size:11px;cursor:pointer;padding:2px 6px;font-family:&quot;DM Sans&quot;,sans-serif;">Pular tour</button>' +
      '</div>' +
      '<div style="font-size:14px;font-weight:600;color:#f0f0f5;margin-bottom:10px;">' + passo.titulo + '</div>' +
      '<div style="font-size:13px;color:#8888a0;line-height:1.6;margin-bottom:20px;">' + passo.texto + '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;">' +
        '<div>' + dots + '</div>' +
        '<div style="display:flex;gap:10px;">' +
          (idx > 0 ? '<button id="fl-tour-prev" style="background:transparent;border:1px solid rgba(147,51,234,0.3);color:#8888a0;padding:8px 16px;cursor:pointer;font-size:12px;font-family:&quot;DM Sans&quot;,sans-serif;">← Anterior</button>' : '') +
          '<button id="fl-tour-next" style="background:#9333ea;border:2px solid #7c22d4;color:#fff;padding:8px 20px;cursor:pointer;font-size:12px;font-family:&quot;Press Start 2P&quot;,monospace;font-size:8px;letter-spacing:1px;box-shadow:3px 3px 0 #0e0718;">' +
            (idx === total - 1 ? 'CONCLUIR' : 'PRÓXIMO →') +
          '</button>' +
        '</div>' +
      '</div>';

    setTimeout(function() {
      posicionarCard(passo.alvo, passo.posicao);
    }, passo.view ? 90 : 0);

    // Eventos
    var btnNext = document.getElementById('fl-tour-next');
    var btnPrev = document.getElementById('fl-tour-prev');
    var btnSkip = document.getElementById('fl-tour-skip');

    if (btnNext) btnNext.addEventListener('click', function() {
      if (passoAtual === PASSOS.length - 1) {
        encerrarTour();
      } else {
        passoAtual++;
        renderPasso(passoAtual);
      }
    });

    if (btnPrev) btnPrev.addEventListener('click', function() {
      if (passoAtual > 0) {
        passoAtual--;
        renderPasso(passoAtual);
      }
    });

    if (btnSkip) btnSkip.addEventListener('click', encerrarTour);
  }

  function encerrarTour() {
    localStorage.setItem(TOUR_KEY, '1');
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    if (card && card.parentNode) card.parentNode.removeChild(card);
    if (spotlightEl && spotlightEl.parentNode) spotlightEl.parentNode.removeChild(spotlightEl);
  }

  function iniciarTour(force) {
    if (!force && localStorage.getItem(TOUR_KEY)) return; // já fez o tour
    passoAtual = 0;
    criarTour();
    renderPasso(0);
  }

  // ── LINHA DO TEMPO DA PIPELINE ─────────────────────────────────────
  var PIPELINE_TIMELINE = [
    { key:'hunter', label:'Hunter', fase:1 },
    { key:'caio', label:'Caio', fase:2 },
    { key:'jina', label:'Jina', fase:3 },
    { key:'market_intelligence', label:'Mercado', fase:4 },
    { key:'media', label:'Midia', fase:5 },
    { key:'prompt_agent', label:'Prompt', fase:6 },
    { key:'designer', label:'Design', fase:8 },
    { key:'builder_renderer', label:'Builder', fase:9 },
    { key:'deploy', label:'Deploy', fase:10 },
    { key:'franz', label:'Franz', fase:11 }
  ];
  function etapaTimelinePorFase(fase) {
    var n = Number(fase || 0);
    for (var i = 0; i < PIPELINE_TIMELINE.length; i++) {
      if (PIPELINE_TIMELINE[i].fase === n) return PIPELINE_TIMELINE[i].key;
    }
    return null;
  }
  function normalizarEtapaTimeline(value) {
    var v = (value || '').toString().toLowerCase();
    if (!v) return null;
    if (v.includes('builder') || v.includes('renderer')) return 'builder_renderer';
    if (v.includes('deploy') || v.includes('public')) return 'deploy';
    if (v.includes('franz') || v.includes('bryan') || v.includes('whatsapp')) return 'franz';
    if (v.includes('arquiteto') || v.includes('designer') || v.includes('design')) return 'designer';
    if (v.includes('prompt') || v.includes('agente_nicho') || v.includes('nicho')) return 'prompt_agent';
    if (v.includes('unsplash') || v.includes('foto') || v.includes('midia') || v.includes('mídia')) return 'media';
    if (v.includes('mercado') || v.includes('market')) return 'market_intelligence';
    if (v.includes('jina') || v.includes('keyword')) return 'jina';
    if (v.includes('caio') || v.includes('qualifica')) return 'caio';
    if (v.includes('hunter') || v.includes('lead:') || v.includes('maps')) return 'hunter';
    return null;
  }
  function etapaTimelinePorMensagem(msg) {
    msg = (msg || '').toLowerCase();
    return normalizarEtapaTimeline(msg);
  }
  function renderPipelineTimeline(ativo, status) {
    var el = document.getElementById('pipelineTimeline');
    if (!el) return;
    var statusEl = document.getElementById('pipelineTimelineStatus');
    if (statusEl) statusEl.textContent = status || (ativo ? 'em andamento' : 'aguardando');
    var activeIndex = PIPELINE_TIMELINE.findIndex(function(p){ return p.key === ativo; });
    el.innerHTML = PIPELINE_TIMELINE.map(function(p, idx) {
      var done = activeIndex >= 0 && idx < activeIndex;
      var active = activeIndex === idx;
      var color = active ? '#a855f7' : (done ? '#10b981' : 'rgba(148,163,184,.35)');
      var bg = active ? 'rgba(168,85,247,.18)' : (done ? 'rgba(16,185,129,.12)' : 'rgba(15,23,42,.55)');
      var pulse = active ? 'box-shadow:0 0 0 4px rgba(168,85,247,.14),0 0 18px rgba(168,85,247,.35);transform:translateX(4px);' : '';
      var detail = active ? (status || 'robo trabalhando nesta etapa') : (done ? 'concluido' : 'aguardando sua vez');
      return '<div style="position:relative;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;border:1px solid ' + color + ';background:' + bg + ';border-radius:8px;padding:9px 10px;min-height:48px;transition:all .25s ease;' + pulse + '">'
        + '<div style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:' + color + ';color:#080814;font-family:var(--fl-font-brand);font-size:8px;">' + (done ? '&#10003;' : (idx + 1)) + '</div>'
        + '<div><div style="font-family:var(--fl-font-brand);font-size:9px;color:' + color + ';letter-spacing:1px;">' + p.label.toUpperCase() + '</div>'
        + '<div style="font-size:11px;color:var(--fl-text-muted);margin-top:5px;">' + detail + '</div></div>'
        + '</div>';
    }).join('');
  }
  document.addEventListener('DOMContentLoaded', function(){ renderPipelineTimeline(null); });

  function atualizarTimelineComStatus(d) {
    d = d || {};
    var job = d.current_job || {};
    var fase = normalizarEtapaTimeline(job.last_phase || d.fase_atual || '');
    if (!fase) fase = etapaTimelinePorFase(job.phase_num || d.fase_num);
    var label = d.fase_label || job.phase_label || job.last_phase || (d.rodando ? 'Pipeline em andamento' : '');
    if (d.rodando || fase) {
      renderPipelineTimeline(fase, label);
      var bannerFase = document.getElementById('pipeline-banner-fase');
      if (bannerFase && label) bannerFase.textContent = label;
    } else {
      renderPipelineTimeline(null);
    }
  }

  // ── BANNER DE PIPELINE RODANDO ─────────────────────────────────────
  (function() {
    var banner = document.getElementById('pipeline-banner');
    var bannerFase = document.getElementById('pipeline-banner-fase');
    if (!banner) return;

    // Verificar status do pipeline a cada 5s
    function checkPipelineStatus() {
      authFetch('/api/pipeline/status').then(function(r) { return r.json(); }).then(function(d) {
        if (d && d.rodando) {
          banner.style.display = 'flex';
          iniciarCronometroPipelineAdmin();
          atualizarTimelineComStatus(d);
        } else {
          banner.style.display = 'none';
          pararCronometroPipelineAdmin();
          atualizarTimelineComStatus(d);
        }
      }).catch(function(){});
    }
    checkPipelineStatus();
    setInterval(checkPipelineStatus, 5000);

    // Interceptar SSE para atualizar fase no banner
    var _origHook = window._pixelOfficeSSEHook;
    window._pixelOfficeSSEHook = function(data) {
      if (_origHook) _origHook(data);
      var msg = data.mensagem || '';
      if (msg && (msg.includes('[hunter]') || msg.includes('[caio]') || msg.includes('[producao]') || msg.includes('[produção]'))) {
        setTimeout(carregarLeadSupplyStatus, 400);
      }
      // Mostrar fases relevantes no banner
      if (data && (data.tipo === 'progress' || data.type === 'progress')) {
        var progressKey = normalizarEtapaTimeline(data.phase || '') || etapaTimelinePorFase(data.fase);
        var progressLabel = data.label || data.mensagem || 'Pipeline em andamento';
        if (bannerFase) bannerFase.textContent = progressLabel;
        renderPipelineTimeline(progressKey, progressLabel);
        return;
      }
      if (msg && (msg.includes('FASE') || msg.includes('Pipeline') || msg.includes('Lead:') || msg.includes('Deploy') || msg.includes('concluído'))) {
        if (bannerFase) bannerFase.textContent = msg;
        renderPipelineTimeline(etapaTimelinePorMensagem(msg), msg);
        if (msg.includes('concluído') || msg.includes('concluido')) {
          renderPipelineTimeline('franz', 'ciclo concluido');
          pararCronometroPipelineAdmin();
          setTimeout(function(){ banner.style.display = 'none'; }, 3000);
        }
      }
    };
  })();

  // Expor globalmente para poder chamar manualmente
  window.iniciarTourFraLib = iniciarTour;
  window.encerrarTourFraLib = encerrarTour;

  // Iniciar após o DOM carregar e as views estarem prontas
  document.addEventListener('DOMContentLoaded', function() {
    // Aguardar 2s para não conflitar com verificarOnboarding
    setTimeout(function() {
      // Só mostrar se perfil já estiver ok (não bloquear onboarding de perfil)
      if (!localStorage.getItem(TOUR_KEY)) {
        iniciarTour();
      }
    }, 2000);
  });
})();


</script>
