<style>
:root{
  --fl-bg:#0a0714;--fl-bg-surface:#0d0d12;--fl-bg-card:#12121a;
  --fl-bg-hover:#1c1c28;--fl-bg-overlay:rgba(6,6,8,0.92);
  --fl-purple:#9333ea;--fl-purple-300:#c084fc;--fl-purple-400:#a855f7;
  --fl-purple-800:#2d1060;--fl-purple-900:#1a0a30;--fl-purple-950:#0e0718;
  --fl-border:rgba(147,51,234,0.12);--fl-border-md:rgba(147,51,234,0.25);--fl-border-hi:rgba(147,51,234,0.50);
  --fl-text:#f0f0f5;--fl-text-muted:#8888a0;--fl-text-dim:#5a5a70;
  --fl-font-brand:'Press Start 2P',monospace;--fl-font-ui:'DM Sans',system-ui,sans-serif;--fl-font-mono:'JetBrains Mono',monospace;
  --fl-ease:cubic-bezier(0.22,1,0.36,1);
  --cyan:#00FFB3;--cyan-glow:rgba(0,255,179,0.4);--cyan-dim:rgba(0,255,179,0.12);
  --gold:#FFB800;--gold-glow:rgba(255,184,0,0.35);--gold-dim:rgba(255,184,0,0.15);
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#38bdf8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--fl-font-ui);background:var(--fl-bg);color:var(--fl-text);
  display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:240px;min-height:100vh;
  background:var(--fl-bg-surface);
  border-right:2px solid var(--fl-border);
  display:flex;flex-direction:column;
  padding:20px 0;flex-shrink:0;
  box-shadow:4px 0 0 rgba(0,0,0,0.3);
  z-index:100;
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;
  padding:0 20px 24px;border-bottom:1px solid var(--fl-border);
  margin-bottom:16px;
}
.sidebar-logo img{height:32px;filter:drop-shadow(0 0 8px rgba(147,51,234,0.4))}
.sidebar-logo span{font-family:var(--fl-font-brand);font-size:8px;color:var(--fl-purple-300);letter-spacing:1px}

.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.sidebar-link{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  font-size:13px;font-weight:500;color:var(--fl-text-muted);
  text-decoration:none;transition:all .2s var(--fl-ease);
  border:2px solid transparent;
}
.sidebar-link:hover{color:var(--fl-text);background:var(--fl-bg-hover);border-color:var(--fl-border)}
.sidebar-link.active{
  color:var(--fl-purple-300);background:var(--fl-purple-900);
  border-color:var(--fl-purple);
  box-shadow:3px 3px 0 var(--fl-purple-950);
}
.sidebar-link .icon{width:20px;height:20px;flex-shrink:0}
.sidebar-link .badge-count{
  margin-left:auto;
  font-family:var(--fl-font-brand);font-size:7px;
  padding:3px 8px;background:var(--danger);color:#fff;
}

.sidebar-footer{
  padding:16px 20px;border-top:1px solid var(--fl-border);
  font-size:11px;color:var(--fl-text-dim);
}

/* ============================================================
   MAIN AREA
   ============================================================ */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 32px}

/* Header */
.main-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;gap:16px;flex-wrap:wrap;
}
.main-header h1{
  font-family:var(--fl-font-brand);font-size:clamp(10px,1.5vw,14px);
  background:linear-gradient(135deg,var(--fl-purple-300),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header-user{
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--fl-text-muted);
}
.header-avatar{
  width:32px;height:32px;
  background:var(--fl-purple-900);border:2px solid var(--fl-purple);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fl-font-brand);font-size:10px;color:var(--fl-purple-300);
  box-shadow:2px 2px 0 var(--fl-purple-950);
}

/* Pipeline Controls */
.pipeline-controls{display:flex;gap:8px;align-items:center}
.btn-pipeline{
  padding:8px 14px;font-family:var(--fl-font-brand);font-size:7px;
  cursor:pointer;border:2px solid;letter-spacing:1px;
  transition:all .15s;white-space:nowrap;
}
.btn-pipeline-start{
  background:var(--success);color:#000;border-color:#16803C;
  box-shadow:3px 3px 0 #0D5A28;
}
.btn-pipeline-start:hover{box-shadow:3px 3px 0 #0D5A28,0 0 15px rgba(34,197,94,0.3)}
.btn-pipeline-start:active{transform:translateY(2px);box-shadow:1px 1px 0 #0D5A28}
.btn-pipeline-pause{
  background:var(--warning);color:#000;border-color:#B45309;
  box-shadow:3px 3px 0 #7C2D12;
}
.btn-pipeline-pause:hover{box-shadow:3px 3px 0 #7C2D12,0 0 15px rgba(245,158,11,0.3)}
.btn-pipeline-pause:active{transform:translateY(2px);box-shadow:1px 1px 0 #7C2D12}
.pipeline-status{
  font-family:var(--fl-font-mono);font-size:10px;
  padding:4px 10px;border:1px solid var(--fl-border);
  background:var(--fl-bg-card);
}
.pipeline-status.running{border-color:var(--success);color:var(--success)}
.pipeline-status.paused{border-color:var(--warning);color:var(--warning)}
.pipeline-status.idle{border-color:var(--fl-text-dim);color:var(--fl-text-dim)}

/* ============================================================
   KPI CARDS — 6 cards em 2 linhas de 3
   ============================================================ */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.kpi-card{
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  padding:20px;position:relative;overflow:hidden;
  box-shadow:4px 4px 0 rgba(0,0,0,0.3);
  transition:all .3s var(--fl-ease);
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:6px 6px 0 rgba(0,0,0,0.4)}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
}
.kpi-card:nth-child(1)::before{background:var(--fl-purple)}
.kpi-card:nth-child(2)::before{background:var(--cyan)}
.kpi-card:nth-child(3)::before{background:var(--gold)}
.kpi-card:nth-child(4)::before{background:var(--info)}
.kpi-card:nth-child(5)::before{background:var(--success)}
.kpi-card:nth-child(6)::before{background:var(--warning)}

.kpi-label{font-size:11px;color:var(--fl-text-dim);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:1px}
.kpi-value{font-family:var(--fl-font-brand);font-size:clamp(13px,1.6vw,22px);margin-bottom:4px}
.kpi-card:nth-child(1) .kpi-value{color:var(--fl-purple-300)}
.kpi-card:nth-child(2) .kpi-value{color:var(--cyan)}
.kpi-card:nth-child(3) .kpi-value{color:var(--gold)}
.kpi-card:nth-child(4) .kpi-value{color:var(--info)}
.kpi-card:nth-child(5) .kpi-value{color:var(--success)}
.kpi-card:nth-child(6) .kpi-value{color:var(--warning)}
.kpi-sub{font-size:11px;color:var(--fl-text-dim)}
.kpi-glow{
  position:absolute;top:50%;right:-20px;
  width:100px;height:100px;border-radius:50%;filter:blur(40px);opacity:.3;
}
.kpi-card:nth-child(1) .kpi-glow{background:var(--fl-purple)}
.kpi-card:nth-child(2) .kpi-glow{background:var(--cyan)}
.kpi-card:nth-child(3) .kpi-glow{background:var(--gold)}
.kpi-card:nth-child(4) .kpi-glow{background:var(--info)}
.kpi-card:nth-child(5) .kpi-glow{background:var(--success)}
.kpi-card:nth-child(6) .kpi-glow{background:var(--warning)}

/* ============================================================
   VIEW SECTIONS — alternância de conteúdo
   ============================================================ */
.view-section{display:none}
.view-section.active{display:block}

/* ============================================================
   KANBAN SECTION
   ============================================================ */
.kanban-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.kanban-header h2{
  font-family:var(--fl-font-brand);font-size:10px;
  color:var(--fl-text-muted);letter-spacing:1px;
}
.kanban-scroll{
  overflow-x:auto;
  overflow-y:hidden;
  padding-bottom:8px;
  scrollbar-width:thin;
  scrollbar-color:var(--fl-purple-900) transparent;
  height:calc(100vh - 200px);
  display:flex;
  flex-direction:row;
}
.kanban-scroll::-webkit-scrollbar{height:6px}
.kanban-scroll::-webkit-scrollbar-track{background:transparent}
.kanban-scroll::-webkit-scrollbar-thumb{background:var(--fl-purple-900);border-radius:3px}

.kanban-board{
  display:flex;
  flex-direction:row;
  gap:10px;
  min-width:max-content;
  height:100%;
  overflow-y:hidden;
}
.kanban-col{
  background:var(--fl-bg-surface);
  border:2px solid var(--fl-border);
  width:220px;
  min-width:220px;
  max-width:220px;
  display:flex;
  flex-direction:column;
  box-shadow:4px 4px 0 rgba(0,0,0,0.2);
  height:100%;
  overflow:hidden;
}
.kanban-col-header{
  padding:12px 14px;
  border-bottom:2px solid var(--fl-border);
  display:flex;align-items:center;justify-content:space-between;
}
.kanban-col-title{
  font-family:var(--fl-font-brand);
  font-size:9px;
  letter-spacing:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.kanban-col-count{
  font-family:var(--fl-font-mono);font-size:11px;
  padding:2px 8px;background:rgba(255,255,255,0.05);
}

/* Column color coding */
.col-fila .kanban-col-header{border-bottom-color:#60a5fa}
.col-fila .kanban-col-title{color:#60a5fa}
.col-intro .kanban-col-header{border-bottom-color:var(--cyan)}
.col-intro .kanban-col-title{color:var(--cyan)}
.col-followup1 .kanban-col-header{border-bottom-color:var(--fl-text-dim)}
.col-followup1 .kanban-col-title{color:var(--fl-text-dim)}
.col-followup2 .kanban-col-header{border-bottom-color:var(--warning)}
.col-followup2 .kanban-col-title{color:var(--warning)}
.col-qualificados .kanban-col-header{border-bottom-color:var(--info)}
.col-qualificados .kanban-col-title{color:var(--info)}
.col-negociacao .kanban-col-header{border-bottom-color:var(--fl-purple)}
.col-negociacao .kanban-col-title{color:var(--fl-purple-300)}
.col-perdidos .kanban-col-header{border-bottom-color:var(--danger)}
.col-perdidos .kanban-col-title{color:var(--danger)}
.col-ganhos .kanban-col-header{border-bottom-color:var(--success)}
.col-ganhos .kanban-col-title{color:var(--success)}

.kanban-col-body{
  flex:1;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:var(--fl-border) transparent;
}
.kanban-col-body::-webkit-scrollbar{width:3px}
.kanban-col-body::-webkit-scrollbar-thumb{background:var(--fl-border);border-radius:3px}
.kanban-col-body.drag-over{background:rgba(147,51,234,0.06);border:2px dashed var(--fl-purple-400)}

/* Lead Card */
.lead-card{
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  padding:14px;cursor:pointer;
  box-shadow:3px 3px 0 rgba(0,0,0,0.3);
  transition:all .2s var(--fl-ease);
  role:button;
  tabindex:0;
}
.lead-card:hover{
  border-color:var(--fl-purple);
  box-shadow:4px 4px 0 rgba(0,0,0,0.4),0 0 15px rgba(147,51,234,0.1);
  cursor:pointer;
}
.lead-card:active{cursor:grabbing}
.lead-card.dragging{opacity:.5;transform:rotate(2deg);cursor:grabbing}

/* ============================================================
   MODAL DO LEAD
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(6,6,8,0.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.open{display:flex}

.modal{
  background:var(--fl-bg-surface);border:2px solid var(--fl-purple);
  width:100%;max-width:720px;max-height:90vh;overflow-y:auto;
  box-shadow:8px 8px 0 rgba(0,0,0,0.5),0 0 80px rgba(147,51,234,0.15);
  animation:modalIn .3s var(--fl-ease);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:2px solid var(--fl-border);
}
.modal-header h3{font-family:var(--fl-font-brand);font-size:10px;color:var(--fl-purple-300);letter-spacing:1px}
.modal-close{
  background:none;border:2px solid var(--fl-border);
  color:var(--fl-text-dim);font-size:16px;
  width:32px;height:32px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  box-shadow:2px 2px 0 rgba(0,0,0,0.2);
}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}

/* Tabs */
.modal-tabs{display:flex;border-bottom:2px solid var(--fl-border)}
.modal-tab{
  flex:1;padding:12px;text-align:center;
  font-family:var(--fl-font-brand);font-size:8px;
  color:var(--fl-text-dim);cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .2s;letter-spacing:1px;
}
.modal-tab:hover{color:var(--fl-text-muted)}
.modal-tab.active{color:var(--fl-purple-300);border-bottom-color:var(--fl-purple);background:rgba(147,51,234,0.05)}

.modal-body{padding:24px}
.tab-content{display:none}
.tab-content.active{display:block}

/* Chat SDR */
.chat-area{
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  height:280px;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:10px;
  margin-bottom:16px;
}
.chat-msg{
  max-width:75%;padding:10px 14px;font-size:13px;line-height:1.5;
  box-shadow:2px 2px 0 rgba(0,0,0,0.2);
}
.chat-msg.sent{
  align-self:flex-end;
  background:var(--fl-purple-900);border:1px solid var(--fl-purple-800);
  color:var(--fl-purple-300);
}
.chat-msg.received{
  align-self:flex-start;
  background:var(--fl-bg-hover);border:1px solid var(--fl-border);
  color:var(--fl-text-muted);
}
.chat-msg .time{font-size:9px;color:var(--fl-text-dim);margin-top:4px;text-align:right}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{
  flex:1;padding:12px;background:var(--fl-bg-card);border:2px solid var(--fl-border);
  color:var(--fl-text);font-family:var(--fl-font-ui);font-size:13px;outline:none;
}
.chat-input-row input:focus{border-color:var(--cyan)}
.chat-send-btn{
  padding:12px 18px;background:var(--success);color:#000;border:none;cursor:pointer;
  font-family:var(--fl-font-brand);font-size:10px;font-weight:700;
  box-shadow:inset -3px -3px 0 #16803C,inset 3px 3px 0 #4ADE80,0 4px 0 #0D5A28;
  transition:transform 60ms;
}
.chat-send-btn:active{transform:translateY(4px);box-shadow:inset -3px -3px 0 #16803C,inset 3px 3px 0 #4ADE80}

/* Site & Briefing */
.briefing-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.briefing-item{
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  padding:14px;box-shadow:3px 3px 0 rgba(0,0,0,0.2);
}
.briefing-label{font-size:10px;color:var(--fl-text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.briefing-value{font-size:14px;font-weight:600;color:var(--fl-text)}

.action-buttons{display:flex;gap:10px;flex-wrap:wrap}
.btn-action{
  flex:1;min-width:140px;padding:14px;text-align:center;
  font-family:var(--fl-font-brand);font-size:8px;
  text-decoration:none;cursor:pointer;border:none;
  letter-spacing:1px;transition:transform 60ms,box-shadow 60ms;
}
.btn-action-gold{
  background:var(--gold);color:#000;font-weight:700;
  box-shadow:inset -3px -3px 0 #B88600,inset 3px 3px 0 #FFD54F,0 4px 0 #7A5900;
}
.btn-action-gold:hover{box-shadow:inset -3px -3px 0 #B88600,inset 3px 3px 0 #FFE082,0 4px 0 #7A5900,0 0 20px var(--gold-glow)}
.btn-action-gold:active{transform:translateY(4px);box-shadow:inset -3px -3px 0 #B88600,inset 3px 3px 0 #FFD54F}
.btn-action-cyan{
  background:var(--cyan);color:#000;font-weight:700;
  box-shadow:inset -3px -3px 0 #00A876,inset 3px 3px 0 #66FFD1,0 4px 0 #007A55;
}
.btn-action-cyan:hover{box-shadow:inset -3px -3px 0 #00A876,inset 3px 3px 0 #99FFE0,0 4px 0 #007A55,0 0 20px var(--cyan-glow)}
.btn-action-cyan:active{transform:translateY(4px);box-shadow:inset -3px -3px 0 #00A876,inset 3px 3px 0 #66FFD1}
.btn-action-purple{
  background:var(--fl-purple);color:#fff;font-weight:700;
  box-shadow:inset -3px -3px 0 var(--fl-purple-800),inset 3px 3px 0 var(--fl-purple-300),0 4px 0 var(--fl-purple-950);
}
.btn-action-purple:hover{box-shadow:inset -3px -3px 0 var(--fl-purple-800),inset 3px 3px 0 var(--fl-purple-300),0 4px 0 var(--fl-purple-950),0 0 20px rgba(147,51,234,0.3)}
.btn-action-purple:active{transform:translateY(4px);box-shadow:inset -3px -3px 0 var(--fl-purple-800),inset 3px 3px 0 var(--fl-purple-300)}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state{
  display:none;text-align:center;padding:60px 20px;
}
.empty-state.show{display:block}
.empty-mascot{height:120px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(147,51,234,0.4));animation:mago-breath 4s ease-in-out infinite}
@keyframes mago-breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.04)}}
.empty-text{font-family:var(--fl-font-brand);font-size:9px;color:var(--fl-text-dim);line-height:2.2}

/* ============================================================
   OVERVIEW — Gráficos e Funil
   ============================================================ */
.section-title{
  font-family:var(--fl-font-brand);font-size:10px;color:var(--fl-text-muted);
  letter-spacing:1px;margin-bottom:16px;
}
.period-filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.period-label{font-size:11px;color:var(--fl-text-dim);text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.btn-period{
  padding:8px 16px;font-family:var(--fl-font-brand);font-size:7px;
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  color:var(--fl-text-dim);cursor:pointer;letter-spacing:1px;
  transition:all .15s;
}
.btn-period:hover{border-color:var(--fl-purple);color:var(--fl-purple-300)}
.btn-period.active{
  background:var(--fl-purple-900);border-color:var(--fl-purple);
  color:var(--fl-purple-300);
  box-shadow:2px 2px 0 var(--fl-purple-950);
}
.btn-filter-period{
  background:var(--fl-bg-card);
  border:1px solid var(--fl-border);
  color:var(--fl-text-muted);
  padding:6px 12px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
  font-family:var(--fl-font-brand);
  letter-spacing:1px;
  transition:all .2s;
}
.btn-filter-period.active{
  background:var(--fl-purple);
  border-color:var(--fl-purple);
  color:#fff;
}
.btn-filter-period:hover{
  border-color:var(--fl-purple);
  color:var(--fl-purple-300);
}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.chart-card{
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  padding:20px;
  box-shadow:4px 4px 0 rgba(0,0,0,0.2);
}
.chart-card.full-width{grid-column:1/-1}
.chart-title{
  font-family:var(--fl-font-brand);font-size:8px;color:var(--fl-text-muted);
  letter-spacing:1px;margin-bottom:16px;
}
.chart-container{position:relative;height:200px}

/* Funil */
.funnel-wrap{display:flex;flex-direction:column;gap:8px;max-width:700px}
.funnel-step{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border:2px solid var(--fl-border);
  background:var(--fl-bg-card);
  transition:border-color .2s;
}
.funnel-step:hover{border-color:var(--fl-border-md)}
.funnel-label{font-family:var(--fl-font-brand);font-size:7px;color:var(--fl-text-muted);letter-spacing:1px;flex:1;min-width:140px}
.funnel-bar-wrap{flex:2;height:14px;background:rgba(255,255,255,0.04);overflow:hidden;border:1px solid var(--fl-border)}
.funnel-bar{height:100%;transition:width .8s var(--fl-ease)}
.funnel-count{font-family:var(--fl-font-mono);font-size:14px;font-weight:600;min-width:50px;text-align:right}

/* ============================================================
   UTI DE LEADS
   ============================================================ */
.uti-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px;
}
.uti-desc{font-size:12px;color:var(--fl-text-dim);margin-bottom:18px;line-height:1.6}
.uti-tab{
  background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--fl-text-dim);font-family:var(--fl-font-brand);font-size:7px;
  letter-spacing:1px;padding:8px 14px 10px;cursor:pointer;transition:all .2s;
}
.uti-tab:hover{color:var(--fl-text)}
.uti-tab.active{color:var(--fl-purple-300);border-bottom-color:var(--fl-purple)}
.uti-enrich-form{
  background:var(--fl-bg-surface);border:1px solid var(--fl-border);
  padding:14px;margin-top:6px;display:grid;
  grid-template-columns:1fr 1fr;gap:8px;
}
.uti-enrich-form input{
  background:var(--fl-bg);border:1px solid var(--fl-border-md);color:var(--fl-text);
  padding:6px 10px;font-size:12px;font-family:var(--fl-font-mono);width:100%;
}
.uti-enrich-form input:focus{outline:none;border-color:var(--fl-purple)}
.uti-count-badge{
  font-family:var(--fl-font-mono);font-size:11px;
  padding:4px 12px;background:rgba(239,68,68,0.12);
  border:1px solid var(--danger);color:var(--danger);
}
.uti-table-wrap{overflow-x:auto}
.uti-table{
  width:100%;border-collapse:collapse;
  font-size:13px;
}
.uti-table th{
  padding:10px 14px;text-align:left;
  font-family:var(--fl-font-brand);font-size:7px;letter-spacing:1px;
  color:var(--fl-text-dim);border-bottom:2px solid var(--fl-border);
  background:var(--fl-bg-surface);white-space:nowrap;
}
.uti-table td{
  padding:12px 14px;border-bottom:1px solid var(--fl-border);
  color:var(--fl-text-muted);vertical-align:middle;
}
.uti-table tr:hover td{background:var(--fl-bg-hover)}
.uti-status-badge{
  font-family:var(--fl-font-mono);font-size:10px;
  padding:2px 8px;background:rgba(239,68,68,0.10);
  border:1px solid rgba(239,68,68,0.3);color:var(--danger);
  white-space:nowrap;
}
.btn-requalificar{
  padding:7px 14px;font-family:var(--fl-font-brand);font-size:7px;
  background:var(--gold);color:#000;border:none;cursor:pointer;
  box-shadow:2px 2px 0 #7A5900;letter-spacing:1px;
  transition:all .15s;white-space:nowrap;
}
.btn-requalificar:hover{box-shadow:2px 2px 0 #7A5900,0 0 10px var(--gold-glow)}
.btn-requalificar:active{transform:translateY(2px);box-shadow:none}
.uti-empty{
  text-align:center;padding:48px 20px;
  font-family:var(--fl-font-brand);font-size:9px;color:var(--success);line-height:2.4;
}

/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */
.config-section{max-width:100%}
.config-group{
  background:var(--fl-bg-card);border:2px solid var(--fl-border);
  padding:24px;margin-bottom:20px;
  box-shadow:4px 4px 0 rgba(0,0,0,0.2);
}
.config-group-title{
  font-family:var(--fl-font-brand);font-size:9px;color:var(--fl-purple-300);
  letter-spacing:1px;margin-bottom:18px;padding-bottom:12px;
  border-bottom:1px solid var(--fl-border);
}
.config-field{margin-bottom:16px}
.config-label{
  display:block;font-size:11px;color:var(--fl-text-dim);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;
}
.config-input,.config-select{
  width:100%;padding:12px;
  background:var(--fl-bg-surface);border:2px solid var(--fl-border);
  color:var(--fl-text);font-family:var(--fl-font-mono);font-size:13px;outline:none;
}
.config-input:focus,.config-select:focus{border-color:var(--fl-purple)}
.config-select option{background:var(--fl-bg-surface)}
.config-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-config-save{
  padding:14px 28px;font-family:var(--fl-font-brand);font-size:9px;
  background:var(--fl-purple);color:#fff;border:none;cursor:pointer;
  box-shadow:4px 4px 0 var(--fl-purple-950);letter-spacing:1px;
  transition:all .15s;
}
.btn-config-save:hover{box-shadow:4px 4px 0 var(--fl-purple-950),0 0 20px rgba(147,51,234,0.3)}
.btn-config-save:active{transform:translateY(2px);box-shadow:2px 2px 0 var(--fl-purple-950)}
.btn-config-cyan{background:var(--cyan);color:#000;box-shadow:4px 4px 0 #007A55}
.btn-config-cyan:hover{box-shadow:4px 4px 0 #007A55,0 0 20px var(--cyan-glow)}
.config-notice{
  font-size:12px;color:var(--fl-text-dim);margin-top:12px;
  padding:10px 14px;border:1px solid var(--fl-border);background:rgba(255,255,255,0.02);line-height:1.6;
}

/* ============================================================
   MOBILE SIDEBAR TOGGLE
   ============================================================ */
.sidebar-toggle{
  display:none;position:fixed;top:14px;left:14px;z-index:200;
  background:var(--fl-bg-card);border:2px solid var(--fl-purple);
  color:var(--fl-purple-300);font-size:18px;
  width:36px;height:36px;cursor:pointer;
  box-shadow:3px 3px 0 var(--fl-purple-950);
  align-items:center;justify-content:center;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1200px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:1024px){
  .charts-grid{grid-template-columns:1fr}
  .chart-card.full-width{grid-column:auto}
}
@media(max-width:768px){
  .sidebar{
    position:fixed;left:-250px;top:0;bottom:0;z-index:150;
    transition:left .3s var(--fl-ease);
  }
  .sidebar.open{left:0}
  .sidebar-toggle{display:flex}
  .main{padding:20px 16px;padding-top:60px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .briefing-grid{grid-template-columns:1fr}
  .modal{max-width:95vw}
  .config-row{grid-template-columns:1fr}
  .pipeline-controls{flex-wrap:wrap}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.modal-input{width:100%;background:var(--fl-bg-card);border:1px solid var(--fl-border);color:var(--fl-text);padding:8px 12px;border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.modal-input:focus{outline:none;border-color:var(--fl-purple);}
</style>

</head>
