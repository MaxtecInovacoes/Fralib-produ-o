<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FraLib OS</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fl-bg:         #0a0714;
      --fl-bg-surface: #0e0a1a;
      --fl-bg-card:    #12121a;
      --fl-purple:     #9333ea;
      --fl-purple-300: #c084fc;
      --fl-purple-400: #a855f7;
      --fl-purple-800: #2d1060;
      --fl-purple-900: #1a0a30;
      --fl-purple-950: #0e0718;
      --fl-border:     rgba(147,51,234,0.18);
      --fl-border-md:  rgba(147,51,234,0.35);
      --fl-text:       #f0f0f5;
      --fl-text-muted: #8888a0;
      --fl-text-dim:   #5a5a70;
      --fl-font-brand: 'Press Start 2P', monospace;
      --fl-font-ui:    'DM Sans', system-ui, sans-serif;
      --fl-font-mono:  'JetBrains Mono', monospace;
      --cyan:          #00FFB3;
      --gold:          #FFB800;
      --success:       #22c55e;
      --danger:        #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--fl-font-ui);
      background: var(--fl-bg);
      color: var(--fl-text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Orbs de fundo */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(147,51,234,0.20), transparent 70%);
      top: -100px; left: -100px;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,255,179,0.10), transparent 70%);
      bottom: -80px; right: -80px;
    }

    /* Card de login */
    .login-card {
      position: relative;
      z-index: 1;
      background: var(--fl-bg-card);
      border: 2px solid var(--fl-border-md);
      box-shadow: 8px 8px 0 rgba(0,0,0,0.5), 0 0 60px rgba(147,51,234,0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }

    /* Logo / título */
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-title {
      font-family: var(--fl-font-brand);
      font-size: 13px;
      background: linear-gradient(135deg, var(--fl-purple-300), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      line-height: 1.8;
    }
    .login-logo-sub {
      font-family: var(--fl-font-mono);
      font-size: 10px;
      color: var(--fl-text-dim);
      margin-top: 6px;
      letter-spacing: 2px;
    }

    /* Formulário */
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--fl-text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--fl-bg-surface);
      border: 2px solid var(--fl-border);
      color: var(--fl-text);
      font-family: var(--fl-font-ui);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--fl-purple);
      box-shadow: 0 0 0 3px rgba(147,51,234,0.12);
    }
    input::placeholder { color: var(--fl-text-dim); }

    /* Botão */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--fl-purple);
      color: #fff;
      border: 2px solid #7c22d4;
      font-family: var(--fl-font-brand);
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--fl-purple-950);
      transition: all 0.15s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: var(--fl-purple-400);
      box-shadow: 4px 4px 0 var(--fl-purple-950), 0 0 20px rgba(147,51,234,0.3);
    }
    .btn-login:active {
      transform: translateY(2px);
      box-shadow: 2px 2px 0 var(--fl-purple-950);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Mensagem de erro */
    .error-msg {
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Link de cadastro */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--fl-text-dim);
    }
    .login-footer a {
      color: var(--fl-purple-300);
      text-decoration: none;
    }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-title">FRALIB OS</div>
      <div class="login-logo-sub">CENTRAL DE COMANDO</div>
    </div>

    <div id="planoBanner" style="display:none;background:rgba(192,132,252,0.12);border:1px solid var(--fl-border-md);padding:10px 14px;margin-bottom:18px;font-size:12px;color:var(--fl-purple-300);text-align:center;letter-spacing:1px"></div>

    <div id="error" class="error-msg"></div>

    <!-- Form de LOGIN (default) -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login" id="btnLogin">ENTRAR</button>
    </form>

    <!-- Form de SIGNUP (mostrado quando ?signup=1) -->
    <form id="signupForm" style="display:none">
      <div class="form-group">
        <label for="signupNome">Seu nome</label>
        <input type="text" id="signupNome" name="nome" required autocomplete="name" placeholder="Como devemos te chamar" style="width:100%;padding:12px 14px;background:var(--fl-bg-surface);border:2px solid var(--fl-border);color:var(--fl-text);font-family:var(--fl-font-ui);font-size:15px;outline:none">
      </div>
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" name="email" required autocomplete="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="signupPassword">Senha (mínimo 12 caracteres)</label>
        <input type="password" id="signupPassword" name="password" required autocomplete="new-password" minlength="12" placeholder="••••••••••••">
      </div>
      <button type="submit" class="btn-login" id="btnSignup">CRIAR CONTA</button>
    </form>

    <div class="login-footer">
      <span id="footerLogin">Não tem conta? <a href="#" id="toSignup">Criar conta</a></span>
      <span id="footerSignup" style="display:none">Já tem conta? <a href="#" id="toLogin">Fazer login</a></span>
    </div>
  </div>

  <script>
    var loginForm  = document.getElementById('loginForm');
    var signupForm = document.getElementById('signupForm');
    var errorDiv   = document.getElementById('error');
    var btnLogin   = document.getElementById('btnLogin');
    var btnSignup  = document.getElementById('btnSignup');
    var planoBanner = document.getElementById('planoBanner');
    var footerLogin  = document.getElementById('footerLogin');
    var footerSignup = document.getElementById('footerSignup');

    // ── PR5: detectar ?signup=1&plano=X vindo da landing ────────────
    var params = new URLSearchParams(window.location.search);
    var PLANOS_VALIDOS = { starter: 'STARTER (R$97/mes)', pro: 'PRO BYOK (R$297/mes)' };
    var planoEscolhido = (params.get('plano') || '').toLowerCase();
    if (planoEscolhido && PLANOS_VALIDOS[planoEscolhido]) {
      localStorage.setItem('fralib_pending_plano', planoEscolhido);
    }
    var planoPendente = localStorage.getItem('fralib_pending_plano') || '';
    if (planoPendente && PLANOS_VALIDOS[planoPendente]) {
      planoBanner.textContent = 'PLANO ESCOLHIDO: ' + PLANOS_VALIDOS[planoPendente] + ' → conclua o cadastro para pagar';
      planoBanner.style.display = 'block';
    }

    function setModo(modo) {
      if (modo === 'signup') {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        footerLogin.style.display = 'none';
        footerSignup.style.display = 'inline';
      } else {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        footerLogin.style.display = 'inline';
        footerSignup.style.display = 'none';
      }
      errorDiv.classList.remove('show');
    }
    if (params.get('signup') === '1') setModo('signup');
    document.getElementById('toSignup').addEventListener('click', function(e){ e.preventDefault(); setModo('signup'); });
    document.getElementById('toLogin').addEventListener('click',  function(e){ e.preventDefault(); setModo('login'); });

    // Redirecionar se já logado (mas se houver plano pendente, vai pro checkout)
    var token = localStorage.getItem('fralib_token');
    if (token) {
      if (planoPendente && PLANOS_VALIDOS[planoPendente]) {
        iniciarCheckout(token, planoPendente);
      } else {
        window.location.href = '/dashboard';
      }
    }

    async function iniciarCheckout(jwt, plano) {
      try {
        var r = await fetch('/api/credits/criar-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwt },
          body: JSON.stringify({ plano: plano })
        });
        var d = await r.json();
        if (r.ok && d.checkout_url) {
          localStorage.removeItem('fralib_pending_plano');
          window.location.href = d.checkout_url;
        } else {
          errorDiv.textContent = 'Falha ao iniciar checkout: ' + (d.detail || 'tente novamente em /dashboard');
          errorDiv.classList.add('show');
          setTimeout(function(){ window.location.href = '/dashboard'; }, 3000);
        }
      } catch(e) {
        window.location.href = '/dashboard';
      }
    }

    // ── Signup ─────────────────────────────────────────────────────
    signupForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorDiv.classList.remove('show');
      btnSignup.disabled = true;
      btnSignup.textContent = 'CRIANDO...';
      var nome  = document.getElementById('signupNome').value.trim();
      var email = document.getElementById('signupEmail').value.trim();
      var pwd   = document.getElementById('signupPassword').value;
      try {
        var r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: pwd, nome: nome })
        });
        var d = await r.json();
        if (r.ok) {
          // Conta criada. O email de confirmacao foi enviado.
          // O plano pendente segue no localStorage; sera consumido apos confirmar email + login.
          signupForm.innerHTML = '<div style="text-align:center;padding:20px 0"><div style="font-size:48px;color:#22c55e;margin-bottom:12px">&#10004;</div><div style="font-size:14px;color:var(--fl-text);margin-bottom:8px">CONTA CRIADA!</div><div style="font-size:12px;color:var(--fl-text-muted);line-height:1.6">Enviamos um email de confirmacao para<br><strong>' + email.replace(/[<>"&]/g,'') + '</strong><br><br>Clique no link e depois faca login para concluir o pagamento do plano.</div></div>';
        } else {
          errorDiv.textContent = d.detail || 'Erro ao criar conta';
          errorDiv.classList.add('show');
          btnSignup.disabled = false;
          btnSignup.textContent = 'CRIAR CONTA';
        }
      } catch(err) {
        errorDiv.textContent = 'Erro de conexao. Tente novamente.';
        errorDiv.classList.add('show');
        btnSignup.disabled = false;
        btnSignup.textContent = 'CRIAR CONTA';
      }
    });

    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorDiv.classList.remove('show');
      btnLogin.disabled = true;
      btnLogin.textContent = 'ENTRANDO...';

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      try {
        var response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await response.json();

        if (response.ok) {
          localStorage.setItem('fralib_token', data.access_token);
          var pp = localStorage.getItem('fralib_pending_plano') || '';
          if (pp && PLANOS_VALIDOS[pp]) {
            btnLogin.textContent = 'INDO PRO CHECKOUT...';
            iniciarCheckout(data.access_token, pp);
          } else {
            window.location.href = '/dashboard';
          }
        } else if (response.status === 403 && response.headers.get('X-Require-Email-Confirmation') === '1') {
          // Email nao confirmado: mostrar mensagem + botao de reenviar
          errorDiv.innerHTML = '';
          var msg = document.createElement('div');
          msg.textContent = data.detail || 'Email nao confirmado.';
          errorDiv.appendChild(msg);
          var btnReenviar = document.createElement('button');
          btnReenviar.type = 'button';
          btnReenviar.textContent = 'REENVIAR EMAIL DE CONFIRMACAO';
          btnReenviar.style.cssText = 'margin-top:12px;background:#7c3aed;color:#fff;border:0;padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer';
          btnReenviar.onclick = async function() {
            btnReenviar.disabled = true;
            btnReenviar.textContent = 'ENVIANDO...';
            try {
              var r = await fetch('/api/auth/reenviar-confirmacao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
              });
              var d = await r.json();
              btnReenviar.textContent = r.ok ? 'EMAIL ENVIADO! VERIFIQUE SUA CAIXA' : (d.detail || 'Erro ao reenviar');
            } catch(_) {
              btnReenviar.textContent = 'Erro de conexao';
              btnReenviar.disabled = false;
            }
          };
          errorDiv.appendChild(btnReenviar);
          errorDiv.classList.add('show');
          btnLogin.disabled = false;
          btnLogin.textContent = 'ENTRAR';
        } else {
          errorDiv.textContent = data.detail || 'Email ou senha incorretos.';
          errorDiv.classList.add('show');
          btnLogin.disabled = false;
          btnLogin.textContent = 'ENTRAR';
        }
      } catch (err) {
        errorDiv.textContent = 'Erro de conexão. Tente novamente.';
        errorDiv.classList.add('show');
        btnLogin.disabled = false;
        btnLogin.textContent = 'ENTRAR';
      }
    });
  </script>
</body>
</html>
