server {
    listen 80;
    server_name chat.seunegociofralib.site;
    return 410;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.seunegociofralib.site;

    ssl_certificate /etc/letsencrypt/live/chat.seunegociofralib.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.seunegociofralib.site/privkey.pem;

    return 410;
}
