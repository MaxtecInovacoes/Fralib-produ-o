version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql://fralib_user:fralib_dev_password@postgres:5432/fralib_db
  REDIS_URL: redis://redis:6379/0
  FRALIB_SITES_DIR: /var/www/fralib/sites
  FRALIB_SITES_ROOT: /var/www/fralib/sites
  FRALIB_BUILDER_SANDBOX_ROOT: /tmp/fralib_builder
  FRALIB_BUILDER_MANIFEST_DIR: /app/logs/builder_manifests
  MEOWHATS_URL: http://host.docker.internal:3001
  FRALIB_SKIP_HTML_QUALITY_GATE: "0"
  WORKER_POLL_SECONDS: "3"
  WORKER_HEARTBEAT_SECS: "30"
  WORKER_REAP_SECS: "60"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fralib_db
      POSTGRES_USER: fralib_user
      POSTGRES_PASSWORD: fralib_dev_password
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - fralib-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fralib_user -d fralib_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - fralib-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fralib_user:fralib_dev_password@postgres:5432/fralib_db
      REDIS_URL: redis://redis:6379/0
      FRALIB_SITES_DIR: /var/www/fralib/sites
      FRALIB_SITES_ROOT: /var/www/fralib/sites
      FRALIB_BUILDER_SANDBOX_ROOT: /tmp/fralib_builder
      FRALIB_BUILDER_MANIFEST_DIR: /app/logs/builder_manifests
      MEOWHATS_URL: http://host.docker.internal:3001
      FRALIB_SKIP_HTML_QUALITY_GATE: "0"
    ports:
      - "8001:8000"
    volumes:
      - fralib-sites:/var/www/fralib/sites
      - fralib-logs:/app/logs
      - fralib-builder:/tmp/fralib_builder
      - /opt/fralib/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: ["python", "server.py"]

  worker-pipeline:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fralib_user:fralib_dev_password@postgres:5432/fralib_db
      REDIS_URL: redis://redis:6379/0
      FRALIB_SITES_DIR: /var/www/fralib/sites
      FRALIB_SITES_ROOT: /var/www/fralib/sites
      FRALIB_BUILDER_SANDBOX_ROOT: /tmp/fralib_builder
      FRALIB_BUILDER_MANIFEST_DIR: /app/logs/builder_manifests
      MEOWHATS_URL: http://host.docker.internal:3001
      FRALIB_SKIP_HTML_QUALITY_GATE: "0"
      WORKER_POLL_SECONDS: "3"
      WORKER_HEARTBEAT_SECS: "30"
      WORKER_REAP_SECS: "60"
      FRALIB_BUILDER_AUTO_APPROVE: "1"
      WORKER_JOB_TYPES: pipeline_lead,pipeline_multiplos
      FRALIB_BUILDER_ENGINE: openui
      MAX_PIPELINES_GLOBAL: "4"
      OPENUI_SERVICE_URL: http://host.docker.internal:3333
    volumes:
      - fralib-sites:/var/www/fralib/sites
      - fralib-logs:/app/logs
      - fralib-builder:/tmp/fralib_builder
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "worker.py"]
    deploy:
      replicas: 3

  worker-cron:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fralib_user:fralib_dev_password@postgres:5432/fralib_db
      REDIS_URL: redis://redis:6379/0
      FRALIB_SITES_DIR: /var/www/fralib/sites
      FRALIB_SITES_ROOT: /var/www/fralib/sites
      FRALIB_BUILDER_SANDBOX_ROOT: /tmp/fralib_builder
      FRALIB_BUILDER_MANIFEST_DIR: /app/logs/builder_manifests
      MEOWHATS_URL: http://host.docker.internal:3001
      FRALIB_SKIP_HTML_QUALITY_GATE: "0"
      WORKER_POLL_SECONDS: "2"
      WORKER_HEARTBEAT_SECS: "30"
      WORKER_REAP_SECS: "60"
      FRALIB_BUILDER_AUTO_APPROVE: "0"
      WORKER_JOB_TYPES: lead_supply_hunter,lead_supply_caio,lead_production_tick
      MAX_PIPELINES_GLOBAL: "0"
    volumes:
      - fralib-sites:/var/www/fralib/sites
      - fralib-logs:/app/logs
      - fralib-builder:/tmp/fralib_builder
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "worker.py"]
    deploy:
      replicas: 2

  worker-franz:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fralib_user:fralib_dev_password@postgres:5432/fralib_db
      REDIS_URL: redis://redis:6379/0
      FRALIB_SITES_DIR: /var/www/fralib/sites
      FRALIB_SITES_ROOT: /var/www/fralib/sites
      FRALIB_BUILDER_SANDBOX_ROOT: /tmp/fralib_builder
      FRALIB_BUILDER_MANIFEST_DIR: /app/logs/builder_manifests
      MEOWHATS_URL: http://host.docker.internal:3001
      FRALIB_SKIP_HTML_QUALITY_GATE: "0"
      WORKER_POLL_SECONDS: "5"
      WORKER_HEARTBEAT_SECS: "30"
      WORKER_REAP_SECS: "60"
      WORKER_JOB_TYPES: franz_outreach,bryan_outreach
      MAX_PIPELINES_GLOBAL: "0"
    volumes:
      - fralib-sites:/var/www/fralib/sites
      - fralib-logs:/app/logs
      - fralib-builder:/tmp/fralib_builder
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "worker.py"]
    deploy:
      replicas: 1

volumes:
  fralib-postgres:
  fralib-redis:
  fralib-sites:
  fralib-logs:
  fralib-builder:
