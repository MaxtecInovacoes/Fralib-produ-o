# Canonical Nginx config for the FraLib public application.
server {
    listen 443 ssl;
    server_name www.seunegociofralib.site;
    ssl_certificate /etc/letsencrypt/live/seunegociofralib.site-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seunegociofralib.site-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://seunegociofralib.site$request_uri;
}

server {
    listen 443 ssl;
    server_name seunegociofralib.site;
    root /var/www/fralib;
    index index.html landing.html;
    access_log /var/log/nginx/seunegociofralib-access.log;
    error_log /var/log/nginx/seunegociofralib-error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /api/logs/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    location /maestro/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ~ ^/studio/ {
        try_files /studio.html =404;
    }

    # Admin is the only canonical tenant/operator UI.
    location = /dashboard {
        return 302 /admin.html$is_args$args;
    }

    location = /dashboard.html {
        return 302 /admin.html$is_args$args;
    }

    location = /admin {
        return 302 /admin.html;
    }

    location = /login.html {
        return 302 /login$is_args$args;
    }

    location = /planos.html {
        return 302 /planos$is_args$args;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location ~* ^/sites/.+\.(?:js|css|png|jpg|jpeg|webp|avif|svg|ico|woff2?|mp4|webm)$ {
        root /var/www/fralib;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag on;
    }

    location /sites/ {
        alias /var/www/fralib/sites/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag on;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control no-cache;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    ssl_certificate /etc/letsencrypt/live/seunegociofralib.site-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seunegociofralib.site-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name seunegociofralib.site www.seunegociofralib.site;
    return 301 https://seunegociofralib.site$request_uri;
}
